{t:"Thellim",q:"Argumenti i parë për vërtetësinë e medh'hebit të selefit është:",o:["Numri i madh i selefit","Përputhja e plotë e tij me atë që tregojnë Kurani e Sunneti","Vjetërsia e tij","Thjeshtësia e gjuhës"],a:1,e:"Kush e ndjek rrugën e selefit me dije e drejtësi e gjen në përputhje të plotë me Librin e Sunnetin — argumenti i parë i Hamauijes."},
{t:"Thellim",q:"Rezultati përmbledhës i Tedmurijes: kush mohon cilësitë e Allahut është ___, e kush i ngjason me krijesat është ___:",o:["i urtë / i ditur","mohues (muattil xhahid) / ngjasues injorant (mumeththil xhahil)","besimtar / dijetar","arab / joarab"],a:1,e:"Kush mohon është xhahid muattil, kush ngjason është xhahil mumeththil; Ehlu Sunneti mes tyre: pohim pa ngjasim."},
{t:"Thellim",q:"Pohimi se mënyra e cilësive të Allahut është «e tillë e e tillë» pa e kufizuar me të ngjashëm, është:",o:["Temthil","Tekjif (i ndaluar me sem' e akl)","Teukif","Pohim i lejuar"],a:1,e:"Edhe pa ngjasim, pohimi i një mënyre të caktuar për cilësitë është tekjif — «القول على الله بلا علم»; ndalohet."},
{t:"Thellim",q:"Kurani është i mbushur me argumente racionale për emrat e cilësitë; kjo tregon se mendja e shëndoshë:",o:["Bie ndesh me shpalljen","Pajtohet me shpalljen dhe nuk e kundërshton atë","S'ka fare vend","Mbizotëron mbi shpalljen"],a:1,e:"Mendja e pastër pajtohet me tekstin; prandaj Hamauija sjell edhe argumente aklije krahas sem'ijeve — s'ka kundërthënie të vërtetë mes akl e nakl."},

/* ——— Shtesa (nivel universitar) ——— */
{t:"Emrat",q:"Pse jo çdo fjalë që i atribuohet Allahut në tekst (si «en-nazil», «el-xhai») bëhet automatikisht emër i Tij?",o:["Sepse ato s'janë reale","Sepse emri kërkon teukif të posaçëm dhe kuptim lavdie (husn); derë e emrave është më e ngushtë se derë e cilësive","Sepse mendja i refuzon","Sepse janë metafora"],a:1,e:"Çdo emër jep cilësi, por jo çdo cilësi/vepër jep emër; emrat janë teukifijje e kërkojnë bazë të veçantë."},
{t:"Emrat",q:"Emri «Er-Rahman» është husna sepse ngërthen:",o:["Një mëshirë të ngjashme me mëshirën e krijesave","Mëshirën e plotë e të përgjithshme që përfshin çdo krijesë, pa mangësi","Vetëm mëshirën ndaj besimtarëve","Mëshirën si cilësi të krijuar"],a:1,e:"Er-Rahman ngërthen rahmetin e përsosur, të pakufizuar — ndaj është prej el-esmau'l-husna."},
{t:"Cilësitë",q:"Pse cilësitë «khaberijje» quhen pikërisht kështu?",o:["Sepse janë lajme për të ardhmen","Sepse njihen vetëm nga lajmi (el-khaber = teksti), jo nga mendja a shqisa","Sepse i transmetuan vetëm disa","Sepse janë metaforike"],a:1,e:"Khaberijje = të njohura vetëm me khaber (tekst), si uexh, jedejn, ajnejn — mendja s'do t'i kapte pa shpalljen."},
{t:"Cilësitë",q:"Kënaqësia (rida), hidhërimi (gadab) dhe ardhja (mexhi') për gjykim janë shembuj të cilësive:",o:["Vetjake të pandryshueshme","Veprore (fi'lijje), të lidhura me vullnetin","Mohuese","Khaberijje të pastra"],a:1,e:"Rida, gadab, mexhi' lidhen me meshi'enë e Allahut — Ai i shfaq kur të dojë; pra cilësi fi'lijje."},
{t:"Cilësitë",q:"Në vlerësim, cilësitë pohuese (thubutijje) krahasuar me ato mohuese (selbijje) janë:",o:["Më pak të rëndësishme","Më parësore — tregojnë medh e kemal, kurse selbijjet vetëm mohojnë mangësinë (me pohim të kundërtës)","Të barabarta në funksion","Të dyja thjesht mohime"],a:1,e:"Thubutijjet janë boshti (lavdi e përsosmëri); selbijjet vijnë për të mbështetur, duke mohuar naksin e pohuar kemalin e kundërt."},
{t:"Grupet",q:"Dallimi mes «te'vilit» të lavdëruar (interpretim i saktë) dhe tahrifit është:",o:["Janë e njëjta gjë","Te'vili i saktë mbështetet në provë sheriatike që e kërkon; tahrifi largon fjalën nga dhahiri pa provë","Te'vili bëhet nga Mutezilët, tahrifi nga selefi","Te'vili lidhet me emrat"],a:1,e:"Muattilet e quajtën shtrembërimin «te'vil», por pa dëshmi që e kërkon largimin nga dhahiri — pra në të vërtetë tahrif."},
{t:"Grupet",q:"Pse teshbihu konsiderohet «xhinaje (krim) ndaj teksteve»?",o:["Sepse i lë tekstet pa kuptim","Sepse ia vesh tekstit kuptimin e ngjasimit, kundër fjalës «لَيْسَ كَمِثْلِهِ شَيْءٌ»","Sepse i pohon cilësitë","Sepse i lexon arabisht"],a:1,e:"Mushebbihu e ngarkon tekstin me kuptim të kotë (ngjasim) që Kurani vetë e përjashton — pra krim ndaj domethënies së tij."},
{t:"Grupet",q:"Teshbihu, si humbje, ndahet në dy lloje:",o:["I madh dhe i vogël","Teshbihu'l-mahluk bil-halik (krijesën me Krijuesin) dhe teshbihu'l-halik bil-mahluk (Krijuesin me krijesën)","I hapur dhe i fshehtë","Arab dhe joarab"],a:1,e:"Lloji i parë: ngjasimi i krijesës me Allahun (si idhujt, ekzagjerimi në lavdërim); i dyti: ngjasimi i cilësive të Allahut me ato të krijesave."},
{t:"Grupet",q:"Pse ta'tili dhe tahrifi shpesh bashkëshoqërohen te mohuesit?",o:["Janë sinonime","Muattili e përdor tahrifin (shtrembërimin e tekstit) si MJET për të arritur qëllimin: ta'tilin (mohimin e cilësisë)","Tahrifi vjen pas pohimit","S'kanë lidhje"],a:1,e:"Për të mohuar një cilësi (ta'til), muattili detyrohet ta shtrembërojë tekstin që e pohon atë (tahrif) — pra mjeti dhe qëllimi."},
{t:"Tedmurija",q:"Shubha (dyshimi) themelor i Mumethilëve ishte:",o:["Se Allahu s'ka cilësi","Se Allahu na foli me çka e kuptojmë, pra cilësitë duhet të jenë si tonat","Se cilësitë janë shumë","Se teksti është metaforë"],a:1,e:"Mumethili pretendon se fjala e Allahut s'do kuptohej pa ngjasim; përgjigjja: fjala e Tij është e njohur në kuptim, pa qenë si e krijesave."},
{t:"Tedmurija",q:"Grupi i tretë e përshkruan Allahun si «el-mevxhudu'l-mutlak bi shartil-itlak»; kjo nënkupton:",o:["Ekzistuesin më të përsosur","Një ekzistencë abstrakte që s'gjendet veçse në mendje — pra mohim i çdo cilësie reale","Allahun mbi Arsh","Krijuesin me cilësi të plota"],a:1,e:"«Ekzistuesi absolut me kusht abstraktimi» s'ekziston jashtë mendjes; pra grupi i tretë e zbraz Allahun nga çdo realitet — nefj i pastër."},
{t:"Tedmurija",q:"Lidhur me besimin në Allahun dhe Ditën e Fundit, Tedmurija i ndan njerëzit në tri grupe. Grupi i humbur më i rëndë (që mohon realitetin e të dyjave) janë:",o:["Esharitë","Karamitët, batinitët dhe filozofët","Mutezilët","Mushebbihet"],a:1,e:"Grupi i tretë (karamitë/batinitë/filozofë) i bën lajmet për Allahun e Ahiretin thjesht «takhjil» (imagjinatë) — nga më mosbesimtarët."},
{t:"Tedmurija",q:"Batinitët që mohojnë realitetin e asaj që lajmëroi Allahu për Veten dhe Ahiretin janë, sipas ixhmasë:",o:["Prej Ehlu Sunnetit","Më mosbesimtarë se çifutët dhe të krishterët","Të pagabueshëm","Grupi më i afërt me selefin"],a:1,e:"Batinitët (el-melahide) janë sipas ixhmasë së muslimanëve më kafira se jehuditë e nasarat, ngaqë mohojnë vetë realitetet fetare."},
{t:"Hamawija",q:"Pse selefi quhen «verethetu'l-enbija» (trashëgimtarët e profetëve) në çështjen e cilësive?",o:["Sepse trashëguan pasuri","Sepse e morën dijen e tyre drejtpërdrejt nga burimet e shpalljes dhe realitetet e imanit","Sepse ishin të afërm të profetëve","Sepse jetuan afër tyre"],a:1,e:"Si trashëgimtarë të pejgamberëve, selefi e përcollën njohjen e Allahut nga vahji — prandaj janë a'lem se khalefi që e përzien me burime të huaja."},
{t:"Hamawija",q:"Vargjet e Razit «نهاية إقدام العقول عقال... وغاية سعينا في طوله عناء» shprehin:",o:["Lavdinë e kelamit","Se fundi i përpjekjes së mendjeve është hutim e lodhje — pranim i kotësisë së rrugës racionale të pastër","Epërsinë e filozofisë","Mohimin e Kuranit"],a:1,e:"Razi, në fund të jetës, pranoi hutimin e mendjeve dhe u kthye te rruga e Kuranit — dëshmi se rruga e selefit është a'lem e ahkem."},
{t:"Uluvvi",q:"Lartësia (uluvvi) e Allahut klasifikohet te cilësitë:",o:["Veprore (fi'lijje)","Vetjake (dhatijje)","Mohuese (selbijje)","Khaberijje të pastra"],a:1,e:"Uluvvi është cilësi dhatijje — Allahu është gjithmonë i Larti mbi krijesat e Tij, me Qenie e me cilësi."},
{t:"Arshi",q:"Pse interpretimi i «اسْتَوَى عَلَى الْعَرْشِ» si «istivla» (pushtoi) refuzohet?",o:["Sepse istivlaja është e bukur","Sepse kuptimi gjuhësor i «isteva ala» është lartësi/qëndrim, e «istivla» është tahrif pa provë (dhe nënkupton kundërshtim të mëparshëm)","Sepse Arshi s'ekziston","Sepse e thonë selefi"],a:1,e:"«Isteva ala» = u ngrit e qëndroi lart; «istivla» s'ka bazë gjuhësore këtu dhe nënkupton se dikush ia kundërshtonte Arshin më parë — e kotë."},
{t:"Arshi",q:"Abdulkadir El-Xhilani, në veprën e tij «El-Gunje», pohoi se Allahu:",o:["Është në çdo vend","Është me drejtimin e lartësisë, i ngjitur mbi Arsh e që rrethon mbretërinë","S'është mbi Arsh","Është i përzier me krijesat"],a:1,e:"El-Xhilani: «وهو سبحانه بجهة العلو، مستوٍ على العرش، محتوٍ على الملك» — dëshmi e pohimit të uluvvit edhe te dijetarët e mëvonshëm."},
{t:"Meijja",q:"Meijja (bashkësia) e vërtetë e Allahut me krijesat NUK nënkupton:",o:["Dijen e Tij për ta","Fuqinë e Tij mbi ta","Përzierjen a vendosjen e Qenies së Tij mes tyre","Sundimin e Tij mbi ta"],a:2,e:"Meijja shpreh dije, fuqi, dëgjim, shikim e sundim — kurrë përzierje a prani trupore; prandaj s'bie ndesh me uluvvin."},
{t:"Çështje",q:"Pse iradeja kaunijje përfshin edhe atë që Allahu NUK e do (si kufri i Iblisit)?",o:["Sepse Allahu e do kufrin","Sepse kaunijja është meshi'eja që realizohet patjetër, pavarësisht dashurisë — ndryshe nga sher'ijja (dashuria)","Sepse s'ka dallim mes dy iradeve","Sepse kufri është i detyruar"],a:1,e:"Allahu e lejoi (kaunen) kufrin e Iblisit që të ndodhte, por s'e deshi (sher'an) atë — dallimi mes iradës kaunijje e sher'ijje."},
{t:"Metoda",q:"Pse «besimi se Allahu ka nevojë për krijesat» s'është kurrë prej besimit të drejtë?",o:["Sepse është e vështirë","Sepse nevoja është mangësi, kurse Allahu është El-Ganijj (i Pavaruri absolut) — krijesat kanë nevojë për Të","Sepse s'është në Kuran","Sepse e thonë filozofët"],a:1,e:"Pavarësia absolute (gina) është cilësi kemal-i; nevoja do të ishte naks, e pamundur për Allahun."},
{t:"Metoda",q:"Formula «pohim pa temthil, tenzih pa ta'til» përmbledh:",o:["Metodën e Mutezilëve","Akiden e Ehlu Sunnetit për emrat e cilësitë","Metodën e Mushebbihëve","Metodën e Mufeuvide"],a:1,e:"Ithbat bila temthil (kundër Mumethilëve) dhe tenzih bila ta'til (kundër Muattilëve) — rruga e mesme e Ehlu Sunnetit."},
{t:"Metoda",q:"Katër gjërat që Ehlu Sunneti i mohon në POHIMIN e cilësive janë:",o:["Dëgjimi, mendja, shqisa, fitra","Tahrifi, ta'tili, tekjifi dhe temthili","Kurani, Sunneti, ixhmaja, kijasi","Dashuria, frika, shpresa, mbështetja"],a:1,e:"«من غير تحريف ولا تعطيل ولا تكييف ولا تمثيل» — katër mohimet që shoqërojnë pohimin e cilësive te Ehlu Sunneti."},
{t:"Thellim",q:"Thëniet e El-Euza'ijt dhe ixhmaja e selefit mbi uluvvin dëshmojnë se mohimi i lartësisë së Allahut është:",o:["Mendimi i selefit","Risi (bidat) që u shfaq pas brezit të selefit","Pajtim i ummetit","Domosdoshmëri racionale"],a:1,e:"El-Euza'ij: «نقول إن الله فوق عرشه» — pra mohimi i uluvvit është risi që bie ndesh me ixhmanë e selefit."},
{t:"Thellim",q:"Cilësia e të ardhurit (mexhi') e Allahut për të gjykuar mes robërve Ditën e Kijametit klasifikohet si:",o:["Cilësi vetjake","Cilësi veprore (fi'lijje)","Cilësi mohuese","Metaforë e ndihmës"],a:1,e:"«وَجَاءَ رَبُّكَ» — mexhi'i për fasl (gjykim) është cilësi fi'lijje reale, e lidhur me vullnetin, e pohohet pa tekjif."},
{t:"Thellim",q:"Pse Ibn Abasi tregoi se Kursija NUK është vetë Arshi?",o:["Sepse Kursija s'ekziston","Sepse hadithi i Ebu Dherrit tregon dallimin e madhësisë: Arshi është shumë më i madh se Kursija","Sepse Kursija është metaforë","Sepse Arshi është nën Kursi"],a:1,e:"Kursija = vendi i dy Këmbëve; Arshi (froni) është shumë më i madh — «فضل العرش على الكرسي كفضل الفلاة على تلك الحلقة»."},
{t:"Thellim",q:"Shprehja «لائقة به» (që i përshtatet Atij) në pohimin e cilësive synon:",o:["Mohimin e realitetit të cilësisë","Ruajtjen e realitetit të cilësisë duke larguar njëkohësisht ngjasimin me krijesat","Interpretimin metaforik","Dorëzimin e kuptimit"],a:1,e:"«La'ike bihi» e ruan hakikan e cilësisë e e tenzihon nga ngjasimi — thelbi i «pohim pa temthil»."},
{t:"Thellim",q:"Përmbledhja përfundimtare e Hamauijes për rrugën e selefit është se ajo është:",o:["Vetëm më e sigurt","Më e sigurt (aslem), më e ditur (a'lem) DHE më e urtë (ahkem)","Më e vështirë","E barabartë me rrugën e khalefit"],a:1,e:"Hamauija e mbyll me: «وبهذا يتبين أن طريقة السلف أسلم وأعلم وأحكم» — kundër pretendimit se khalefi janë a'lem ue ahkem."}
];

/* ============================ LOGJIKA ============================ */
const N = QUESTIONS.length;
const LS_KEY = "kuiz-emrat-cilesite-v2";
const KEYS = ["A","B","C","D"];
const app = document.getElementById("app");

let state = null;

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function buildPrepared(){
  // për secilën pyetje: renditje e përzier e opsioneve + indeksi i saktë në atë renditje
  return QUESTIONS.map(q=>{
    const idx = shuffle([0,1,2,3]);
    const correct = idx.indexOf(q.a);
    return {order:idx, correct};
  });
}
function freshState(){
  return {prepared:buildPrepared(), answers:new Array(N).fill(null), cur:0, finished:false, screen:"start"};
}
function save(){
  try{localStorage.setItem(LS_KEY, JSON.stringify(state));}catch(e){}
}
function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return null;
    const s = JSON.parse(raw);
    if(s && Array.isArray(s.answers) && s.answers.length===N && Array.isArray(s.prepared) && s.prepared.length===N) return s;
  }catch(e){}
  return null;
}

function score(){
  let correct=0, wrong=0, blank=0;
  for(let i=0;i<N;i++){
    const a=state.answers[i];
    if(a===null){blank++;continue;}
    if(a===state.prepared[i].correct) correct++; else wrong++;
  }
  return {correct,wrong,blank};
}

/* ---------- Render ---------- */
function render(){
  if(state.screen==="start") return renderStart();
  if(state.screen==="quiz")  return renderQuiz();
  if(state.screen==="result")return renderResult();
}

function esc(s){return s;} // teksti ynë është i besueshëm

function renderStart(){
  const resumable = state.answers.some(a=>a!==null) && !state.finished;
  app.innerHTML = `
  <div class="wrap">
    <div class="hero">
      <div class="hero-top">
        <div class="eyebrow">Akide · Emrat dhe Cilësitë e Allahut</div>
        <h1>Kuiz me ${N} pyetje</h1>
        <p class="hero-sub">Bazuar në tri libra: Takribut-Tedmurijje, El-Kavaidul-Muthla dhe Fet'hu Rabbil-Berijje (telkhisi i Hamauijes).</p>
      </div>
      <div class="creed">
        <div class="lbl">Besimi i Ehlu Sunnetit</div>
        <p>Ne jemi Ehlu Sunnet. Në akide i kundërshtojmë <b>Maturiditë</b>, <b>Esharitë</b>, <b>Mutezilët</b>, <b>Xhehmijtë</b> dhe <b>filozofët gulat</b>; dhe ia pohojmë Allahut emrat dhe cilësitë ashtu siç i takojnë Atij — pa tahrif, pa ta'til, pa tekjif e pa temthil.</p>
      </div>
      <div class="meta-row">
        <div class="stat"><b>${N}</b><span>pyetje me 4 opsione</span></div>
        <div class="stat"><b>1</b><span>përgjigje e saktë secila</span></div>
        <div class="stat"><b>Fund</b><span>përgjigjet shfaqen në fund</span></div>
      </div>
      <ul class="rules">
        <li>Përgjigju njërës pyetje pas tjetrës — përgjigjja <b>nuk</b> të shfaqet menjëherë.</li>
        <li>Në çdo pyetje ke butonin <b style="color:var(--gold)">💡 Sqarim</b>: e prek dhe të del përgjigjja e saktë me një shpjegim të shkurtër pse.</li>
        <li>Në fund del rezultati: ${N} numra; numrat e gabuar me <b style="color:var(--wrong)">të kuqe</b>, të saktët me <b style="color:var(--correct)">të gjelbër</b>.</li>
        <li>Prek çdo numër për të parë pyetjen: zgjedhja jote e gabuar del me të kuqe, e sakta me të gjelbër.</li>
        <li>Mund të lëvizësh para/mbrapa dhe të kërcesh te çdo pyetje.</li>
      </ul>
      <div class="actions">
        <button class="btn" id="startBtn">${resumable?"Vazhdo kuizin":"Fillo kuizin"}</button>
        ${resumable?`<button class="btn ghost" id="restartBtn">Fillo nga e para</button>`:""}
        <button class="btn ghost" id="themeBtn" aria-label="Ndërro temën">◑ Temë</button>
      </div>
      <p class="books">Librat: <b>تقريب التدمرية</b> (f. 21–46) · <b>القواعد المثلى</b> – Ibn Uthejmin · <b>فتح رب البرية بتلخيص الحموية</b> – Ibn Uthejmin.</p>
    </div>
    <p class="foot">Ia pohojmë Allahut emrat dhe cilësitë ashtu siç i takojnë madhështisë së Tij. «لَيْسَ كَمِثْلِهِ شَيْءٌ وَهُوَ السَّمِيعُ الْبَصِيرُ»</p>
  </div>`;
  document.getElementById("startBtn").onclick=()=>{state.screen="quiz";save();render();};
  const rb=document.getElementById("restartBtn");
  if(rb) rb.onclick=()=>{state=freshState();save();render();};
  document.getElementById("themeBtn").onclick=toggleTheme;
}

function renderQuiz(){
  const i=state.cur, q=QUESTIONS[i], prep=state.prepared[i];
  const answered=state.answers.filter(a=>a!==null).length;
  const pct=Math.round(((i)/N)*100);
  const optsHtml = prep.order.map((origIdx,pos)=>{
    const sel = state.answers[i]===pos;
    return `<button class="opt ${sel?"sel":""}" data-pos="${pos}">
      <span class="key">${KEYS[pos]}</span>
      <span class="txt">${q.o[origIdx]}</span>
    </button>`;
  }).join("");
  app.innerHTML = `
  <div class="topbar"><div class="topbar-in">
    <button class="iconbtn" id="homeBtn" aria-label="Ballina">⌂</button>
    <div class="counter">Pyetja ${i+1}<small> / ${N}</small></div>
    <div class="progress"><i style="width:${pct}%"></i></div>
    <button class="iconbtn" id="themeBtn">◑</button>
  </div></div>
  <div class="wrap" style="padding-top:0">
    <div class="card">
      <div class="qtag">${q.t}</div>
      <p class="qtext">${q.q}</p>
      <div class="opts" id="opts">${optsHtml}</div>
      <button class="btn ghost sm hintbtn" id="hintBtn">💡 Shfaq përgjigjen &amp; sqarimin</button>
      <div class="navbtns">
        <button class="btn ghost sm" id="prevBtn" ${i===0?"disabled":""}>‹ Mbrapa</button>
        <button class="btn ghost sm" id="jumpBtn">▦ Lista (${answered}/${N})</button>
        <span class="spacer"></span>
        ${i<N-1?`<button class="btn sm" id="nextBtn">Tjetra ›</button>`
                :`<button class="btn sm" id="finishBtn">Përfundo ✓</button>`}
      </div>
    </div>
    <div id="jumpWrap" hidden></div>
    <div style="margin-top:16px;text-align:center">
      <button class="btn ghost sm" id="finishAnytime">Përfundo kuizin tani</button>
    </div>
  </div>`;

  document.querySelectorAll(".opt").forEach(b=>{
    b.onclick=()=>{
      state.answers[i]=parseInt(b.dataset.pos,10);
      save();
      // shëno pa dhënë përgjigjen; kalo automatikisht pas një çasti
      document.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));
      b.classList.add("sel");
      setTimeout(()=>{ if(state.cur<N-1){state.cur++;render();} else {render();} }, 180);
    };
  });
  document.getElementById("homeBtn").onclick=()=>{state.screen="start";save();render();};
  document.getElementById("themeBtn").onclick=toggleTheme;
  const prev=document.getElementById("prevBtn"); if(prev) prev.onclick=()=>{if(i>0){state.cur--;render();}};
  const next=document.getElementById("nextBtn"); if(next) next.onclick=()=>{if(i<N-1){state.cur++;render();}};
  const fin=document.getElementById("finishBtn"); if(fin) fin.onclick=confirmFinish;
  document.getElementById("finishAnytime").onclick=confirmFinish;
  document.getElementById("jumpBtn").onclick=toggleJump;
  document.getElementById("hintBtn").onclick=()=>showExplanation(i);
}

function showExplanation(i){
  const q=QUESTIONS[i], prep=state.prepared[i];
  // gjej shkronjën/tekstin e opsionit të saktë në renditjen e shfaqur
  const pos = prep.correct;
  const origIdx = prep.order[pos];
  const bk=document.createElement("div");
  bk.className="modal-bk";
  bk.innerHTML=`<div class="modal" role="dialog" aria-modal="true">
    <div class="mtag">${q.t} · Pyetja ${i+1}</div>
    <p class="mq">${q.q}</p>
    <div class="ans">
      <span class="key">${KEYS[pos]}</span>
      <span class="atx">${q.o[origIdx]}</span>
    </div>
    <div class="why"><b>Pse kjo përgjigje</b>${q.e}</div>
    <div class="closeRow"><button class="btn sm" id="closeHint">Mbylle</button></div>
  </div>`;
  document.body.appendChild(bk);
  const close=()=>{bk.remove();document.removeEventListener("keydown",esc);};
  const esc=(e)=>{if(e.key==="Escape")close();};
  bk.addEventListener("click",(e)=>{if(e.target===bk)close();});
  bk.querySelector("#closeHint").onclick=close;
  document.addEventListener("keydown",esc);
}

function toggleJump(){
  const w=document.getElementById("jumpWrap");
  if(!w) return;
  if(!w.hidden){w.hidden=true;return;}
  const cells = QUESTIONS.map((q,k)=>{
    const ans = state.answers[k]!==null;
    const cur = k===state.cur;
    return `<button class="cell ${ans?"answered":""} ${cur?"current":""}" data-k="${k}">${k+1}</button>`;
  }).join("");
  w.innerHTML=`<div class="jump"><h3>Kërce te pyetja</h3><div class="grid-n">${cells}</div></div>`;
  w.hidden=false;
  w.querySelectorAll(".cell").forEach(c=>{
    c.onclick=()=>{state.cur=parseInt(c.dataset.k,10);render();};
  });
  w.scrollIntoView({behavior:"smooth",block:"nearest"});
}

function confirmFinish(){
  const blank = state.answers.filter(a=>a===null).length;
  // ndërto një panel konfirmimi brenda faqes (pa confirm())
  const msg = blank>0
    ? `Ke ${blank} pyetje pa përgjigje. Këto do të numërohen si gabim. A dëshiron të përfundosh?`
    : `I ke përgjigjur të gjitha pyetjeve. A dëshiron të përfundosh dhe të shohësh rezultatin?`;
  const bar = document.createElement("div");
  bar.style.cssText="position:fixed;inset:auto 0 0 0;z-index:30;background:var(--surface);border-top:1px solid var(--border);box-shadow:var(--shadow);padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))";
  bar.innerHTML=`<div class="wrap" style="padding:0;display:flex;gap:12px;align-items:center;flex-wrap:wrap">
    <span style="flex:1 1 14rem;min-width:0">${msg}</span>
    <button class="btn ghost sm" id="cancelFin">Jo, kthehu</button>
    <button class="btn sm" id="okFin">Po, përfundo</button></div>`;
  document.body.appendChild(bar);
  document.getElementById("cancelFin").onclick=()=>bar.remove();
  document.getElementById("okFin").onclick=()=>{bar.remove();state.finished=true;state.screen="result";state.cur=0;save();render();};
}

let revFilter="all";
function renderResult(){
  const s=score();
  const pct=Math.round((s.correct/N)*100);
  const cells = QUESTIONS.map((q,k)=>{
    const a=state.answers[k];
    let cls="blank", lab=(k+1);
    if(a!==null){ cls = (a===state.prepared[k].correct)?"correct":"wrong"; }
    return `<button class="cell ${cls}" data-k="${k}" aria-label="Pyetja ${k+1}">${k+1}</button>`;
  }).join("");
  app.innerHTML=`
  <div class="wrap">
    <div class="score">
      <div class="eyebrow" style="color:var(--gold)">Rezultati</div>
      <div class="big">${s.correct}<span style="font-size:.4em;color:var(--muted)"> / ${N}</span></div>
      <div class="pct">${pct}% të sakta</div>
      <div class="tags">
        <span class="pill ok">✓ ${s.correct} saktë</span>
        <span class="pill no">✕ ${s.wrong} gabim</span>
        ${s.blank?`<span class="pill sk">○ ${s.blank} pa përgjigje</span>`:""}
      </div>
    </div>

    <div class="legend">
      <span><i class="dot c"></i> saktë</span>
      <span><i class="dot w"></i> gabim</span>
      <span><i class="dot b"></i> pa përgjigje</span>
      <span style="margin-inline-start:auto">Prek numrin për ta parë pyetjen ↓</span>
    </div>
    <div class="jump" style="margin-top:0"><div class="grid-n" id="resGrid">${cells}</div></div>

    <div class="filterbar">
      <button class="chip ${revFilter==="all"?"on":""}" data-f="all">Të gjitha</button>
      <button class="chip ${revFilter==="wrong"?"on":""}" data-f="wrong">Vetëm gabimet (${s.wrong+s.blank})</button>
      <button class="chip ${revFilter==="correct"?"on":""}" data-f="correct">Vetëm të saktat (${s.correct})</button>
    </div>
    <div class="review" id="review"></div>

    <div style="margin-top:26px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center">
      <button class="btn" id="againBtn">Rifillo kuizin</button>
      <button class="btn ghost" id="homeBtn">Ballina</button>
      <button class="btn ghost" id="themeBtn">◑ Temë</button>
    </div>
    <p class="foot">Allahu e di më së miri. Ia pohojmë Atij emrat dhe cilësitë ashtu siç i takojnë madhështisë së Tij.</p>
  </div>`;

  const reviewEl=document.getElementById("review");
  function revCard(k){
    const q=QUESTIONS[k], prep=state.prepared[k], a=state.answers[k];
    const isCorrect = a!==null && a===prep.correct;
    const badge = a===null?`<span class="rev-badge sk">Pa përgjigje</span>`
                 : isCorrect?`<span class="rev-badge ok">Saktë</span>`
                 :`<span class="rev-badge no">Gabim</span>`;
    const opts = prep.order.map((origIdx,pos)=>{
      let cls="", mark="";
      if(pos===prep.correct){cls="c";mark="E saktë";}
      if(a===pos && pos!==prep.correct){cls="w";mark="Zgjedhja jote";}
      if(a===pos && pos===prep.correct){mark="Zgjedhja jote ✓";}
      return `<div class="rev-opt ${cls}">
        <span class="key">${KEYS[pos]}</span>
        <span class="txt" style="min-width:0">${q.o[origIdx]}</span>
        ${mark?`<span class="mark">${mark}</span>`:""}
      </div>`;
    }).join("");
    return `<div class="rev-card" id="rev-${k}">
      <div class="rev-head"><span class="rev-num">Pyetja ${k+1}</span>${badge}<span class="muted" style="margin-inline-start:auto;font-size:.78rem">${q.t}</span></div>
      <p class="rev-q">${q.q}</p>
      <div class="rev-opts">${opts}</div>
      <div class="rev-why"><b>Pse</b>${q.e}</div>
    </div>`;
  }
  function paintReview(){
    let ks=[];
    for(let k=0;k<N;k++){
      const a=state.answers[k];
      const ok = a!==null && a===state.prepared[k].correct;
      if(revFilter==="all") ks.push(k);
      else if(revFilter==="wrong" && !ok) ks.push(k);
      else if(revFilter==="correct" && ok) ks.push(k);
    }
    reviewEl.innerHTML = ks.length? ks.map(revCard).join("") :
      `<p class="muted" style="text-align:center;padding:20px">S'ka pyetje në këtë kategori.</p>`;
  }
  paintReview();

  document.getElementById("resGrid").querySelectorAll(".cell").forEach(c=>{
    c.onclick=()=>{
      const k=parseInt(c.dataset.k,10);
      if(revFilter!=="all"){revFilter="all";
        document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x.dataset.f==="all"));
        paintReview();
      }
      const el=document.getElementById("rev-"+k);
      if(el){el.scrollIntoView({behavior:"smooth",block:"start"});
        el.style.transition="box-shadow .4s";el.style.boxShadow="0 0 0 2px var(--gold)";
        setTimeout(()=>{el.style.boxShadow="";},1200);
      }
    };
  });
  document.querySelectorAll(".chip").forEach(ch=>{
    ch.onclick=()=>{revFilter=ch.dataset.f;
      document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x===ch));
      paintReview();
    };
  });
  document.getElementById("againBtn").onclick=()=>{state=freshState();save();render();};
  document.getElementById("homeBtn").onclick=()=>{state.screen="start";save();render();};
  document.getElementById("themeBtn").onclick=toggleTheme;
}

/* ---------- Temë ---------- */
function toggleTheme(){
  const root=document.documentElement;
  const cur=root.getAttribute("data-theme");
  let next;
  if(cur==="dark") next="light";
  else if(cur==="light") next="dark";
  else {
    const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    next = prefersDark? "light":"dark";
  }
  root.setAttribute("data-theme",next);
  try{localStorage.setItem(LS_KEY+"-theme",next);}catch(e){}
}
(function initTheme(){
  try{const t=localStorage.getItem(LS_KEY+"-theme"); if(t) document.documentElement.setAttribute("data-theme",t);}catch(e){}
})();

/* ---------- Nis ---------- */
state = load() || freshState();
if(state.finished) state.screen="result";
render();
</script>
