<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
html,body{margin:0;padding:0}
:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Kuiz: Emrat dhe Cilësitë</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Noto+Sans:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap">
<style>
/* Layout: single reading column; three screens (start / kuiz / rezultate). Palette: smerald + ar on ngjyrë letre e ngrohtë. */
:root{
  --bg:#f3f1e9; --surface:#fffdf7; --surface-2:#f7f4ea;
  --fg:#23312b; --muted:#6a776f; --border:#e4ddcc;
  --accent:#0e6b52; --accent-ink:#0b5944; --accent-soft:#dcebe2;
  --gold:#b0842c;
  --correct:#0d7a4d; --correct-bg:#def1e5; --correct-bd:#9ad3b4;
  --wrong:#be392b; --wrong-bg:#fbe5e0; --wrong-bd:#eeb6ab;
  --idle:#ece7da; --idle-fg:#8a897c;
  --shadow:0 1px 2px rgba(20,40,32,.05),0 6px 20px rgba(20,40,32,.07);
  --maxw:50rem;
  --font-display:"Marcellus",Georgia,serif;
  --font-body:"Noto Sans","Amiri","Segoe UI",system-ui,sans-serif;
  --font-ar:"Amiri",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11161b; --surface:#19211d; --surface-2:#202823;
  --fg:#e9ede9; --muted:#9db0a6; --border:#2d3a33;
  --accent:#43b78c; --accent-ink:#5ac79c; --accent-soft:#1c342b;
  --gold:#d6b25e;
  --correct:#54c48d; --correct-bg:#15362666; --correct-bd:#2f6a4e;
  --wrong:#e67f70; --wrong-bg:#3d201b66; --wrong-bd:#7a3a31;
  --idle:#232c27; --idle-fg:#7f8d84;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 22px rgba(0,0,0,.35);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#11161b; --surface:#19211d; --surface-2:#202823;
  --fg:#e9ede9; --muted:#9db0a6; --border:#2d3a33;
  --accent:#43b78c; --accent-ink:#5ac79c; --accent-soft:#1c342b;
  --gold:#d6b25e;
  --correct:#54c48d; --correct-bg:#153626; --correct-bd:#2f6a4e;
  --wrong:#e67f70; --wrong-bg:#3d201b; --wrong-bd:#7a3a31;
  --idle:#232c27; --idle-fg:#7f8d84;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 22px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);line-height:1.5;
  -webkit-font-smoothing:antialiased;font-size:16px}
.wrap{max-width:var(--maxw);margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:24px 56px}
.ar{font-family:var(--font-ar);font-size:1.15em;line-height:1.9}
h1,h2,h3{font-family:var(--font-display);font-weight:400;text-wrap:balance;margin:0}
.muted{color:var(--muted)}
button{font-family:inherit;cursor:pointer}

/* ---------- Start screen ---------- */
.hero{background:var(--surface);border:1px solid var(--border);border-radius:18px;
  box-shadow:var(--shadow);overflow:hidden}
.hero-top{padding:30px 26px 22px;background:
  radial-gradient(120% 120% at 100% 0,var(--accent-soft) 0,transparent 60%);
  border-bottom:1px solid var(--border)}
.eyebrow{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:700}
.hero h1{font-size:clamp(1.8rem,5vw,2.6rem);margin:.4rem 0 .3rem;color:var(--accent-ink)}
.hero-sub{color:var(--muted);font-size:1.02rem;max-width:40ch}
.creed{margin:22px 26px;padding:18px 20px;border-radius:14px;background:var(--surface-2);
  border:1px solid var(--border);border-left:4px solid var(--accent)}
.creed .lbl{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:6px}
.creed p{margin:0;font-size:1.06rem;line-height:1.65}
.meta-row{display:flex;flex-wrap:wrap;gap:12px;margin:0 26px 8px}
.stat{flex:1 1 7rem;min-width:0;background:var(--surface-2);border:1px solid var(--border);
  border-radius:12px;padding:12px 14px}
.stat b{font-family:var(--font-display);font-size:1.5rem;color:var(--accent-ink);display:block;line-height:1.1}
.stat span{font-size:.82rem;color:var(--muted)}
.rules{margin:16px 26px 8px;padding:0;list-style:none;display:grid;gap:9px}
.rules li{display:flex;gap:10px;align-items:flex-start;font-size:.95rem;color:var(--fg)}
.rules li::before{content:"";flex:0 0 7px;height:7px;border-radius:50%;background:var(--accent);margin-top:8px}
.actions{padding:20px 26px 28px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.btn{border:1px solid transparent;border-radius:11px;padding:13px 22px;font-size:1rem;font-weight:600;
  background:var(--accent);color:#fff;transition:filter .15s,transform .05s}
.btn:hover{filter:brightness(1.06)} .btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--accent-ink);border-color:var(--border)}
.btn.ghost:hover{background:var(--surface-2);filter:none}
.btn.sm{padding:9px 15px;font-size:.9rem;border-radius:9px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.books{margin:4px 26px 0;font-size:.82rem;color:var(--muted);line-height:1.7}
.books b{color:var(--fg);font-weight:600}

/* ---------- Top bar (quiz) ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--border);margin-bottom:22px}
.topbar-in{max-width:var(--maxw);margin:0 auto;display:flex;align-items:center;gap:12px;
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.counter{font-family:var(--font-display);font-size:1.05rem;white-space:nowrap}
.counter small{color:var(--muted);font-size:.8em}
.progress{flex:1 1 auto;min-width:0;height:8px;border-radius:99px;background:var(--idle);overflow:hidden}
.progress>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--gold));transition:width .25s}
.iconbtn{border:1px solid var(--border);background:var(--surface);color:var(--fg);border-radius:9px;
  padding:7px 11px;font-size:.85rem;font-weight:600}

/* ---------- Question card ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);
  padding:24px 22px}
.qtag{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px}
.qtext{font-size:1.22rem;line-height:1.5;margin:0 0 20px;font-weight:500}
.opts{display:grid;gap:11px}
.opt{display:flex;gap:13px;align-items:flex-start;text-align:start;width:100%;
  background:var(--surface-2);border:1.5px solid var(--border);border-radius:12px;padding:14px 15px;
  font-size:1.02rem;color:var(--fg);transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--accent)}
.opt .key{flex:0 0 1.6rem;height:1.6rem;border-radius:50%;background:var(--surface);border:1.5px solid var(--border);
  display:grid;place-items:center;font-weight:700;font-size:.9rem;color:var(--muted);font-family:var(--font-display)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .key{background:var(--accent);border-color:var(--accent);color:#fff}
.opt .txt{min-width:0;padding-top:1px}
.navbtns{display:flex;gap:11px;margin-top:20px;align-items:center;flex-wrap:wrap}
.spacer{flex:1 1 auto}

/* ---------- Jump navigator ---------- */
.jump{margin-top:18px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px}
.jump h3{font-size:.95rem;margin-bottom:12px;color:var(--muted);letter-spacing:.04em}
.grid-n{display:grid;grid-template-columns:repeat(auto-fill,minmax(2.2rem,1fr));gap:7px}
.cell{aspect-ratio:1;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);
  color:var(--muted);font-weight:600;font-size:.82rem;font-variant-numeric:tabular-nums;
  display:grid;place-items:center;transition:transform .05s}
.cell:hover{transform:translateY(-1px)}
.cell.answered{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent)}
.cell.current{outline:2px solid var(--gold);outline-offset:1px}
.cell.correct{background:var(--correct-bg);color:var(--correct);border-color:var(--correct-bd)}
.cell.wrong{background:var(--wrong-bg);color:var(--wrong);border-color:var(--wrong-bd)}
.cell.blank{background:var(--idle);color:var(--idle-fg)}

/* ---------- Results ---------- */
.score{background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);
  padding:26px;text-align:center;margin-bottom:18px;background-image:
  radial-gradient(130% 120% at 50% -10%,var(--accent-soft) 0,transparent 55%)}
.score .big{font-family:var(--font-display);font-size:clamp(2.6rem,10vw,4rem);line-height:1;color:var(--accent-ink)}
.score .pct{font-size:1.1rem;color:var(--muted);margin-top:6px}
.score .tags{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:16px}
.pill{border-radius:99px;padding:7px 14px;font-size:.88rem;font-weight:600;border:1px solid var(--border)}
.pill.ok{background:var(--correct-bg);color:var(--correct);border-color:var(--correct-bd)}
.pill.no{background:var(--wrong-bg);color:var(--wrong);border-color:var(--wrong-bd)}
.pill.sk{background:var(--idle);color:var(--idle-fg)}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin:4px 2px 14px;font-size:.84rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.dot{width:13px;height:13px;border-radius:4px;border:1px solid var(--border)}
.dot.c{background:var(--correct-bg);border-color:var(--correct-bd)}
.dot.w{background:var(--wrong-bg);border-color:var(--wrong-bd)}
.dot.b{background:var(--idle)}

/* review panel */
.review{margin-top:18px;display:grid;gap:14px}
.rev-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 17px;scroll-margin-top:72px}
.rev-head{display:flex;gap:10px;align-items:baseline;margin-bottom:4px}
.rev-num{font-family:var(--font-display);font-size:1.05rem;color:var(--accent-ink)}
.rev-badge{font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:99px;text-transform:uppercase;letter-spacing:.06em}
.rev-badge.ok{background:var(--correct-bg);color:var(--correct)}
.rev-badge.no{background:var(--wrong-bg);color:var(--wrong)}
.rev-badge.sk{background:var(--idle);color:var(--idle-fg)}
.rev-q{font-weight:500;font-size:1.08rem;margin:6px 0 13px;line-height:1.45}
.rev-opts{display:grid;gap:8px}
.rev-opt{display:flex;gap:11px;align-items:flex-start;border:1.5px solid var(--border);border-radius:10px;
  padding:11px 13px;font-size:.98rem;background:var(--surface-2)}
.rev-opt .key{flex:0 0 1.5rem;height:1.5rem;border-radius:50%;display:grid;place-items:center;
  font-weight:700;font-size:.85rem;font-family:var(--font-display);border:1.5px solid var(--border);background:var(--surface);color:var(--muted)}
.rev-opt.c{background:var(--correct-bg);border-color:var(--correct-bd);color:var(--correct)}
.rev-opt.c .key{background:var(--correct);border-color:var(--correct);color:#fff}
.rev-opt.w{background:var(--wrong-bg);border-color:var(--wrong-bd);color:var(--wrong)}
.rev-opt.w .key{background:var(--wrong);border-color:var(--wrong);color:#fff}
.rev-opt .mark{margin-inline-start:auto;font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;align-self:center}
.filterbar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 2px}
.chip{border:1px solid var(--border);background:var(--surface);color:var(--fg);border-radius:99px;
  padding:7px 14px;font-size:.86rem;font-weight:600}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.foot{margin-top:28px;text-align:center;color:var(--muted);font-size:.82rem;line-height:1.7}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
/* buton sqarimi + popup */
.hintbtn{margin-top:14px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--gold)}
.modal-bk{position:fixed;inset:0;z-index:40;background:rgba(10,22,17,.55);
  display:flex;align-items:flex-end;justify-content:center;padding:0;animation:fade .15s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media(min-width:560px){.modal-bk{align-items:center;padding:20px}}
.modal{background:var(--surface);border:1px solid var(--border);width:100%;max-width:34rem;
  border-radius:18px 18px 0 0;box-shadow:0 -8px 40px rgba(0,0,0,.35);
  padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));max-height:86vh;overflow:auto}
@media(min-width:560px){.modal{border-radius:18px}}
.modal .mtag{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:8px}
.modal .mq{font-weight:500;font-size:1.1rem;margin:0 0 15px;line-height:1.45}
.modal .ans{display:flex;gap:11px;align-items:flex-start;background:var(--correct-bg);
  border:1.5px solid var(--correct-bd);border-radius:12px;padding:13px 14px;color:var(--correct)}
.modal .ans .key{flex:0 0 1.6rem;height:1.6rem;border-radius:50%;background:var(--correct);color:#fff;
  display:grid;place-items:center;font-weight:700;font-family:var(--font-display)}
.modal .ans .atx{min-width:0;padding-top:1px;font-weight:600}
.modal .why{margin-top:14px;padding:13px 15px;background:var(--surface-2);border:1px solid var(--border);
  border-left:4px solid var(--gold);border-radius:10px;font-size:.98rem;line-height:1.55}
.modal .why b{color:var(--gold);display:block;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;margin-bottom:5px}
.modal .closeRow{display:flex;justify-content:flex-end;margin-top:18px}
.rev-why{margin-top:12px;padding:11px 14px;background:var(--surface-2);border:1px solid var(--border);
  border-left:4px solid var(--gold);border-radius:9px;font-size:.92rem;line-height:1.5}
.rev-why b{color:var(--gold);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;margin-inline-end:6px}
@media (max-width:420px){
  .creed,.meta-row,.rules,.actions,.books{margin-left:18px;margin-right:18px}
  .card{padding:20px 16px}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================ TË DHËNAT: 200 PYETJE ============================ */
/* Burimet: 1) Takribut-Tedmurijje (f.21-46) 2) El-Kavaidul-Muthla – Ibn Uthejmin
             3) Fet'hu Rabbil-Berijje bi telkhisil-Hamauijje – Ibn Uthejmin.
   a = indeksi i përgjigjes së saktë (në renditjen e shkruar).                       */
const QUESTIONS = [
{"t":"Hyrje","q":"Teuhidi i emrave dhe cilësive, në ndarjen e njohur, është:","o":["Lloji i tretë i teuhidit","Degë e teuhidit të rububijjetit","Degë e teuhidit të uluhijjetit","Kusht paraprak i dy llojeve"],"a":0,"e":"Teuhidi ndahet në tri lloje të pandashme por të dallueshme: rububijjet, uluhijjet, dhe asma ue sifat — ky i fundit është i treti."},
{"t":"Hyrje","q":"Besimi në Allahun ngërthen katër çështje; e katërta është:","o":["Pohimi i emrave dhe cilësive","Pohimi i ekzistencës së Tij","Pohimi i rububijjetit të Tij","Pohimi i uluhijjetit të Tij"],"a":0,"e":"Katër çështjet: ekzistenca, rububijjeti, uluhijjeti, dhe pohimi i emrave e cilësive — kjo e fundit është teuhidi i asma ue sifat."},
{"t":"Hyrje","q":"«فَادْعُوهُ بِهَا» — lutja (du'a) këtu ngërthen:","o":["Mes'elen dhe ibaden së bashku","Vetëm lutjen e kërkesës (mes'ele)","Vetëm lutjen e adhurimit (ibade)","Vetëm përmendjen me gjuhë (dhikr)"],"a":0,"e":"«Du'a» në ajet përfshin mes'elen (t'i kërkosh me emër të përshtatshëm) dhe ibaden (ta adhurosh sipas kuptimit të emrit)."},
{"t":"Hyrje","q":"Dallimi mes du'au-l mes'ele dhe du'au-l ibade është:","o":["Kërkesë me emër / adhurim sipas emrit","Kërkesë fshehtas / kërkesë haptazi","Lutje me gjuhë / lutje vetëm me zemër","Lutje për dynja / lutje për ahiret"],"a":0,"e":"Mes'ele: «Ja Rahim, më mëshiro». Ibade: të pendohesh ngaqë Ai është Et-Teuuab, ta frikësohesh ngaqë është El-Habir."},
{"t":"Hyrje","q":"Pse njohja e emrave e cilësive është kusht i adhurimit të plotë?","o":["Pa të s'ka adhurim me basira","Sepse e shton shpërblimin e sadakasë","Sepse është kusht i abdesit","Sepse e lehtëson jetesën në dynja"],"a":0,"e":"Robi s'mund ta adhurojë Allahun në formën më të plotë pa e njohur Atë; njohja prodhon basiranë, dashurinë e frikën."},
{"t":"Hyrje","q":"Lutja e adhurimit me emrin «Et-Teuuab» realizohet kur robi:","o":["Pendohet ngaqë Ai e pranon teuben","Ia përsërit emrin shumë herë","E lut vetëm për begati","E mëson emrin përmendsh"],"a":0,"e":"Du'au-l ibade: ta adhurosh Allahun sipas përmbajtjes së emrit — teube ngaqë Ai është Et-Teuuab."},
{"t":"Hyrje","q":"Rregulli i artë i Ehlu Sunnetit për emrat e cilësitë është:","o":["Pohim pa temthil, tenzih pa ta'til","Mohim i kuptimit, dorëzim Allahut","Pohim sipas gjasës me krijesat","Ndalje te lafzi, pa kuptim"],"a":0,"e":"Pohim pa ngjasim (kundër Mumethilëve), tenzih pa zbrazje (kundër Muattilëve): «لَيْسَ كَمِثْلِهِ شَيْءٌ وَهُوَ السَّمِيعُ الْبَصِيرُ»."},
{"t":"Hyrje","q":"Cila NUK bën pjesë në besimin e drejtë ndaj Allahut?","o":["Se Ai ka nevojë për krijesat","Besimi në pavarësinë e Tij","Besimi në rububijjetin e Tij","Besimi në emrat e cilësitë"],"a":0,"e":"Nevoja është mangësi; Allahu është El-Ganijj — krijesat kanë nevojë për Të, jo e kundërta."},
{"t":"Emrat","q":"«Emrat e Allahut janë husna» nënkupton se secili prej tyre:","o":["Ngërthen kuptim të përsosur pa mangësi","Është etiketë pa përmbajtje","Tregon vetëm Qenien, pa cilësi","Është i kufizuar në kuptim"],"a":0,"e":"«Husna» = kulmi i bukurisë, ngaqë secili ngërthen cilësi të plotë kemal-i, pa naks real a të supozuar."},
{"t":"Emrat","q":"Emri «El-Hajj» është husna sepse tregon jetën që:","o":["S'i paraprin mosqenie e s'e pason zhdukje","Që fillon pas mosqenies e vazhdon përjetë","Që i ngjan në thelb jetës së krijesave","Që është cilësi e krijuar brenda në kohë"],"a":0,"e":"El-Hajj ngërthen jetën e përkryer që sjell domosdoshmërisht dije, fuqi, dëgjim e shikim të përsosura."},
{"t":"Emrat","q":"Çiftimi «El-Azizu'l-Hakim» shfaq bukuri shtesë sepse:","o":["Izzeti shoqërohet me urtësi","Dy emra tingëllojnë më bukur","Njëri e kufizon kuptimin e tjetrit","I kthen emrat në sinonime"],"a":0,"e":"Bukuria shfaqet edhe në bashkim: izzeti i Allahut nuk është forcë e verbër, por i shoqëruar me hikme."},
{"t":"Emrat","q":"Pohimi «emrat janë a'lam ue ausaf» do të thotë se ata:","o":["Tregojnë Qenien dhe bartin kuptime","Janë emra pa kuptime të veçanta","Janë cilësi që s'e tregojnë Qenien","Ndryshojnë kuptimin sipas kohës"],"a":0,"e":"Si a'lam tregojnë një të emërtuar (Allahun) → sinonimë; si ausaf bartin kuptime të veçanta → të ndryshëm."},
{"t":"Emrat","q":"Emrat e Allahut janë sinonimë duke parë ___, e të ndryshëm duke parë ___:","o":["tregimin e Qenies / kuptimet e veçanta","kuptimet e veçanta / tregimin e Qenies","numrin e shkronjave / mënyrën e shqiptimit","kohën e zbritjes / vendin e shpalljes"],"a":0,"e":"Nga tregimi i një të emërtuari (Allahut) janë muteradife; nga kuptimet e veçanta (El-Alim ≠ El-Kadir) janë mutebajine."},
{"t":"Emrat","q":"«Allahu është Semi' pa dëgjim, Basir pa shikim» është metodë e:","o":["Mohuesve (ehlu te'tilit)","Ehlu Sunnetit (pasuesve të selefit)","Mushebbihëve (ngjasuesve të cilësive)","Imamëve të katër medh'hebeve"],"a":0,"e":"Zbrazja e emrit nga cilësia është ta'til (metodë e Mutezilëve); Ehlu Sunneti pohon emrin me cilësinë e tij."},
{"t":"Emrat","q":"Pse «Ed-Dehr» (koha) nuk llogaritet prej emrave të Allahut?","o":["Është emër i ngrirë, i kohës","S'përmendet fare në Kuran","Ka kuptim mohues në gjuhë","E refuzojnë Mutezilët"],"a":0,"e":"Emri duhet të bartë kuptim kemal-i; «Ed-Dehr» është emër i kohës, jamid (i ngrirë) — ndaj jo emër i Allahut."},
{"t":"Emrat","q":"Hadithi «أنا الدهر» qartësohet nga «بيدي الأمر أقلب الليل والنهار», që tregon:","o":["Se Allahu e drejton kohën","Se koha është vetë Allahu","Se dehri ka vullnet","Se koha është krijesë e lartë"],"a":0,"e":"Kuptimi: «Në Dorën Time është çështja, e ndërroj natën e ditën» — Allahu e sundon kohën, s'është koha."},
{"t":"Emrat","q":"Emri me cilësi kalimtare (si «Es-Semi'») ngërthen tri çështje:","o":["Emrin, cilësinë, gjykimin","Emrin, Qenien, mënyrën","Cilësinë, numrin, kohën","Emrin, mohimin, mënyrën"],"a":0,"e":"Es-Semi' ngërthen: emrin, cilësinë e dëgjimit, dhe gjykimin/efektin — që Ai dëgjon («يَسْمَعُ تَحَاوُرَكُمَا»)."},
{"t":"Emrat","q":"Emri me cilësi JOkalimtare (si «El-Hajj») ngërthen:","o":["Emrin dhe cilësinë (dy çështje)","Emrin, cilësinë, gjykimin","Vetëm emrin, pa cilësi","Katër çështje me mënyrën"],"a":0,"e":"Cilësia jokalimtare s'ka objekt, prandaj mungon gjykimi kalimtar: El-Hajj → emri + cilësia e jetës."},
{"t":"Emrat","q":"«El-Halik» tregon Qenien dhe cilësinë e krijimit së bashku me:","o":["Mutabeka","Tedammun","Iltizam","Kijas"],"a":0,"e":"Mutabeka = fjala tregon tërë kuptimin e saj; El-Halik → Qenia + cilësia e krijimit së bashku."},
{"t":"Emrat","q":"«El-Halik» tregon diturinë dhe fuqinë e Allahut me:","o":["Iltizam","Mutabeka","Tedammun","Mohim"],"a":0,"e":"Krijimi kërkon domosdoshmërisht dije e fuqi; pra El-Halik i tregon ato me iltizam — jashtë kuptimit të drejtpërdrejtë."},
{"t":"Emrat","q":"«Emrat janë teukifijje» përjashton:","o":["Shtimin a pakësimin me mendje","Marrjen e tyre nga teksti","Lutjen me ta","Ruajtjen e tyre në shprehje"],"a":0,"e":"Teukifijje = kufizohen në atë që solli teksti; mendja s'ka kompetencë të shpikë a të heqë emra."},
{"t":"Emrat","q":"Pse mendja s'ka autoritet të shpikë emra për Allahun?","o":["Emërtimi pa dije është shpifje ndaj Tij","Sepse gjuha arabe është e vështirë","Sepse emrat janë të fshehtë","Sepse Profeti e ndaloi mendimin"],"a":0,"e":"Emërtimi i Allahut pa teukif është «القول على الله بلا علم» — e ndaluar; ndaj emrat merren vetëm me tekst."},
{"t":"Emrat","q":"Pse hadithi «إن لله تسعة وتسعين اسمًا...» s'e kufizon numrin e emrave?","o":["S'tha «emrat janë 99», por «ka 99»","Sepse hadithi është i dobët","Sepse 99 është numër simbolik","Sepse emrat janë njëqind"],"a":0,"e":"«Ka 99 emra, kush i numëron...» s'e përjashton ekzistencën e emrave të tjerë — ndryshe nga «emrat janë 99»."},
{"t":"Emrat","q":"Prova më e fortë se emrat s'janë të kufizuar me numër është:","o":["Emra që Allahu i mbajti në dije të fshehtë","Ndryshimi i listës nga një dijetar te tjetri","Numri i madh i emrave të përmendur në Kuran","Mendimi i shumicës dërrmuese së Mutezilëve"],"a":0,"e":"Lutja «...أو استأثرت به في علم الغيب عندك» përmend emra të panumërueshëm për ne — pra emrat s'janë të kufizuar."},
{"t":"Emrat","q":"Hadithi që PËRCAKTON 99 emrat në listë të caktuar është:","o":["I dobët (da'if)","Mutevatir","Muttefekun alejhi","Kudsij i vërtetë"],"a":0,"e":"Numri 99 është në Buhari e Muslim, por LISTA e renditur vjen me zinxhir të dobët; përcaktimi s'i atribuohet Profetit."},
{"t":"Emrat","q":"«El-Ihsa» i emrave (që shpie në Xhennet) ngërthen:","o":["Ruajtjen, kuptimin dhe adhurimin me to","Numërimin e tyre një nga një me gishta","Shkrimin e tyre të gjithëve në një listë","Përsëritjen e tyre çdo mëngjes e mbrëmje"],"a":0,"e":"Ihsa ngërthen tri shkallë: t'i ruash, t'i kuptosh, dhe ta adhurosh Allahun sipas përmbajtjes së tyre."},
{"t":"Emrat","q":"Ilhadi në emrat e Allahut përkufizohet si:","o":["Anim nga e vërteta rreth tyre","Ruajtja e tyre në shprehje","Lutja me ta në çdo rast","Pohimi i kuptimeve të tyre"],"a":0,"e":"Ilhad = «el-mejl» (anim); në emra = shmangie prej asaj që është detyrë ndaj tyre."},
{"t":"Emrat","q":"Emërtimi i Allahut «Baba» (të krishterët) e «shkaku vepërues» (filozofët) është ilhad i llojit:","o":["Emërtim me çka s'e ka emërtuar Veten","Mohim i emrave e cilësive","Nxjerrje emrash idhujsh","Ngjasim i cilësive me krijesat"],"a":0,"e":"Ky lloj ilhadi është emërtimi pa teukif: «el-Eb» te të krishterët, «el-illetu'l-fa'ile» te filozofët."},
{"t":"Emrat","q":"Nxjerrja e «El-Lat» nga «El-Ilah» e «El-Uzza» nga «El-Aziz» është ilhad i llojit:","o":["Nxjerrje emrash idhujsh nga emrat e Tij","Mohim i kuptimeve të emrave","Emërtim i Allahut me emër të ri","Përshkrim i mënyrës së cilësive"],"a":0,"e":"Mushrikët bënë ilhad duke prejardhur emra idhujsh nga emrat e Allahut — devijim i rëndë."},
{"t":"Emrat","q":"Mutabeka tregon ___, tedammun tregon ___, iltizam tregon ___:","o":["tërësinë / pjesën / të domosdoshmen jashtë","pjesën / tërësinë / të kundërtën","të domosdoshmen / tërësinë / pjesën","Qenien / cilësinë / emrin"],"a":0,"e":"Mutabeka = tërësia; tedammun = pjesa brenda; iltizam = e domosdoshmja jashtë kuptimit të drejtpërdrejtë."},
{"t":"Emrat","q":"«El-Alim» dhe «El-Kadir» janë të ndryshëm (mutebajin) sepse:","o":["Secili bart kuptim të veçantë","Secili tregon një të emërtuar tjetër","Ndryshojnë në numër shkronjash","U zbritën në kohë të ndryshme"],"a":0,"e":"Nga tregimi i Qenies janë një; nga kuptimet janë të ndryshëm — El-Alim (dija) ≠ El-Kadir (fuqia)."},
{"t":"Cilësitë","q":"«Cilësitë e Allahut janë kemal» vërtetohet me tri rrugë:","o":["Sem', akl dhe fitra","Sem', ixhma dhe kijas","Akl, shija dhe zakoni","Ixhma, hiss dhe ëndrra"],"a":0,"e":"Sheriati («وَلِلَّهِ الْمَثَلُ الْأَعْلَى»), mendja (çdo ekzistues real ka cilësi) dhe fitra (adhurohet vetëm i përkryeri)."},
{"t":"Cilësitë","q":"«وَلِلَّهِ الْمَثَلُ الْأَعْلَى» përdoret si provë për:","o":["Përshkrimin më të lartë e të përsosur","Mohimin e cilësive të Tij","Ngjasimin e Tij me krijesat","Kufizimin e cilësive në numër"],"a":0,"e":"«El-Methelu'l-A'la» = cilësia/përshkrimi më sublim — çdo cilësi e Allahut është në kulmin e përsosmërisë."},
{"t":"Cilësitë","q":"Mangësia e pastër (vdekja, padituria, pafuqia) ndaj Allahut është:","o":["E pamundur — mohohet","E lejuar në disa raste","E detyrueshme të pohohet","E pëlqyeshme të përmendet"],"a":0,"e":"Mangësia e pastër mohohet; «وَتَوَكَّلْ عَلَى الْحَيِّ الَّذِي لَا يَمُوتُ» mohon vdekjen e pohon jetën e përkryer."},
{"t":"Cilësitë","q":"Cilësia kemal në një gjendje e naks në tjetrën (mekri) trajtohet me:","o":["Detajim: vetëm si kundërpërgjigje","Pohim absolut në çdo rast","Mohim absolut në çdo rast","Heshtje të plotë"],"a":0,"e":"S'pohohet e as mohohet absolutisht: «وَيَمْكُرُونَ وَيَمْكُرُ اللَّهُ» — mekri i Allahut vetëm si kundërpërgjigje e drejtë."},
{"t":"Cilësitë","q":"Pse Allahu përshkruhet me «mekr» vetëm si kundërpërgjigje?","o":["Si nismë do ishte naks, si ndëshkim kemal","Sepse është cilësi e pakufizuar si dija","Sepse Ai fare s'e ka këtë lloj cilësie","Sepse u përmend vetëm njëherë në Kuran"],"a":0,"e":"Mekri është lavdi kur është përgjigje ndaj atij që i meriton; prandaj Kurani e kushtëzon me mukabele."},
{"t":"Cilësitë","q":"Pse «خان الله من يخون» refuzohet, ndonëse mekri si kundërpërgjigje pranohet?","o":["Khijaneti është naks absolut, pa anë lavdie","Khijaneti është cilësi e krijuar në kohë","Khijaneti dhe mekri janë saktësisht njësoj","Thënia qarkullon vetëm në gjuhën popullore"],"a":0,"e":"Ndryshe nga mekri, khijaneti (pabesi në vend amaneti) është gjithmonë i qortueshëm; prandaj Kurani tha «فَأَمْكَنَ مِنْهُمْ»."},
{"t":"Cilësitë","q":"Pse «dera e cilësive është më e gjerë se dera e emrave»?","o":["Çdo emër jep cilësi, e cilësitë veprore s'kanë fund","Sepse cilësitë janë dukshëm më të lehta për t'u kuptuar","Sepse cilësitë janë metaforike, kurse emrat realë","Sepse emrat janë të fshehtë, kurse cilësitë të dukshme"],"a":0,"e":"Çdo emër jep cilësi, por jo çdo cilësi jep emër; e cilësitë fi'lijje s'kanë fund: «مَا نَفِدَتْ كَلِمَاتُ اللَّهِ»."},
{"t":"Cilësitë","q":"Pse e përshkruajmë Allahun «zbret, vjen», por s'e quajmë «En-Nazil, El-Xhai»?","o":["Derë e emrave është më e ngushtë se e cilësive","Sepse këto vepra në të vërtetë s'kanë ndodhur","Sepse do të ishin emra metaforikë, jo realë","Sepse dijetarët Mutezilë e ndaluan nxjerrjen"],"a":0,"e":"Përshkruajmë me veprat siç erdhën, por s'nxjerrim emra nga çdo vepër — emrat janë teukifijje e më të ngushta."},
{"t":"Cilësitë","q":"Ndarja parësore e cilësive është:","o":["Pohuese (thubutijje) dhe mohuese (selbijje)","Vetjake (dhatijje) dhe veprore (fi'lijje)","Lajmëruese (khaberijje) dhe racionale","Të qarta (muhkem) dhe të paqarta"],"a":0,"e":"Ndarja e parë: thubutijje (ato që Allahu i pohoi — kemal) dhe selbijje (ato që i mohoi — naks)."},
{"t":"Cilësitë","q":"Qëllimi kryesor kur Allahu MOHON një cilësi (selbijje) është:","o":["Pohimi i përsosmërisë së të kundërtës","Vetëm mohimi, pa kuptim tjetër","Krahasimi i Tij me krijesat","Fshehja e asaj cilësie"],"a":0,"e":"Mohimi bëhet lavdi vetëm kur ngërthen pohimin e së kundërtës; mohimi i zhveshur mund të jetë edhe mungesë (paaftësi)."},
{"t":"Cilësitë","q":"«وَمَا كَانَ اللَّهُ لِيُعْجِزَهُ مِن شَيْءٍ» — mohimi i paaftësisë ngërthen pohimin e:","o":["Diturisë dhe fuqisë së Tij","Vetëm fuqisë së Tij","Vetëm diturisë së Tij","Asgjëje — thjesht mohim"],"a":0,"e":"Prandaj vjen «إِنَّهُ كَانَ عَلِيمًا قَدِيرًا» — një cilësi selbijje mund të ngërthejë më shumë se një përsosmëri."},
{"t":"Cilësitë","q":"Pse cilësitë pohuese janë shumë më të shumta se ato mohuese?","o":["Sepse tregojnë medh e kemal","Sepse mohimi është i vështirë","Sepse mendja s'i kap mohueset","Sepse Allahu i fshehu mohueset"],"a":0,"e":"Thubutijjet janë medh ue kemal; shumësia dhe larmia e tyre e shfaq më plotë përsosmërinë e të përshkruarit."},
{"t":"Cilësitë","q":"Cilësitë mohuese përmenden në tri raste. Cili NUK është prej tyre?","o":["Shpikja e cilësive me mendje","Përgjithësia e përsosmërisë","Mohimi i trillimeve të gënjeshtarëve","Largimi i mangësisë së hamendur"],"a":0,"e":"Tri rastet: përgjithësimi i kemalit, mohimi i trillimeve, largimi i mangësisë; cilësitë nuk shpiken me mendje."},
{"t":"Cilësitë","q":"Cilësitë pohuese (thubutijje) ndahen në:","o":["Vetjake (dhatijje) dhe veprore (fi'lijje)","Kalimtare (muteadi) dhe jokalimtare (lazim)","Të qarta (muhkem) dhe të paqarta (muteshabih)","Reale (hakikijje) dhe metaforike (mexhazijje)"],"a":0,"e":"Thubutijje → dhatijje (Allahu përshkruhet gjithmonë me to) dhe fi'lijje (lidhen me vullnetin)."},
{"t":"Cilësitë","q":"Dallimi mes cilësive vetjake (dhatijje) dhe veprore (fi'lijje) është:","o":["I ka përherë / lidhen me vullnetin","Të dukshme për sy / të fshehta nga sytë","Reale në vetvete / thjesht metaforike","Kalimtare te objekti / jokalimtare fare"],"a":0,"e":"Dhatijje nuk ndahen kurrë prej Tij (dija, fuqia); fi'lijje varen nga meshi'eja (istiuaja, nuzuli)."},
{"t":"Cilësitë","q":"Cilësitë lajmëruese (khaberijje) — fytyra, dy duart, dy sytë — janë:","o":["Cilësi vetjake (dhatijje)","Cilësi veprore (fi'lijje)","Cilësi mohuese (selbijje)","Kategori jashtë dhatijve"],"a":0,"e":"Khaberijjet (uexh, jedejn, ajnejn) janë dhatijje, ngaqë Allahu përshkruhet me to përgjithmonë."},
{"t":"Cilësitë","q":"Pse istiuaja mbi Arsh dhe nuzuli janë cilësi veprore (fi'lijje)?","o":["Lidhen me vullnetin — i bën kur të dojë","Sepse i kanë në një farë mënyre edhe krijesat","Sepse janë cilësi të krijuara brenda kohës","Sepse njihen vetëm nga mendja, jo nga teksti"],"a":0,"e":"Fi'lijje = varen nga meshi'eja; istiuaja e nuzuli janë vepra që Allahu i kryen kur të dojë."},
{"t":"Cilësitë","q":"Cilësia e Kelamit (Të folurit) te Ibn Uthejmini është:","o":["Vetjake-veprore njëkohësisht","Vetëm vetjake (dhatijje)","Vetëm veprore (fi'lijje)","Mohuese (selbijje)"],"a":0,"e":"Nga origjina Allahu është gjithmonë folës (dhatijje); nga njësitë flet kur të dojë (fi'lijje): «إِذَا أَرَادَ شَيْئًا أَن يَقُولَ لَهُ كُن»."},
{"t":"Cilësitë","q":"Çdo cilësi e lidhur me vullnetin e Allahut është:","o":["E ndjekur nga urtësia (hikmeti)","E rastësishme, pa qëllim","E detyruar nga diçka jashtë","E pakuptimtë për robërit"],"a":0,"e":"«إِنَّ اللَّهَ كَانَ عَلِيمًا حَكِيمًا» — Allahu s'do asgjë veçse në pajtim me urtësinë, qoftë e dukshme a e fshehtë."},
{"t":"Cilësitë","q":"Dy rreziqet që duhen shmangur në POHIMIN e cilësive janë:","o":["Temthili dhe tekjifi","Tahrifi dhe ta'tili","Dëgjimi dhe mendja","Pohimi dhe mohimi"],"a":0,"e":"Kush pohon cilësitë duhet të largohet nga temthili (ngjasimi) dhe tekjifi (përshkrimi i mënyrës)."},
{"t":"Cilësitë","q":"Dallimi mes temthilit dhe teshbihit (te ata që i dallojnë) është:","o":["Temthil: barazim në të gjitha / teshbih: në shumicën","Temthil: në shumicën / teshbih: në të gjitha","Temthil: Qenia / teshbih: emrat","Janë sinonime pa dallim"],"a":0,"e":"Temthil = musavat në çdo cilësi; teshbih = musavat në shumicën; por preferohet «nefju't-temthil» për Kuranin."},
{"t":"Cilësitë","q":"Pse preferohet «nefju't-temthil» ndaj «nefju't-teshbih»?","o":["Për t'u pajtuar me ajetin «لَيْسَ كَمِثْلِهِ شَيْءٌ»","Sepse teshbihi në të vërtetë fare s'ekziston","Sepse është shprehje dukshëm më e shkurtër","Sepse këtë shprehje e përdorin vetë Mutezilët"],"a":0,"e":"Kurani mohon «mithl» (të barabartin); prandaj shprehja më kur'anore është mohimi i temthilit."},
{"t":"Cilësitë","q":"Thënia e Imam Ahmedit «لا يوصف الله إلا بما وصف به نفسه» shpreh se cilësitë janë:","o":["Teukifijje","Racionale (me kijas)","Metaforike","Të hapura për shtim"],"a":0,"e":"Si emrat, edhe cilësitë janë teukifijje: s'i tejkalojmë Kuranin dhe hadithin në pohim a mohim."},
{"t":"Cilësitë","q":"Treguesi për pohimin e një cilësie vjen në tri mënyra. Cila NUK është prej tyre?","o":["Deduktimi me silogjizëm filozofik","Përmendja e drejtpërdrejtë e cilësisë","Përfshirja e saj nga një emër","Përmendja e një vepre që e tregon"],"a":0,"e":"Tri mënyrat: tesrihu bis-sifa, tedammunu'l-ism leha, tesrihu bi fi'l — jo deduktim filozofik."},
{"t":"Cilësitë","q":"Pohimi se cilësia është «حقيقة» (reale) do të thotë:","o":["Reale, jo mexhaz, që i përshtatet Atij","Identike me cilësitë e krijesave","Metaforike (mexhaz)","Pa kuptim të njohur për ne"],"a":0,"e":"Ehlu Sunneti i pohon cilësitë në kuptimin real (hakika), por «la'ike bihi» — pa ngjasim e pa tekjif."},
{"t":"Provat","q":"Provat e vetme të emrave dhe cilësive të Allahut janë:","o":["Libri dhe Sunneti","Libri, Sunneti dhe kijasi","Libri, ixhmaja dhe mendja","Mendja dhe fitra"],"a":0,"e":"Emrat e cilësitë janë gajb; vërtetohen vetëm me teukif prej Kuranit dhe Sunnetit, jo me kijas a mendje."},
{"t":"Provat","q":"Ndaj një shprehjeje pa pohim e pa mohim (si «el-xhihe»), qëndrimi ndaj LAFZIT është:","o":["Teuakkuf — as pohim, as mohim","Pohim i saj si cilësi","Mohim i saj si mangësi","Përkthim i saj në arabisht"],"a":0,"e":"Ndaj lafzit të pandriçuar nga teksti ndalemi; kurse ndaj KUPTIMIT detajojmë (i verteti pranohet, i koti refuzohet)."},
{"t":"Provat","q":"Ndaj KUPTIMIT të «el-xhihe» për Allahun, qëndrimi është:","o":["Detajim: i poshtmi kot, i larti jo-rrethues i vërtetë","Pranim i plotë i çdo drejtimi, pa asnjë detajim","Mohim i plotë i çdo drejtimi, lart ose poshtë","Dorëzim i kuptimit tek Allahu, pa u detajuar"],"a":0,"e":"Lafzi s'është në tekst → teuakkuf; por kuptimi detajohet: uluvv jo-rrethues që i përshtatet madhështisë është i vërtetë."},
{"t":"Provat","q":"Detyra ndaj teksteve të cilësive është:","o":["T'i kalojmë mbi dhahirin pa tahrif","T'i interpretojmë sipas mendjes","T'ua dorëzojmë kuptimin Allahut","T'i mohojmë si të pakuptimta"],"a":0,"e":"Kurani zbriti në arabishte të qartë; detyra është kuptimi i dhahirit pa tahrif, posaçërisht te cilësitë ku s'ka vend re'ji."},
{"t":"Provat","q":"Prova kryesore se tekstet kuptohen sipas dhahirit arab është:","o":["Kurani zbriti në gjuhë arabe të qartë","Mendja e kërkon këtë patjetër, pa tekst","Sepse kështu është shumë më e lehtë","Vetëm selefi e mbështetën këtë rrugë"],"a":0,"e":"Gjuha e qartë arabe kërkon kuptimin e dhahirit; çifutët u qortuan për shtrembërimin (tahrif) e fjalës."},
{"t":"Provat","q":"Kuptimet e dukshme (dhauahir) të teksteve të cilësive janë:","o":["Të njohura në kuptim, të panjohura në mënyrë","Të panjohura si në kuptim ashtu në mënyrë","Të njohura si në kuptim ashtu në mënyrë","Metaforike në tërësinë e kuptimit të tyre"],"a":0,"e":"Kuptimin e dimë (istiua = lartësi/qëndrim), mënyrën s'e dimë — prandaj refuzohet tefuidi i kuptimit."},
{"t":"Provat","q":"Medh'hebi i Mufeuvide (dorëzim i kuptimit Allahut) është:","o":["I kotë; prej thënieve më të këqija","Medh'hebi i vërtetë i selefit","Rruga e mesme mes dy ekstremeve","I detyrueshëm për të thjeshtët"],"a":0,"e":"Tefuidi i kuptimit e bën shpalljen gjëegjëzë pa dobi; selefi pohuan kuptimet e ia lanë Allahut vetëm kejfijjetin."},
{"t":"Provat","q":"Dallimi mes selefit dhe Mufeuvide është:","o":["Selefi lë mënyrën / Mufeuvidja lë edhe kuptimin","Selefi mohon kuptimin / Mufeuvidja e pohon","Selefi interpreton / Mufeuvidja ndalet te lafzi","Të dy lënë kuptimin e mënyrën"],"a":0,"e":"Thëniet e selefit janë mutevatir në pohimin e kuptimeve; vetëm kejfijjetin ia dorëzojnë Allahut — e kundërta e tefuidit."},
{"t":"Grupet","q":"Grupi që e mbajti dhahirin kuptim të vërtetë që i përshtatet Allahut janë:","o":["Selefi (Ehlu Sunneti vel-xhemati)","Mushebbihet (ngjasuesit e cilësive)","Muattilet (mohuesit e cilësive)","Mufeuvidja (dorëzuesit e kuptimit)"],"a":0,"e":"Vetëm këta e meritojnë me të vërtetë emrin «Ehlu Sunneti vel-Xhemati»."},
{"t":"Grupet","q":"Grupi që e bëri dhahirin kuptim të kotë POR e pohoi (ngjasim) janë:","o":["Mushebbihet","Muattilet","Mufeuvidja","Selefi"],"a":0,"e":"Mushebbihet ranë në jinaje ndaj teksteve: e kuptuan dhahirin si ngjasim e pastaj e pohuan — kundër «لَيْسَ كَمِثْلِهِ شَيْءٌ»."},
{"t":"Grupet","q":"Grupi që e bëri dhahirin kuptim të kotë dhe MOHOI kuptimin e vërtetë janë:","o":["Muattilet","Mushebbihet","Mufeuvidja","Selefi"],"a":0,"e":"Muattilet e supozuan dhahirin ngjasim, pastaj mohuan kuptimin e vërtetë — duke e quajtur «te'vil», që në të vërtetë është tahrif."},
{"t":"Grupet","q":"Dallimi mes Mushebbihëve dhe Muattilëve është:","o":["Të dy gabojnë dhahirin; njëri e pohon, tjetri e mohon","Të dy i pohojnë drejt cilësitë, secili pa gabim","Mushebbihu e mohon kuptimin, Muattili e pohon","Të dy mohojnë njësoj edhe emrat edhe cilësitë"],"a":0,"e":"Nisin nga i njëjti gabim (dhahiri = ngjasim), por njëri pohon ngjasimin, tjetri mohon kuptimin — të dyja të kota."},
{"t":"Grupet","q":"Tahrifi, në përkufizim, është:","o":["Shtrembërim i tekstit te kuptim tjetër","Mohim i cilësisë që i takon Allahut","Përshkrim i mënyrës së cilësisë","Pohim i një të ngjashmi me Allahun"],"a":0,"e":"Tahrif = shtrembërimi i fjalës; ta'til = mohimi i cilësisë; tekjif = përshkrimi i mënyrës; temthil = pohimi i të barabartit."},
{"t":"Grupet","q":"Ta'tili, në përkufizim, është:","o":["Mohim i cilësive që i takojnë Allahut","Shtrembërim i tekstit te kuptim tjetër","Përshkrim i mënyrës së cilësisë","Pohim i një të ngjashmi me Allahun"],"a":0,"e":"Ta'til = ta'tilu'l-khalik an sifatihi; shpesh arrihet përmes tahrifit (mjeti) për të mohuar cilësinë (qëllimi)."},
{"t":"Grupet","q":"Ta'tili i plotë (kul-li) është medh'hebi i:","o":["Xhehmijve","Esharive","Maturidive","Mushebbihëve"],"a":0,"e":"Ta'til kul-li = mohim i të gjitha cilësive (Xhehmijtë, gulatët e të cilëve mohojnë edhe emrat); ta'til xhuz'i = Esharitë."},
{"t":"Grupet","q":"Ta'tili i pjesshëm (xhuz'i) është medh'hebi i:","o":["Esharive","Xhehmijve të plotë","Selefit","Sahabëve"],"a":0,"e":"Esharitë bëjnë ta'til xhuz'i: pohojnë shtatë cilësi e mohojnë pjesën tjetër."},
{"t":"Grupet","q":"I pari me ta'til dhe i pari me teshbih (Krijuesin me krijesën) ishin:","o":["El-Xha'd ibn Dirham dhe Hisham ibn El-Hakem","Xhehm ibn Safuan dhe Vasil ibn Ata","Vasil ibn Ata dhe El-Xha'd ibn Dirham","Hisham ibn El-Hakem dhe Xhehm ibn Safuan"],"a":0,"e":"I pari me ta'til: El-Xha'd ibn Dirham; i pari me këtë lloj teshbihi: Hisham ibn El-Hakem err-Rafidij."},
{"t":"Grupet","q":"Tekjifi, si term, është:","o":["Përshkrim i mënyrës së cilësisë","Pohim i një të barabarti me Allahun","Mohim i cilësisë nga Qenia","Shtrembërim i tekstit te kuptim tjetër"],"a":0,"e":"Çdo temthil ngërthen tekjif, por jo e kundërta: mund të përshkruhet mënyrë pa pohuar të barabartë — ndaj tekjifi është më i gjerë."},
{"t":"Grupet","q":"Dallimi mes temthilit dhe teshbihit, në përkufizim, është:","o":["Temthil: i barabarti (mithl) / teshbih: i ngjashmi","Temthil: lidhet me Qenien / teshbih: me cilësitë","Temthil: mohim i plotë / teshbih: pohim i pjesshëm","Janë dy emra të ndryshëm për të njëjtin nocion"],"a":0,"e":"Mithl = barazim i plotë; shebih = ngjashmëri; disa dallojnë: temthil në çdo cilësi, teshbih në shumicën."},
{"t":"Grupet","q":"Ilhadi, gjuhësisht, nënkupton:","o":["Anim (el-mejl)","Dituri të thellë","Pohim të cilësive","Drejtësi e saktësi"],"a":0,"e":"Ilhad = anim nga e drejta; në terminologji = shmangie prej asaj që është detyrë të besohet a të veprohet."},
{"t":"Grupet","q":"Ilhadi në ajetet SHERIATIKE (tekstet) është:","o":["Shtrembërim, përgënjeshtrim, ose mosbindje","Atribuim i krijesave dikujt tjetër","Besim se Allahu ka ortak","Mospërmendja e tyre fare"],"a":0,"e":"Ilhadi ndahet në atë të ajeteve sher'ijje (tekstet) dhe kaunijje (krijesat)."},
{"t":"Grupet","q":"Ilhadi në ajetet KAUNIJJE (krijimi) është:","o":["Atribuim i tyre dikujt tjetër përveç Allahut","Shtrembërim i vetë teksteve të cilësive hyjnore","Mohim i cilësive të Allahut që i përmendin ato","Pohim i thatë i emrave pa cilësitë përkatëse"],"a":0,"e":"Ilhadi kauni = atribuimi i krijesave dikujt tjetër, ose besimi se Allahu ka ortak a ndihmës në to."},
{"t":"Grupet","q":"Dallimi mes te'vilit të saktë dhe tahrifit është:","o":["Te'vili ka provë / tahrifi s'ka provë","Janë e njëjta gjë","Te'vili te Mutezilët / tahrifi te selefi","Te'vili te emrat / tahrifi te veprat"],"a":0,"e":"Muattilet e quajtën shtrembërimin «te'vil», por pa dëshmi që e kërkon largimin nga dhahiri — pra në të vërtetë tahrif."},
{"t":"Grupet","q":"Pse teshbihu është «xhinaje ndaj teksteve»?","o":["Ia vesh tekstit kuptimin e ngjasimit","I lë tekstet pa asnjë kuptim","I pohon cilësitë siç duhet","I lexon ato në arabisht"],"a":0,"e":"Mushebbihu e ngarkon tekstin me kuptim të kotë (ngjasim) që Kurani vetë e përjashton — pra krim ndaj domethënies."},
{"t":"Grupet","q":"Teshbihu, si humbje, ndahet në dy lloje:","o":["Krijesën me Krijuesin / Krijuesin me krijesën","I madh e i hapur / i vogël, i fshehtë e i butë","Teshbih i emrave / teshbih i vetëm cilësive","Teshbih i arabëve / teshbih i popujve joarabë"],"a":0,"e":"I pari: ngjasimi i krijesës me Allahun (idhujt); i dyti: ngjasimi i cilësive të Allahut me ato të krijesave."},
{"t":"Grupet","q":"Pse ta'tili dhe tahrifi shpesh shkojnë bashkë?","o":["Tahrifi është mjeti, ta'tili qëllimi","Janë dy emra për të njëjtën gjë","Tahrifi vjen gjithmonë pas pohimit","S'kanë lidhje — rastësisht"],"a":0,"e":"Për të mohuar një cilësi (ta'til), muattili detyrohet ta shtrembërojë tekstin që e pohon atë (tahrif)."},
{"t":"Tedmurija","q":"Devijuesit në emrat e cilësitë ndahen në:","o":["Mumethile dhe Muattile","Besimtarë dhe mohues","Të ditur dhe injorantë","Arabë dhe joarabë"],"a":0,"e":"Mumethilet tepruan pohimin e mangësuan mohimin; Muattilet tepruan mohimin e mangësuan pohimin."},
{"t":"Tedmurija","q":"Medh'hebi i Mumethileve rrëzohet me tri rrugë:","o":["Sem', akl dhe hiss","Sem', ixhma dhe kijas","Fitra, zakoni dhe shija","Vetëm argument mendor"],"a":0,"e":"Rrëzohet me sheriatin, mendjen (Krijuesi ≠ krijesa) dhe shqisën (dallimi i dukshëm i qenieve)."},
{"t":"Tedmurija","q":"«لَيْسَ كَمِثْلِهِ شَيْءٌ وَهُوَ السَّمِيعُ الْبَصِيرُ» është boshti sepse:","o":["Rrëzon temthilin dhe pohon cilësitë","Mohon cilësitë e pohon ngjasimin","Pohon temthilin e mohon dëgjimin","Mohon edhe emrat edhe cilësitë"],"a":0,"e":"Gjysma e parë kundër Mumethilëve; gjysma e dytë kundër Muattilëve — një ajet kundër dy devijimeve."},
{"t":"Tedmurija","q":"Sipas Tedmurijes, Muattilet ndahen në:","o":["Katër grupe","Dy grupe","Tre grupe","Gjashtë grupe"],"a":0,"e":"Katër grupet: Esharitë/Maturiditë; Mutezilët; gulatët e Xhehmijve/Karamitë/Batinitë; gulatu'l-gulat (filozofë)."},
{"t":"Tedmurija","q":"Grupi i PARË i Muattileve (pohojnë emrat e shtatë cilësi) janë:","o":["Esharitë dhe Maturiditë","Mutezilët","Gulatët e Xhehmijve","Filozofët e batinitët"],"a":0,"e":"Grupi i parë (Esharitë/Maturiditë) pohon emrat e shtatë cilësi, e mohon shumicën e realiteteve të tjera."},
{"t":"Tedmurija","q":"Shtatë cilësitë që pohon grupi i parë (Esharitë) janë:","o":["Jeta, Dituria, Fuqia, Vullneti, Kelami, Dëgjimi, Shikimi","Fytyra, duart, sytë, ardhja, zbritja, istiuaja, mëshira","Mëshira, hidhërimi, dashuria, kënaqësia, urrejtja, ardhja","Krijimi, furnizimi, gjallërimi, vdekja, ringjallja, llogaria"],"a":0,"e":"Shtatë sifatu'l-me'ani: el-hajat, el-ilm, el-kudra, el-irade, el-kelam, es-sem', el-besar."},
{"t":"Tedmurija","q":"Grupi i DYTË i Muattileve (pohojnë emrat PA cilësi) janë:","o":["Mutezilët","Esharitë","Maturiditë","Mushebbihet"],"a":0,"e":"Mutezilët pohojnë emrat si etiketa: «Alim bila ilm, Kadir bila kudra» — pohim i emrit, mohim i cilësisë."},
{"t":"Tedmurija","q":"Disa Mutezilë i trajtojnë emrat (El-Alim, El-Kadir) si:","o":["Etiketa të zbrazëta ose sinonime","Cilësi reale të dallueshme","Emra të krijuar nga robërit","Metafora të Qenies"],"a":0,"e":"Shubha e tyre: pohimi i cilësive kërkon tedammun; prandaj i bëjnë emrat etiketa pa përmbajtje — refuzim me sem' e akl."},
{"t":"Tedmurija","q":"Grupi i TRETË i Muattileve (mohojnë emrat e cilësitë) janë:","o":["Gulatët e Xhehmijve dhe Batinitët","Esharitë dhe Maturiditë e afërt me ta","Mutezilët dhe pasuesit e drejtpërdrejtë","Mushebbihet dhe gulatët e lavdërimit"],"a":0,"e":"Grupi i tretë e përshkruan Allahun vetëm me mohim («el-mevxhudu'l-mutlak bi shartil-itlak»)."},
{"t":"Tedmurija","q":"Grupi i KATËRT (gulatu'l-gulat) e teproi duke:","o":["As pohuar as mohuar asgjë","Pohuar të gjitha cilësitë","Ngjasuar Allahun me krijesat","Pohuar vetëm emrat"],"a":0,"e":"Grupi i katërt mohon edhe pohimin edhe mohimin, nga frika se pohimi ngjason me ekzistuesit e mohimi me joekzistuesit."},
{"t":"Tedmurija","q":"Grupet ranë në pesë rreziqe (mehadhir). Cili NUK është prej tyre?","o":["Pohimi i cilësive siç i takojnë Allahut","Kundërshtimi i rrugës së selefit","Ta'tili dhe tahrifi i teksteve","Zbrazja e Allahut nga kemali"],"a":0,"e":"Pohimi korrekt i cilësive s'është rrezik — është pikërisht rruga e shpëtimit e selefit."},
{"t":"Tedmurija","q":"Parimi i parë (el-asl el-evvel) i Tedmurijes është:","o":["Fjala për disa cilësi si për disa të tjera","Fjala për cilësitë si për Qenien","Istiuaja e njohur, kejfi i panjohur","Allahu i lartë mbi Arshin"],"a":0,"e":"Parimi i parë u drejtohet atyre që pohojnë disa cilësi e mohojnë disa të tjera: s'ka dallim mes tyre."},
{"t":"Tedmurija","q":"Atij që pohon iraden e mohon gadabin, parimi i parë i thotë:","o":["S'ka dallim mes iradës e gadabit që mohove","Ke plotësisht të drejtë në këtë dallim","Hidhërimi (gadab) në të vërtetë fare s'ekziston","Vullneti (irade) është thjesht metaforë"],"a":0,"e":"Parimi i parë detyron konsekuencë: kush pohon një cilësi real detyrohet të pohojë të ngjashmet; ndryshe bie në kundërthënie."},
{"t":"Tedmurija","q":"Parimi i dytë (el-asl eth-thani) i Tedmurijes është:","o":["Fjala për cilësitë si për Qenien","Fjala për disa cilësi si për disa të tjera","Istiuaja është bidat","Emrat janë nëntëdhjetë e nëntë"],"a":0,"e":"Parimi i dytë u drejtohet mumethilit e muattilit: ashtu siç pohon Qenie që s'u ngjan qenieve, pohi cilësi që s'u ngjajnë cilësive."},
{"t":"Tedmurija","q":"Parimi i dytë i thotë Mumethilit:","o":["Pse e ngjason cilësinë, kur s'e ngjason Qenien?","Moho edhe Qenien së bashku me cilësitë e Tij","Pohi cilësitë dy herë rresht, për më shumë siguri","Hesht plotësisht për Qenien ashtu si për cilësitë"],"a":0,"e":"Fjala për cilësitë është degë e fjalës për Qenien; kush s'e ngjason Qenien, s'duhet t'i ngjasojë cilësitë."},
{"t":"Tedmurija","q":"Parimi i dytë i thotë Muattilit (Mutezilit):","o":["Pohi cilësi të papërngjashme, si Qenien e tillë","Moho edhe Qenien, meqë s'ta pranon mendja","Ngjasoje Qenien e Tij me qeniet e krijesave","Hesht krejt e mos pohoni as Qenie as cilësi"],"a":0,"e":"Muattilit i kthehet argumenti i tij: nëse pranon Qenie të papërngjashme pa rënë në tashbih, le të pranojë edhe cilësi të papërngjashme."},
{"t":"Tedmurija","q":"«Si (kejf) është istiuaja?» — përgjigjja sipas parimit të dytë:","o":["Si Qenia: ma trego kejfin e Qenies","Istiuaja është ngjitje trupore","Istiuaja do të thotë sundim","Allahu fare s'ka istiua"],"a":0,"e":"Ashtu si pohojmë Qenie reale pa e ditur kejfin, pohojmë istiua reale pa e ditur kejfin — s'ka dallim."},
{"t":"Tedmurija","q":"Thënia e Imam Malikut për istiuanë ishte:","o":["E njohur, kejfi i panjohur, besimi detyrë, pyetja bidat","E panjohur si në kuptim ashtu edhe në mënyrën e saj","Do të thotë sundim e pushtet mbi tërë mbretërinë","Mos e pohoni istiuanë, sepse s'ka kuptim të njohur"],"a":0,"e":"«El-istivau ma'lum, uel-kejfu mexhhul, uel-imanu bihi uaxhib, ues-su'alu anhu bid'a» — rregull për çdo cilësi."},
{"t":"Tedmurija","q":"«الاستواء معلوم» i referohet ___, «الكيف مجهول» i referohet ___:","o":["kuptimit / mënyrës","mënyrës / kuptimit","kohës / vendit","lafzit / shqiptimit"],"a":0,"e":"Kuptimi i istiuasë njihet (lartësi/qëndrim kur kushtëzohet me «ala»); kejfijjeti mbetet i panjohur — pyetja për të bidat."},
{"t":"Tedmurija","q":"«اسْتَوَى عَلَى الْعَرْشِ» — «isteva ala» gjuhësisht ka kuptimin:","o":["Lartësi dhe qëndrim (uluvv ue istikrar)","Pushtim i Arshit me forcë e mbizotërim","Krijim i Arshit prej hiçit në kohë","Mëshirë e gjerë që e përfshin Arshin"],"a":0,"e":"«Isteva ala» në arabisht = u ngjit e qëndroi lart («لِتَسْتَوُوا عَلَى ظُهُورِهِ»); interpretimi «istivla» është tahrif."},
{"t":"Tedmurija","q":"Dy shembujt (el-methlan) e Tedmurijes janë:","o":["Begatitë e Xhennetit dhe shpirti","Dielli i ndritshëm dhe hëna e plotë","Qielli i lartë dhe toka e gjerë","Jeta e dynjasë dhe vdekja e saj"],"a":0,"e":"Begatitë e Xhennetit (reale, por ndryshe nga dynjaja) dhe shpirti (real, por i panjohur) ilustrojnë pohimin pa ngjasim."},
{"t":"Tedmurija","q":"Begatitë e Xhennetit përputhen me dynjanë në ___ e ndryshojnë në ___:","o":["emër / realitet","mënyrë / emër","peshë / çmim","kohë / vend"],"a":0,"e":"Ibn Abasi: «Në dynja s'ka gjë nga Xhenneti veç emrave» — përputhje në emër, ndryshim rrënjësor në realitet."},
{"t":"Tedmurija","q":"Mësimi i shembullit të shpirtit (err-ruh) është:","o":["Real, por s'u ngjan trupave — si cilësitë","Një trup si trupat e tjerë që i shohim","Diçka që në të vërtetë fare s'ekziston","Diçka që e njohim plotësisht në realitet"],"a":0,"e":"Kush e mohon shpirtin është muattil, kush e ngjason është mumeththil; aq më tepër Krijuesi — real, por pa ngjasim."},
{"t":"Tedmurija","q":"Grupi i humbur më i rëndë ndaj imanit në Allahun e Ahiretin janë:","o":["Karamitët, batinitët dhe filozofët","Esharitë dhe pasuesit e Maturidive","Mutezilët dhe ata që i ndoqën ata","Mushebbihet dhe gulatët e lidhur me ta"],"a":0,"e":"Grupi i tretë (karamitë/batinitë/filozofë) i bën lajmet për Allahun e Ahiretin thjesht «takhjil» (imagjinatë)."},
{"t":"Tedmurija","q":"Batinitët, që mohojnë realitetin e lajmeve, janë sipas ixhmasë:","o":["Më mosbesimtarë se çifutët e të krishterët","Prej Ehlu Sunnetit në thelbin e besimit","Grupi që qëndron më afër rrugës së selefit","Të pagabueshëm e të mbrojtur në akide"],"a":0,"e":"Batinitët (el-melahide) janë sipas ixhmasë më kafira se jehuditë e nasarat, ngaqë mohojnë vetë realitetet fetare."},
{"t":"Tedmurija","q":"Grupi i tretë e përshkruan Allahun si «mevxhud mutlak bi shartil-itlak», që do të thotë:","o":["Ekzistencë abstrakte vetëm në mendje","Ekzistuesi më i përsosur me cilësi","Allahu i lartësuar mbi Arshin","Krijuesi që rrethon gjithçka"],"a":0,"e":"«Ekzistuesi absolut me kusht abstraktimi» s'ekziston jashtë mendjes; pra grupi i tretë e zbraz Allahun nga çdo realitet."},
{"t":"Hamawija","q":"Risaleja «El-Hamauijje» u shkrua nga Ibn Tejmijje si:","o":["Përgjigje për një pyetje nga Shami","Libër i pavarur për fikhun","Letër drejtuar një mbreti","Koment i plotë i Kuranit"],"a":0,"e":"Ibn Tejmijje (v. 728 h.) e shkroi më 698 h. si përgjigje (~83 faqe); Ibn Uthejmini e përmblodhi."},
{"t":"Hamawija","q":"Ibn Uthejmini e përmblodhi «El-Hamauijjen» në veprën:","o":["Fet'hu Rabbi'l-Berijje","El-Kavaidu'l-Muthla","Takribu't-Tedmurijje","Sherhu'l-Uasitijje"],"a":0,"e":"«Fet'hu Rabbi'l-Berijje bi telkhisi'l-Hamauijje» është telkhisi i Ibn Uthejminit për Hamauijen e Ibn Tejmijes."},
{"t":"Hamawija","q":"Detyrë mbi robin në fenë e tij, sipas kreut të parë, është:","o":["Të ndjekë Allahun, të Dërguarin e selefin","Të ndjekë vetëm mendjen dhe arsyen e vet","Të ndjekë dijetarët e kelamit e filozofisë","Të heshtë plotësisht ndaj çdo çështjeje"],"a":0,"e":"«قُلْ يَا أَيُّهَا النَّاسُ...» dhe «عليكم بسنتي وسنة الخلفاء الراشدين» — detyrë është pasimi i udhëzimit profetik e i selefit."},
{"t":"Hamawija","q":"Risaleja e Profetit ﷺ ngërthen dy gjëra:","o":["Dije të dobishme dhe vepër të mirë","Pasuri dhe pushtet","Lehtësi dhe vështirësi","Fjalë të qartë dhe heshtje"],"a":0,"e":"«أَرْسَلَ رَسُولَهُ بِالْهُدَى وَدِينِ الْحَقِّ» — hudaja = dija e dobishme, dini'l-hakk = vepra e mirë; më e madhja dije është njohja e Allahut."},
{"t":"Hamawija","q":"Pse s'mund që Profeti ﷺ ta ketë lënë mangët sqarimin e cilësive?","o":["Ishte më i dituri, më këshilluesi, më i qarti","Ishte arab e e njihte mirë gjuhën e popullit","Jetoi gjatë e pati kohë ta sqaronte tërësisht","Kishte shumë shokë besnikë që e ndihmonin"],"a":0,"e":"Njohja e Allahut është dija më e lartë; e pamundur që më i dituri, më këshilluesi e më i qarti ta lërë atë mangët."},
{"t":"Hamawija","q":"Teza qendrore e Hamauijes për rrugën e selefit është se ajo është:","o":["Më e sigurt, më e ditur dhe më e urtë","Vetëm më e sigurt, jo më e ditur","Më e vështirë e më pak e saktë","E barabartë me rrugën e khalefit"],"a":0,"e":"Kundër pretendimit «selefi aslem, khalefi a'lem ue ahkem», Hamauija provon se selefi është aslem edhe a'lem edhe ahkem."},
{"t":"Hamawija","q":"Pse pretendimi «selefi aslem, khalefi a'lem ue ahkem» është kontradiktor?","o":["S'ka siguri pa dituri e urtësi","Selefi ishin më të paktë","Khalefi ishin më afër shpalljes","Fjalia është gramatikisht e gjatë"],"a":0,"e":"Nuk ka selame pa ilm e hikme; të quash një rrugë më të sigurt e njëkohësisht më pak të ditur është kontradiktë e brendshme."},
{"t":"Hamawija","q":"Pse e vërteta duhet të jetë te selefi (argumenti i dilemës)?","o":["Ndryshe sahabët ose gabuan ose heshtën","Sepse ishin arabë të pastër","Sepse khalefi ishin të varfër","Sepse ishin shumë më tepër"],"a":0,"e":"E vërteta ose është te selefi ose te khalefi; e dyta e bën ekzistencën e Kuranit e Sunnetit «darar mahd» — e pamundur."},
{"t":"Hamawija","q":"Pretendimi se selefi vetëm besonin lafzet pa pohim kuptimi (tefuid) është:","o":["Gënjeshtër ndaj selefit","I vërtetë historikisht","Mendim vetëm i Ibn Tejmijes","I saktë për disa cilësi"],"a":0,"e":"Selefi pohuan kuptimet (herë përmbledhtas, herë hollësisht) e ia lanë Allahut vetëm kejfijjetin — ata ishin më të diturit për kuptimet."},
{"t":"Hamawija","q":"Fakhrud-Din er-Razi, në fund të jetës, pranoi se:","o":["Rruga më e afërt është ajo e Kuranit","Kelami është shërues i sigurt","Selefi gabuan në cilësi","Mendja duhet mbi tekstin gjithmonë"],"a":0,"e":"Rrëfimi i famshëm i Razit: «ما رأيتها تشفي عليلاً... وأقرب الطرق طريقة القرآن» — pranim i epërsisë së rrugës së selefit."},
{"t":"Hamawija","q":"Pse rruga e khalefit s'mund të jetë «më e ditur» se e selefit?","o":["Selefi janë trashëgimtarët e profetëve","Khalefi flisnin arabisht dobët","Khalefi ishin të paktë","Selefi jetuan më gjatë"],"a":0,"e":"Selefi janë «verethetu'l-enbija» që i morën dijet nga shpallja; khalefi e ngatërruan me burime të huaja — s'mund të jenë a'lem."},
{"t":"Hamawija","q":"Pse selefi quhen «verethetu'l-enbija» në çështjen e cilësive?","o":["E morën dijen nga burimet e shpalljes","Trashëguan pasuri nga profetët","Ishin të afërm gjaku të tyre","Jetuan afër vendeve të profetëve"],"a":0,"e":"Si trashëgimtarë të pejgamberëve, selefi e përcollën njohjen e Allahut nga vahji — prandaj janë a'lem se khalefi."},
{"t":"Hamawija","q":"Vargjet e Razit «نهاية إقدام العقول عقال...» shprehin:","o":["Se fundi i mendjeve është hutim e humbje","Lavdinë e kelamit mbi tekstin","Epërsinë e filozofisë mbi shpalljen","Mohimin e vlerës së Kuranit"],"a":0,"e":"Razi pranoi hutimin e mendjeve e u kthye te rruga e Kuranit — dëshmi se selefi janë a'lem e ahkem."},
{"t":"Uluvvi","q":"Lartësia (uluvvi) e Allahut ndahet në:","o":["Uluvv i Qenies dhe uluvv i cilësive","Lartësi e dukshme dhe e fshehtë","Lartësi reale dhe metaforike","Lartësi e përhershme dhe e përkohshme"],"a":0,"e":"Uluvvi është cilësi dhatijje; ndahet në lartësi të Qenies (mbi krijesat) dhe lartësi të cilësive (çdo cilësi më e larta)."},
{"t":"Uluvvi","q":"Uluvvu's-sifat ___, kurse uluvvu'dh-dhat ___:","o":["çdo cilësi më e larta / Qenia mbi krijesat","Allahu mbi Arsh / cilësitë e larta","të dy: Allahu kudo / cilësitë e plota","s'kanë dallim real mes tyre / njësoj"],"a":0,"e":"Uluvvu's-sifat = përsosmëria absolute e çdo cilësie; uluvvu'dh-dhat = Qenia e Allahut mbi gjithë krijesat."},
{"t":"Uluvvi","q":"Lartësia e Qenies vërtetohet me sa prova?","o":["Pesë: Libër, Sunnet, ixhma, akl, fitra","Vetëm me ajetet e qarta të Kuranit","Tri: Libri, Sunneti dhe kijasi i saktë","Dy: argumenti mendor dhe ai i shqisave"],"a":0,"e":"Pesë burimet dëshmojnë njëzëri uluvvu'dh-dhat: Kurani, Sunneti, ixhmaja, mendja, dhe natyrshmëria."},
{"t":"Uluvvi","q":"Argumenti mendor për lartësinë: uluvvi është ___, sufli është ___:","o":["kemal / naks","naks / kemal","metaforë / realitet","i njëjtë / i njëjtë"],"a":0,"e":"Uluvvi është kemal, sufli naks; Allahut i takon çdo kemal — pra lartësia e Qenies është e domosdoshme."},
{"t":"Uluvvi","q":"Cili ajet është provë e DREJTPËRDREJTË për lartësinë e Qenies?","o":["«يَخَافُونَ رَبَّهُم مِّن فَوْقِهِمْ»","«قُلْ هُوَ اللَّهُ أَحَدٌ الصَّمَدُ»","«اللَّهُ لَا إِلَهَ إِلَّا هُوَ الْحَيُّ»","«إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ»"],"a":0,"e":"Lartësia dëshmohet me uluvv, feukijje, istiua e «fi's-sema» — si «يَخَافُونَ رَبَّهُم مِّن فَوْقِهِمْ»."},
{"t":"Uluvvi","q":"Thënia e Imam El-Euza'ijt «كنا والتابعون متوافرون...» dëshmon se:","o":["Allahu është mbi Arshin e Tij","Allahu është në çdo vend","Cilësitë janë metaforë","Mendja vendos për lartësinë"],"a":0,"e":"El-Euza'ij dëshmon ixhmanë e selefit (sahabë e tabi'inë) për uluvvin — «إن الله فوق عرشه»."},
{"t":"Uluvvi","q":"Historia e El-Xhuvejnit me El-Hemedanin përfundon me pranimin se:","o":["Lartësia është fitra — «حيّرني الهمداني»","Allahu është kudo me Qenien","Istiuaja është metaforë e sundimit","Arshi në të vërtetë s'ekziston"],"a":0,"e":"El-Hemedani tregoi se tërheqja e zemrës drejt lart është fitra që s'mohohet; El-Xhuvejni pranoi: «Më hutoi Hemedani»."},
{"t":"Uluvvi","q":"«سَبِّحِ اسْمَ رَبِّكَ الْأَعْلَى» dëshmon cilësinë e:","o":["Lartësisë","Mëshirës","Dëgjimit","Të folurit"],"a":0,"e":"«El-A'la» = më i Larti; ajeti pohon lartësinë e Allahut, prej cilësive dhatijje."},
{"t":"Uluvvi","q":"Kuptimi i «وَهُوَ اللَّهُ فِي السَّمَاوَاتِ وَفِي الْأَرْضِ» është:","o":["Ai është i Adhuruari në qiej e në tokë","Qenia e Tij është në tokë si në qiell","Allahu është i përzier me krijesat","Allahu është kudo me Qenien"],"a":0,"e":"Kuptimi: Ai është Ilah/Ma'luh në qiej e në tokë; kush e kupton si prani e Qenies në tokë ka gabuar."},
{"t":"Uluvvi","q":"Lartësia (uluvvi) klasifikohet te cilësitë:","o":["Vetjake (dhatijje)","Veprore (fi'lijje)","Mohuese (selbijje)","Khaberijje të veçanta"],"a":0,"e":"Uluvvi është cilësi dhatijje — Allahu është gjithmonë i Larti mbi krijesat, me Qenie e me cilësi."},
{"t":"Arshi","q":"Nga tri mundësitë e «el-xhihe», e vërteta është:","o":["I larti jo-rrethues","I poshtmi (sufl)","I larti rrethues","Asnjë drejtim fare"],"a":0,"e":"I poshtmi kot (kundër uluvvit); i larti rrethues kot (Allahu s'rrethohet); i larti jo-rrethues i vërtetë."},
{"t":"Arshi","q":"Pse «drejtimi i poshtëm (sufl)» për Allahun është i kotë?","o":["Bie ndesh me lartësinë e Tij","Drejtimi fare s'ekziston","Arshi është poshtë","E mohojnë filozofët"],"a":0,"e":"Sufli kundërshton uluvvu'dh-dhat që dëshmohet me Libër, Sunnet, ixhma, akl e fitra."},
{"t":"Arshi","q":"Pse «drejtimi i lartë që e rrethon Allahun» është i kotë?","o":["Allahu s'rrethohet nga krijesat","Allahu s'është i lartë fare","Arshi s'ekziston","Rrethimi është metaforë"],"a":0,"e":"Rrethimi do të thoshte se krijesa është më e madhe se Krijuesi — e pamundur; Allahu është i lartë pa u rrethuar."},
{"t":"Arshi","q":"Arshi, në kuptimin gjuhësor, do të thotë:","o":["Froni i mbretit","Qielli i shtatë","Toka e parë","Reja mbi qiej"],"a":0,"e":"«El-Arsh» = serir'l-mulk; Arshi i Er-Rahmanit mbi të cilin u ngjit është froni më i madh që rrethon krijesat."},
{"t":"Arshi","q":"Hadithi i Ebu Dherrit tregon raportin e Kursisë me qiejt:","o":["Qiejt para Kursisë si unazë në shkretëtirë","Kursija e qiejt janë të barabartë","Kursija është nën qiejt","Qiejt janë më të mëdhenj se Kursija"],"a":0,"e":"«ما السماوات السبع... عند الكرسي إلا كحلقة ملقاة بأرض فلاة» — e Arshi mbi Kursinë si shkretëtira mbi atë unazë."},
{"t":"Arshi","q":"Transmetimi i Ibn Abasit për Kursinë është:","o":["Vendi i dy Këmbëve","Vetë Arshi","Dija e Allahut","Qielli i shtatë"],"a":0,"e":"Ibn Abasi: Kursija është vendi i dy Këmbëve, kurse Arshin s'mund ta masë kush."},
{"t":"Arshi","q":"Dijetari i tha Xhehmiut: «S'bën kejf të Qenies, pra:","o":["as cilësive s'u bën kejf»","mohoje edhe Qenien»","hesht për tërë fenë»","pyet filozofët»"],"a":0,"e":"Ashtu si pohon Qenie pa kejf, pohon cilësi pa kejf — sepse njohja e mënyrës së cilësisë degëzohet nga njohja e Qenies."},
{"t":"Arshi","q":"El-Kursijju, në kuptimin gjuhësor, nënkupton:","o":["Vendin ku ulesh","Fronin më të madh","Qiellin e shtatë","Tokën e parë"],"a":0,"e":"Gjuhësisht kursi = ajo mbi të cilën ulesh; është më i vogël se Arshi sipas hadithit të Ebu Dherrit."},
{"t":"Arshi","q":"Pse «اسْتَوَى عَلَى الْعَرْشِ» s'interpretohet si «istivla» (pushtoi)?","o":["«Istivla» s'ka bazë gjuhësore këtu","Istivlaja është kuptim i pranuar","Arshi fare s'ekziston","E refuzojnë vetëm selefi"],"a":0,"e":"«Istivla» nënkupton se dikush ia kundërshtonte Arshin më parë — e kotë; kuptimi gjuhësor është lartësi/qëndrim."},
{"t":"Arshi","q":"Abdulkadir El-Xhilani, në «El-Gunje», pohoi se Allahu:","o":["Është mbi Arsh, me drejtimin e lartësisë","Është në çdo vend me Qenien e Tij","Nuk është mbi Arsh në realitetin e vet","Është i përzier me krijesat e Tij"],"a":0,"e":"El-Xhilani: «وهو سبحانه بجهة العلو، مستوٍ على العرش، محتوٍ على الملك» — dëshmi e pohimit të uluvvit edhe te të mëvonshmit."},
{"t":"Meijja","q":"Meijja (bashkësia e Allahut) ndahet në:","o":["Të përgjithshme dhe të veçantë","Trupore dhe shpirtërore","Të dukshme dhe të fshehtë","Reale dhe metaforike"],"a":0,"e":"Meijja 'amme (gjithëpërfshirëse) dhe khasse (vetëm për besimtarët e të dërguarit) — asnjëra s'bie ndesh me uluvvin."},
{"t":"Meijja","q":"Meijja e PËRGJITHSHME ('amme) nënkupton:","o":["Rrethimin me dije, fuqi e sundim","Ndihmën e posaçme të besimtarëve","Praninë trupore mes krijesave","Vetëm mëshirën e përgjithshme"],"a":0,"e":"Meijja 'amme buron nga rububijjeti: Allahu i rrethon të gjithë me dije e sundim; i kërkon robit murakabe."},
{"t":"Meijja","q":"Meijja e VEÇANTË (khasse) nënkupton:","o":["Ndihmën dhe përkrahjen (nasr ue te'jid)","Rrethimin e të gjitha krijesave","Praninë trupore pranë besimtarit","Dënimin e armiqve"],"a":0,"e":"Meijja khasse i jep besimtarit/të dërguarit thebat; «إِنَّ اللَّهَ مَعَ الَّذِينَ اتَّقَوا»."},
{"t":"Meijja","q":"Cili grup ajetesh i përket meijjes së PËRGJITHSHME?","o":["«مَعَكُمْ أَيْنَ مَا كُنتُمْ»","«إِنَّ اللَّهَ مَعَنَا» (shpellë)","«إِنَّنِي مَعَكُمَا أَسْمَعُ وَأَرَى»","«مَعَ الَّذِينَ اتَّقَوا»"],"a":0,"e":"«Me ju kudo që të jeni» shpreh meijjen 'amme (dije e rrethim), jo ndihmë të posaçme."},
{"t":"Meijja","q":"«إِنَّ اللَّهَ مَعَنَا» (shpellë) e «إِنَّنِي مَعَكُمَا» (Musait) janë shembuj të meijjes:","o":["Të veçantë (khasse)","Të përgjithshme ('amme)","Trupore mes krijesave","Metaforike"],"a":0,"e":"Të dyja janë meijje khasse: sjellin nasr e te'jid për të dërguarit e Allahut dhe pasuesit e tyre."},
{"t":"Meijja","q":"Pse meijja s'bie ndesh me lartësinë (uluvvin) e Allahut?","o":["Shpreh dije e sundim, jo përzierje","Sepse njëra e mohon tjetrën","Sepse Arshi s'ekziston","Sepse meijja është metaforë"],"a":0,"e":"Meijja e vërtetë bashkohet me uluvvin: Allahu është mbi Arsh e njëkohësisht me ne në dije, fuqi e sundim, pa përzierje."},
{"t":"Meijja","q":"Meijja e përgjithshme i kërkon robit ___, e veçanta i jep ___:","o":["murakabe / thebat","frikë / pasuri","vetmi / dyshim","heshtje / pushtet"],"a":0,"e":"Kush beson meijjen 'amme ruan vetëkontrollin; kush beson atë khasse fiton qëndrueshmëri — «لَا تَحْزَنْ إِنَّ اللَّهَ مَعَنَا»."},
{"t":"Meijja","q":"Meijja e vërtetë e Allahut me krijesat NUK nënkupton:","o":["Përzierjen e Qenies mes tyre","Dijen e Tij për ta","Fuqinë e Tij mbi ta","Sundimin e Tij mbi ta"],"a":0,"e":"Meijja shpreh dije, fuqi, dëgjim, shikim e sundim — kurrë përzierje a prani trupore; prandaj s'bie ndesh me uluvvin."},
{"t":"Çështje","q":"Cilësitë lajmëruese (khaberijje), që njihen vetëm nga teksti, janë:","o":["Fytyra, dy duart, dy sytë","Dija, fuqia, dëgjimi","Istiuaja, nuzuli, mexhi'i","Mëshira, hidhërimi, dashuria"],"a":0,"e":"Khaberijjet njihen vetëm nga lajmi (uexh, jedejn, ajnejn) e klasifikohen te cilësitë dhatijje."},
{"t":"Çështje","q":"Në «لِمَا خَلَقْتُ بِيَدَيَّ», ai që i shtrembëron «dy Duart» në «fuqi» ka bërë:","o":["Tahrif pa provë","Pohim të drejtë","Teuakkuf ndaj kuptimit","Pohim të mënyrës"],"a":0,"e":"Dora e shtuar te Krijuesi është reale e la'ike bihi; interpretimi i saj si «kudra/ni'me» është tahrif pa dëshmi."},
{"t":"Çështje","q":"Pse interpretimi i «dy Duarve» si «fuqi» te ajeti i Iblisit është i pasaktë?","o":["Teksti kërkon kuptimin real, pa provë për largim","Sepse cilësia e fuqisë fare s'ekziston te Ai","Sepse Iblisi në të vërtetë s'ishte krijesë","Sepse Allahu nuk e ka fare cilësinë e fuqisë"],"a":0,"e":"Kur fjala shtohet te Krijuesi merr kuptim që i përshtatet Atij; kërkohet dëshmi për largimin nga dhahiri — e muattili s'e ka."},
{"t":"Çështje","q":"Qëndrimi i Ehlu Sunnetit ndaj cilësive veprore (si nuzuli) është:","o":["T'i pohojnë siç erdhën, pa tahrif e tekjif","T'i mohojnë sepse duken të pamundura","T'i interpretojnë si zbritje e mëshirës","Të heshtin plotësisht për kuptimin e tyre"],"a":0,"e":"Nuzuli është cilësi fi'lijje reale që i përshtatet Allahut; pohohet pa u krahasuar me zbritjen e krijesave e pa tekjif."},
{"t":"Çështje","q":"Vullneti (irade) i Allahut ndahet në:","o":["Kauni (ndodh patjetër) dhe sher'ij (dashuri)","I madh (universal) dhe i vogël (i veçantë)","I dukshëm (i shprehur) dhe i fshehtë (brenda)","Arab (gjuhësor) dhe joarab (i përkthyer)"],"a":0,"e":"Iradeja kaunijje (= meshi'e, ndodh patjetër, përfshin edhe atë që Allahu s'e do) dhe sher'ijje (= mehabbe, s'ndodh domosdo)."},
{"t":"Çështje","q":"Dallimi mes iradës kaunijje dhe sher'ijje është:","o":["Kaunijja ndodh patjetër / sher'ijja është dashuri","Të dyja realizohen patjetër, pa përjashtim fare","Të dyja nënkuptojnë thjesht dashurinë e Allahut","Nuk ka asnjë dallim real mes dy llojeve të saj"],"a":0,"e":"Allahu «deshi» (kaunen) kufrin e Iblisit duke e lejuar, por s'e «deshi» (sher'an), sepse s'e do kufrin."},
{"t":"Çështje","q":"Pse iradeja kaunijje përfshin edhe atë që Allahu s'e do (kufrin)?","o":["Kaunijja ndodh patjetër, pavarësisht dashurisë","Sepse Allahu në të vërtetë e do edhe kufrin","Sepse s'ka asnjë dallim mes dy llojeve të saj","Sepse kufri është krejt i detyruar mbi robin"],"a":0,"e":"Allahu e lejoi (kaunen) kufrin e Iblisit që të ndodhte, por s'e deshi (sher'an) atë — dallimi mes dy iradeve."},
{"t":"Çështje","q":"Dashuria (mehabbe), hidhërimi (gadab) e kënaqësia (rida) për Allahun janë:","o":["Cilësi reale që i përshtaten Atij","Metaforë e shpërblimit a ndëshkimit","Cilësi të krijuara në kohë","Cilësi që duhen mohuar"],"a":0,"e":"Ehlu Sunneti i pohon si cilësi reale la'ika bihi; interpretimi i tyre si «thevab/intikam» është tahrif."},
{"t":"Çështje","q":"«بِلَا كَيْفَ» (pa mënyrë) që thanë selefi nënkupton:","o":["Pohim i cilësisë, mohim i njohjes së mënyrës","Mohim i vetë cilësisë së Allahut tërësisht","Mohim i kuptimit që e bart ajo cilësi","Ngjasim i cilësisë me cilësitë e krijesave"],"a":0,"e":"«Pa kejf» s'do të thotë se cilësia s'ka kejf, por se ne s'e dimë kejfin — selefi pohuan një kejfijjet të panjohur për ne."},
{"t":"Çështje","q":"Te «لا كيف ولا معنى» i Ahmedit, «معنى» që ai mohoi ishte:","o":["Kuptimi i kotë i Xhehmijve","Çdo kuptim pa përjashtim","Kuptimi gjuhësor arab","Kuptimi që pohuan sahabët"],"a":0,"e":"Ahmedi mohoi «ma'nanë» batile të Xhehmijve (që shtrembëronin dhahirin) dhe kejfijjetin — jo kuptimin e vërtetë."},
{"t":"Çështje","q":"Cilësia e të ardhurit (mexhi') për gjykim Ditën e Kijametit është:","o":["Cilësi veprore (fi'lijje)","Cilësi vetjake (dhatijje)","Cilësi mohuese (selbijje)","Metaforë e ndihmës"],"a":0,"e":"«وَجَاءَ رَبُّكَ» — mexhi'i për fasl (gjykim) është cilësi fi'lijje reale, e lidhur me vullnetin, e pohohet pa tekjif."},
{"t":"Metoda","q":"Metoda e Ehlu Sunnetit në POHIM është:","o":["Pohim pa tahrif, ta'til, tekjif e temthil","Pohim me ngjasim të matur ndaj krijesave","Pohim i vetëm shtatë cilësive, jo të tjerave","Interpretim i çdo cilësie sipas mendjes"],"a":0,"e":"Katër mohimet në pohim: la tahrif, la ta'til, la tekjif, la temthil."},
{"t":"Metoda","q":"Metoda e Ehlu Sunnetit në MOHIM është:","o":["Mohim me pohim të së kundërtës së përkryer","Mohim i gjithçkaje që mendja nuk e kupton","Heshtje e plotë ndaj çdo mohimi në tekst","Pohim i mangësive që teksti nuk i mohoi"],"a":0,"e":"Mohimi s'është zbrazje: p.sh. mohimi i gjumit ngërthen pohimin e jetës e kajjumijjetit të përkryer."},
{"t":"Metoda","q":"Metoda e Ehlu Sunnetit është rruga e mesme mes:","o":["Ehlu te'tilit dhe ehlu temthilit","Dy medh'hebeve të fikhut","Sufive dhe fukahave","Arabëve dhe joarabëve"],"a":0,"e":"Ehlu Sunneti qëndron mes zbrazjes (ta'til) e ngjasimit (temthil): pohim pa temthil, tenzih pa ta'til."},
{"t":"Metoda","q":"Në akide, Ehlu Sunneti i kundërshton pikërisht:","o":["Maturiditë, Esharitë, Mutezilët, Xhehmijtë, filozofët","Vetëm filozofët e lashtë grekë e pasuesit","Çifutët dhe të krishterët e devijuar historikisht","Katër imamët e njohur të medh'hebeve"],"a":0,"e":"Ehlu Sunneti kundërshton devijuesit në cilësi e i pohon cilësitë ashtu siç i takojnë Allahut."},
{"t":"Metoda","q":"Shkaku rrënjësor i humbjes së Mumethileve e Muattileve ishte:","o":["Nisja nga parimi 'dhahiri = ngjasim'","Padituria e plotë e arabishtes","Varfëria materiale","Numri i vogël"],"a":0,"e":"Të dy grupet nisën nga supozimi se dhahiri do të thotë ngjasim; pastaj njëri e pohoi, tjetri e mohoi — gabimi i njëjtë."},
{"t":"Metoda","q":"Pse pohimi i cilësive NUK është teshbih?","o":["Pohohen në mënyrë që i përshtatet Atij","Sepse cilësitë s'kanë kuptim real","Sepse janë metaforë","Sepse e thanë disa dijetarë"],"a":0,"e":"Përputhja në emër s'kërkon përputhje në realitet («لَيْسَ كَمِثْلِهِ شَيْءٌ»); dora e njeriut ndryshon nga «dora» e elefantit."},
{"t":"Metoda","q":"Përputhja në EMËR mes Krijuesit e krijesës tregon se:","o":["S'kërkon përputhje në realitet","Kërkon domosdo përputhje reale","Është teshbih i ndaluar","Është metaforë, jo kuptim real"],"a":0,"e":"Përputhja në ism s'detyron përputhje në hakika; dallimi Krijues-krijesë është më i madh se mes vetë krijesave."},
{"t":"Metoda","q":"Formula «pohim pa temthil, tenzih pa ta'til» përmbledh metodën e:","o":["Ehlu Sunnetit","Mutezilëve","Mushebbihëve","Mufeuvide"],"a":0,"e":"Ithbat bila temthil (kundër Mumethilëve) dhe tenzih bila ta'til (kundër Muattilëve) — rruga e mesme e Ehlu Sunnetit."},
{"t":"Metoda","q":"Katër gjërat që Ehlu Sunneti i mohon në POHIMIN e cilësive janë:","o":["Tahrifi, ta'tili, tekjifi, temthili","Dëgjimi, mendja, shqisa, fitra","Kurani, Sunneti, ixhmaja, kijasi","Dashuria, frika, shpresa, mbështetja"],"a":0,"e":"«من غير تحريف ولا تعطيل ولا تكييف ولا تمثيل» — katër mohimet që shoqërojnë pohimin e cilësive."},
{"t":"Metoda","q":"Pse besimi se Allahu ka nevojë për krijesat s'është prej besimit?","o":["Nevoja është naks; Ai është El-Ganijj","Sepse është çështje e vështirë","Sepse s'përmendet në Kuran","Sepse e pohojnë filozofët"],"a":0,"e":"Pavarësia absolute (gina) është kemal; nevoja do të ishte naks, e pamundur për Allahun."},
{"t":"Thellim","q":"Me emrin «El-Halik»: mutabeka → ___, tedammun → ___, iltizam → ___:","o":["Qenia+krijimi / njëra veç / dija e fuqia","dija veç / fuqia veç / Qenia e krijimi","fuqia veç / krijimi veç / Qenia e plotë","vetëm Qenia pa cilësi në të tria rastet"],"a":0,"e":"El-Halik: mutabeka (Qenia + krijimi), tedammun (njëra veç), iltizam (dija e fuqia që i nënkupton krijimi)."},
{"t":"Thellim","q":"Pse mohimi i thjeshtë (pa pohim përsosmërie) s'është lavdi?","o":["Mund të vijë nga paaftësia — pra naks","Sepse është shprehje e shkurtër","Sepse mohimi s'ka kuptim","Sepse është në gjuhë të huaj"],"a":0,"e":"Mohimi bëhet kemal vetëm kur ngërthen pohimin e së kundërtës; ndryshe mund të jetë thjesht mungesë (si «muri s'bën padrejtësi»)."},
{"t":"Thellim","q":"«الَّذِي لَا يَمُوتُ» — mohimi i vdekjes ngërthen:","o":["Pohimin e jetës së përkryer","Thjesht mungesën e vdekjes","Një mangësi të fshehtë","Krahasimin me krijesat"],"a":0,"e":"Mohimi i vdekjes synon pohimin e jetës së përkryer e të përhershme — jo thjesht mungesën e vdekjes."},
{"t":"Thellim","q":"Esharitë dhe Maturiditë, në cilësitë, klasifikohen te:","o":["Muattilet (ta'til xhuz'i)","Ehlu Sunneti i plotë","Mushebbihet","Selefi i hershëm"],"a":0,"e":"Ata pohojnë shtatë cilësi e mohojnë pjesën tjetër; pra bëjnë ta'til xhuz'i — grupi i parë i Muattileve te Tedmurija."},
{"t":"Thellim","q":"Mutezilët, që pohojnë emrat duke mohuar cilësitë, janë:","o":["Muattile të emrave nga kuptimet","Mushebbihe të cilësive me krijesat","Ehlu Sunnet që bëjnë tefsir të gjerë","Selef që dorëzojnë kuptimin (tefuid)"],"a":0,"e":"Mutezilët pohojnë emra pa cilësi («Alim bila ilm») — pra i zbrazin emrat nga cilësitë, lloj i ta'tilit."},
{"t":"Thellim","q":"Fakti që Kurani zbriti në gjuhë arabe të qartë provon se tekstet e cilësive:","o":["Kanë kuptim që merret sipas dhahirit","Janë pa kuptim fare","Janë metaforë në tërësi","Janë të fshehta nga të gjithë"],"a":0,"e":"Gjuha e qartë kërkon kuptimin e dhahirit; largimi prej tij lejohet vetëm me dëshmi sher'ije, që te cilësitë nuk ka."},
{"t":"Thellim","q":"«لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ» — mohimi i gjumit ngërthen:","o":["Pohimin e jetës e kajjumijjetit","Një mangësi të fshehtë","Krahasim me gjumin e krijesave","Vetëm mungesën, pa kuptim"],"a":0,"e":"Mohimi i gjumit s'është zbrazje, por pohim i hajat-it e kajjumijjet-it të përkryer — Ai e mban çdo gjë e s'e kap kotja."},
{"t":"Thellim","q":"Si pajtohet istiuaja mbi Arsh me të qenit «fi's-sema»?","o":["Të dyja tregojnë lartësinë mbi krijesat","Janë të kundërta e përjashtohen","E para e mohon të dytën","S'kanë asnjë lidhje"],"a":0,"e":"«Fi's-sema» nënkupton «ala's-sema» (mbi qiell); bashkë me istiuanë dëshmojnë uluvvu'dh-dhat — jo rrethim nga qielli."},
{"t":"Thellim","q":"Mohimi i «tekjifit» për cilësitë NUK nënkupton mohimin e:","o":["Kuptimit e realitetit të cilësisë","Mënyrës (kejfijjetit) së saj","Njohjes së kejfit","Pyetjes për mënyrën"],"a":0,"e":"Mohojmë njohjen e kejfit, jo vetë cilësinë; cilësia është reale me kuptim të njohur, por mënyra mbetet e panjohur."},
{"t":"Thellim","q":"Thënia «أقرب الطرق طريقة القرآن» i atribuohet:","o":["Fakhrud-Din er-Razit","Imam Malikut","Ibn Abasit","Imam Ahmedit"],"a":0,"e":"Rrëfimi i Razit, prototip i mutekel-limit, që pranoi kotësinë e rrugëve racionale dhe epërsinë e rrugës së Kuranit."},
{"t":"Thellim","q":"«Tefsiri» që mohoi Muhammed ibn El-Hasen ishte:","o":["Interpretimi i Xhehmijve mohues","Çdo tefsir i lejuar","Tefsiri gjuhësor i fjalëve","Tefsiri që bënte Ibn Abasi"],"a":0,"e":"Ashtu si te Ahmedi, «tefsiri» i mohuar është interpretimi i Xhehmijve muattile — jo pohimi i kuptimeve të vërteta."},
{"t":"Thellim","q":"Ata që thanë «s'ka dallim mes selefit dhe mu'avvile» bënë:","o":["Lubsu'l-hakk bil-batil","Pohuan të vërtetën historike","U pajtuan drejt me selefin","Pohuan cilësitë siç duhet"],"a":0,"e":"Kjo është gënjeshtër: asnjë prej selefit s'e mohoi treguesin e teksteve mbi cilësitë; mu'avviletja ishin kundërshtarë të tyre."},
{"t":"Thellim","q":"Që mu'avviletja i akuzonin selefin për teshbih provon se:","o":["Selefi i POHONin cilësitë","Selefi vërtet bënin teshbih","Selefi heshtnin për cilësitë","S'kishte dallim mes palëve"],"a":0,"e":"Akuza për teshbih do të kishte kuptim vetëm nëse selefi pohonin cilësi; pra ata s'ishin tefuidxhinj të kuptimit, por pohues."},
{"t":"Thellim","q":"Dëshmia e fitres për lartësinë shfaqet kur njeriu në fatkeqësi:","o":["E ngre zemrën lart drejt Allahut","Shikon drejt tokës","E mohon Zotin nga dëshpërimi","I drejtohet filozofëve"],"a":0,"e":"Çdo lutës, arab e joarab, kur i bie fatkeqësia e ngre zemrën lart — dëshmi e fitres së pandryshuar për uluvvin."},
{"t":"Thellim","q":"«أَفَمَن يَخْلُقُ كَمَن لَّا يَخْلُقُ» përdoret si provë për:","o":["Mohimin e temthilit","Mohimin e vetë cilësive","Pohimin e ngjasimit","Pohimin e tekjifit"],"a":0,"e":"Ajeti rrëzon temthilin: Krijuesi ndryshon rrënjësisht nga krijesa e s'ka «semijj» (të ngjashëm)."},
{"t":"Thellim","q":"Dallimi Krijues-krijesë, krahasuar me atë mes vetë krijesave, është:","o":["Më i madh e më i qartë","Më i vogël e më pak i dukshëm","I barabartë me të","Jo i vërtetë, vetëm i hamendur"],"a":0,"e":"Nëse dora e njeriut s'i ngjan «dorës» së elefantit, aq më tepër s'i ngjan Dora e Krijuesit duarve të krijesave."},
{"t":"Thellim","q":"Pse cilësitë e Allahut s'i nënshtrohen mendjes së pavarur?","o":["Janë gajb; detajimi merret nga sem'i","Sepse mendja është e pavlerë","Sepse arabishtja është e vështirë","Sepse janë të parëndësishme"],"a":0,"e":"Detajimi i asaj që është e detyrueshme, e pamundur a e mundur për Allahun kapet vetëm nga teksti."},
{"t":"Thellim","q":"Ixhmaja e Ehlu Sunnetit (Ibn Abdil-Berr) mbi cilësitë është:","o":["Pohim e mbajtje në realitet, pa tekjif","Interpretim i tyre sipas rregullave gjuhësore","Mohim i tyre me tenzih nga çdo mangësi","Dorëzim i vetë kuptimit të tyre tek Allahu"],"a":0,"e":"«أهل السنة مجمعون على الإقرار بالصفات... وحملها على الحقيقة لا على المجاز، إلا أنهم لا يكيفون» — ixhma e Ehlu Sunnetit."},
{"t":"Thellim","q":"Argumenti i parë për vërtetësinë e medh'hebit të selefit është:","o":["Përputhja e plotë me Librin e Sunnetin","Numri shumë i madh i ithtarëve të tij","Vjetërsia e tij e lashtë historike","Thjeshtësia e madhe e gjuhës që përdor"],"a":0,"e":"Kush e ndjek rrugën e selefit me dije e drejtësi e gjen në përputhje të plotë me Librin e Sunnetin."},
{"t":"Thellim","q":"Përmbledhja e Tedmurijes: kush mohon cilësitë është ___, kush i ngjason është ___:","o":["muattil xhahid / mumeththil xhahil","i urtë në fe / i ditur në akide","besimtar i mesëm / dijetar i thellë","arab i pastër / joarab i përkthyer"],"a":0,"e":"Kush mohon është xhahid muattil, kush ngjason është xhahil mumeththil; Ehlu Sunneti mes tyre: pohim pa ngjasim."},
{"t":"Thellim","q":"Pohimi i një mënyre të caktuar për cilësitë (pa ngjasim) është:","o":["Tekjif i ndaluar","Temthil me krijesat","Teuakkuf i lejuar","Pohim i saktë"],"a":0,"e":"Edhe pa ngjasim, pohimi i një mënyre të caktuar për cilësitë është tekjif — «القول على الله بلا علم»; ndalohet."},
{"t":"Thellim","q":"Argumentet racionale të Kuranit për cilësitë tregojnë se mendja e shëndoshë:","o":["Pajtohet me shpalljen","Bie ndesh me shpalljen","S'ka vend në besim","Mbizotëron mbi tekstin"],"a":0,"e":"Mendja e pastër pajtohet me tekstin; prandaj Hamauija sjell argumente aklije krahas sem'ijeve — s'ka kundërthënie mes akl e nakl."},
{"t":"Thellim","q":"«لائقة به» (që i përshtatet Atij) në pohimin e cilësive synon:","o":["Ruajtjen e realitetit pa ngjasim","Mohimin e realitetit të cilësisë","Interpretimin metaforik","Dorëzimin e kuptimit"],"a":0,"e":"«La'ike bihi» e ruan hakikan e cilësisë e e tenzihon nga ngjasimi — thelbi i «pohim pa temthil»."},
