<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
html,body{margin:0;padding:0}
:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Kuiz: Emrat dhe Cilësitë</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Noto+Sans:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap">
<style>
/* Layout: single reading column; three screens (start / kuiz / rezultate). Palette: smerald + ar on ngjyrë letre e ngrohtë. */
:root{
  --bg:#f3f1e9; --surface:#fffdf7; --surface-2:#f7f4ea;
  --fg:#23312b; --muted:#6a776f; --border:#e4ddcc;
  --accent:#0e6b52; --accent-ink:#0b5944; --accent-soft:#dcebe2;
  --gold:#b0842c;
  --correct:#0d7a4d; --correct-bg:#def1e5; --correct-bd:#9ad3b4;
  --wrong:#be392b; --wrong-bg:#fbe5e0; --wrong-bd:#eeb6ab;
  --idle:#ece7da; --idle-fg:#8a897c;
  --shadow:0 1px 2px rgba(20,40,32,.05),0 6px 20px rgba(20,40,32,.07);
  --maxw:50rem;
  --font-display:"Marcellus",Georgia,serif;
  --font-body:"Noto Sans","Amiri","Segoe UI",system-ui,sans-serif;
  --font-ar:"Amiri",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11161b; --surface:#19211d; --surface-2:#202823;
  --fg:#e9ede9; --muted:#9db0a6; --border:#2d3a33;
  --accent:#43b78c; --accent-ink:#5ac79c; --accent-soft:#1c342b;
  --gold:#d6b25e;
  --correct:#54c48d; --correct-bg:#15362666; --correct-bd:#2f6a4e;
  --wrong:#e67f70; --wrong-bg:#3d201b66; --wrong-bd:#7a3a31;
  --idle:#232c27; --idle-fg:#7f8d84;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 22px rgba(0,0,0,.35);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#11161b; --surface:#19211d; --surface-2:#202823;
  --fg:#e9ede9; --muted:#9db0a6; --border:#2d3a33;
  --accent:#43b78c; --accent-ink:#5ac79c; --accent-soft:#1c342b;
  --gold:#d6b25e;
  --correct:#54c48d; --correct-bg:#153626; --correct-bd:#2f6a4e;
  --wrong:#e67f70; --wrong-bg:#3d201b; --wrong-bd:#7a3a31;
  --idle:#232c27; --idle-fg:#7f8d84;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 22px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);line-height:1.5;
  -webkit-font-smoothing:antialiased;font-size:16px}
.wrap{max-width:var(--maxw);margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:24px 56px}
.ar{font-family:var(--font-ar);font-size:1.15em;line-height:1.9}
h1,h2,h3{font-family:var(--font-display);font-weight:400;text-wrap:balance;margin:0}
.muted{color:var(--muted)}
button{font-family:inherit;cursor:pointer}

/* ---------- Start screen ---------- */
.hero{background:var(--surface);border:1px solid var(--border);border-radius:18px;
  box-shadow:var(--shadow);overflow:hidden}
.hero-top{padding:30px 26px 22px;background:
  radial-gradient(120% 120% at 100% 0,var(--accent-soft) 0,transparent 60%);
  border-bottom:1px solid var(--border)}
.eyebrow{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:700}
.hero h1{font-size:clamp(1.8rem,5vw,2.6rem);margin:.4rem 0 .3rem;color:var(--accent-ink)}
.hero-sub{color:var(--muted);font-size:1.02rem;max-width:40ch}
.creed{margin:22px 26px;padding:18px 20px;border-radius:14px;background:var(--surface-2);
  border:1px solid var(--border);border-left:4px solid var(--accent)}
.creed .lbl{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:6px}
.creed p{margin:0;font-size:1.06rem;line-height:1.65}
.meta-row{display:flex;flex-wrap:wrap;gap:12px;margin:0 26px 8px}
.stat{flex:1 1 7rem;min-width:0;background:var(--surface-2);border:1px solid var(--border);
  border-radius:12px;padding:12px 14px}
.stat b{font-family:var(--font-display);font-size:1.5rem;color:var(--accent-ink);display:block;line-height:1.1}
.stat span{font-size:.82rem;color:var(--muted)}
.rules{margin:16px 26px 8px;padding:0;list-style:none;display:grid;gap:9px}
.rules li{display:flex;gap:10px;align-items:flex-start;font-size:.95rem;color:var(--fg)}
.rules li::before{content:"";flex:0 0 7px;height:7px;border-radius:50%;background:var(--accent);margin-top:8px}
.actions{padding:20px 26px 28px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.btn{border:1px solid transparent;border-radius:11px;padding:13px 22px;font-size:1rem;font-weight:600;
  background:var(--accent);color:#fff;transition:filter .15s,transform .05s}
.btn:hover{filter:brightness(1.06)} .btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--accent-ink);border-color:var(--border)}
.btn.ghost:hover{background:var(--surface-2);filter:none}
.btn.sm{padding:9px 15px;font-size:.9rem;border-radius:9px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.books{margin:4px 26px 0;font-size:.82rem;color:var(--muted);line-height:1.7}
.books b{color:var(--fg);font-weight:600}

/* ---------- Top bar (quiz) ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--border);margin-bottom:22px}
.topbar-in{max-width:var(--maxw);margin:0 auto;display:flex;align-items:center;gap:12px;
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.counter{font-family:var(--font-display);font-size:1.05rem;white-space:nowrap}
.counter small{color:var(--muted);font-size:.8em}
.progress{flex:1 1 auto;min-width:0;height:8px;border-radius:99px;background:var(--idle);overflow:hidden}
.progress>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--gold));transition:width .25s}
.iconbtn{border:1px solid var(--border);background:var(--surface);color:var(--fg);border-radius:9px;
  padding:7px 11px;font-size:.85rem;font-weight:600}

/* ---------- Question card ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);
  padding:24px 22px}
.qtag{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px}
.qtext{font-size:1.22rem;line-height:1.5;margin:0 0 20px;font-weight:500}
.opts{display:grid;gap:11px}
.opt{display:flex;gap:13px;align-items:flex-start;text-align:start;width:100%;
  background:var(--surface-2);border:1.5px solid var(--border);border-radius:12px;padding:14px 15px;
  font-size:1.02rem;color:var(--fg);transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--accent)}
.opt .key{flex:0 0 1.6rem;height:1.6rem;border-radius:50%;background:var(--surface);border:1.5px solid var(--border);
  display:grid;place-items:center;font-weight:700;font-size:.9rem;color:var(--muted);font-family:var(--font-display)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .key{background:var(--accent);border-color:var(--accent);color:#fff}
.opt .txt{min-width:0;padding-top:1px}
.navbtns{display:flex;gap:11px;margin-top:20px;align-items:center;flex-wrap:wrap}
.spacer{flex:1 1 auto}

/* ---------- Jump navigator ---------- */
.jump{margin-top:18px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px}
.jump h3{font-size:.95rem;margin-bottom:12px;color:var(--muted);letter-spacing:.04em}
.grid-n{display:grid;grid-template-columns:repeat(auto-fill,minmax(2.2rem,1fr));gap:7px}
.cell{aspect-ratio:1;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);
  color:var(--muted);font-weight:600;font-size:.82rem;font-variant-numeric:tabular-nums;
  display:grid;place-items:center;transition:transform .05s}
.cell:hover{transform:translateY(-1px)}
.cell.answered{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent)}
.cell.current{outline:2px solid var(--gold);outline-offset:1px}
.cell.correct{background:var(--correct-bg);color:var(--correct);border-color:var(--correct-bd)}
.cell.wrong{background:var(--wrong-bg);color:var(--wrong);border-color:var(--wrong-bd)}
.cell.blank{background:var(--idle);color:var(--idle-fg)}

/* ---------- Results ---------- */
.score{background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);
  padding:26px;text-align:center;margin-bottom:18px;background-image:
  radial-gradient(130% 120% at 50% -10%,var(--accent-soft) 0,transparent 55%)}
.score .big{font-family:var(--font-display);font-size:clamp(2.6rem,10vw,4rem);line-height:1;color:var(--accent-ink)}
.score .pct{font-size:1.1rem;color:var(--muted);margin-top:6px}
.score .tags{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:16px}
.pill{border-radius:99px;padding:7px 14px;font-size:.88rem;font-weight:600;border:1px solid var(--border)}
.pill.ok{background:var(--correct-bg);color:var(--correct);border-color:var(--correct-bd)}
.pill.no{background:var(--wrong-bg);color:var(--wrong);border-color:var(--wrong-bd)}
.pill.sk{background:var(--idle);color:var(--idle-fg)}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin:4px 2px 14px;font-size:.84rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.dot{width:13px;height:13px;border-radius:4px;border:1px solid var(--border)}
.dot.c{background:var(--correct-bg);border-color:var(--correct-bd)}
.dot.w{background:var(--wrong-bg);border-color:var(--wrong-bd)}
.dot.b{background:var(--idle)}

/* review panel */
.review{margin-top:18px;display:grid;gap:14px}
.rev-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 17px;scroll-margin-top:72px}
.rev-head{display:flex;gap:10px;align-items:baseline;margin-bottom:4px}
.rev-num{font-family:var(--font-display);font-size:1.05rem;color:var(--accent-ink)}
.rev-badge{font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:99px;text-transform:uppercase;letter-spacing:.06em}
.rev-badge.ok{background:var(--correct-bg);color:var(--correct)}
.rev-badge.no{background:var(--wrong-bg);color:var(--wrong)}
.rev-badge.sk{background:var(--idle);color:var(--idle-fg)}
.rev-q{font-weight:500;font-size:1.08rem;margin:6px 0 13px;line-height:1.45}
.rev-opts{display:grid;gap:8px}
.rev-opt{display:flex;gap:11px;align-items:flex-start;border:1.5px solid var(--border);border-radius:10px;
  padding:11px 13px;font-size:.98rem;background:var(--surface-2)}
.rev-opt .key{flex:0 0 1.5rem;height:1.5rem;border-radius:50%;display:grid;place-items:center;
  font-weight:700;font-size:.85rem;font-family:var(--font-display);border:1.5px solid var(--border);background:var(--surface);color:var(--muted)}
.rev-opt.c{background:var(--correct-bg);border-color:var(--correct-bd);color:var(--correct)}
.rev-opt.c .key{background:var(--correct);border-color:var(--correct);color:#fff}
.rev-opt.w{background:var(--wrong-bg);border-color:var(--wrong-bd);color:var(--wrong)}
.rev-opt.w .key{background:var(--wrong);border-color:var(--wrong);color:#fff}
.rev-opt .mark{margin-inline-start:auto;font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;align-self:center}
.filterbar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 2px}
.chip{border:1px solid var(--border);background:var(--surface);color:var(--fg);border-radius:99px;
  padding:7px 14px;font-size:.86rem;font-weight:600}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.foot{margin-top:28px;text-align:center;color:var(--muted);font-size:.82rem;line-height:1.7}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
/* buton sqarimi + popup */
.hintbtn{margin-top:14px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--gold)}
.modal-bk{position:fixed;inset:0;z-index:40;background:rgba(10,22,17,.55);
  display:flex;align-items:flex-end;justify-content:center;padding:0;animation:fade .15s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media(min-width:560px){.modal-bk{align-items:center;padding:20px}}
.modal{background:var(--surface);border:1px solid var(--border);width:100%;max-width:34rem;
  border-radius:18px 18px 0 0;box-shadow:0 -8px 40px rgba(0,0,0,.35);
  padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));max-height:86vh;overflow:auto}
@media(min-width:560px){.modal{border-radius:18px}}
.modal .mtag{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:8px}
.modal .mq{font-weight:500;font-size:1.1rem;margin:0 0 15px;line-height:1.45}
.modal .ans{display:flex;gap:11px;align-items:flex-start;background:var(--correct-bg);
  border:1.5px solid var(--correct-bd);border-radius:12px;padding:13px 14px;color:var(--correct)}
.modal .ans .key{flex:0 0 1.6rem;height:1.6rem;border-radius:50%;background:var(--correct);color:#fff;
  display:grid;place-items:center;font-weight:700;font-family:var(--font-display)}
.modal .ans .atx{min-width:0;padding-top:1px;font-weight:600}
.modal .why{margin-top:14px;padding:13px 15px;background:var(--surface-2);border:1px solid var(--border);
  border-left:4px solid var(--gold);border-radius:10px;font-size:.98rem;line-height:1.55}
.modal .why b{color:var(--gold);display:block;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;margin-bottom:5px}
.modal .closeRow{display:flex;justify-content:flex-end;margin-top:18px}
.rev-why{margin-top:12px;padding:11px 14px;background:var(--surface-2);border:1px solid var(--border);
  border-left:4px solid var(--gold);border-radius:9px;font-size:.92rem;line-height:1.5}
.rev-why b{color:var(--gold);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;margin-inline-end:6px}
@media (max-width:420px){
  .creed,.meta-row,.rules,.actions,.books{margin-left:18px;margin-right:18px}
  .card{padding:20px 16px}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================ TË DHËNAT: 200 PYETJE ============================ */
/* Burimet: 1) Takribut-Tedmurijje (f.21-46) 2) El-Kavaidul-Muthla – Ibn Uthejmin
             3) Fet'hu Rabbil-Berijje bi telkhisil-Hamauijje – Ibn Uthejmin.
   a = indeksi i përgjigjes së saktë (në renditjen e shkruar).                       */
const QUESTIONS = [
/* ——— Hyrje & rëndësia ——— */
{t:"Hyrje",q:"Teuhidi i emrave dhe cilësive përbën:",o:["Llojin e tretë të teuhidit, krahas rububijjetit dhe uluhijjetit","Një degë të teuhidit të rububijjetit","Një degë të teuhidit të uluhijjetit","Një lloj të pavarur që s'ka lidhje me dy llojet e tjera"],a:0,e:"Teuhidi ndahet në tri lloje: rububijjet, uluhijjet, dhe emra-e-cilësi; i treti është i pandashëm por i dallueshëm nga dy të parët."},
{t:"Hyrje",q:"Besimi në Allahun, siç e përshkruan Ibn Uthejmini, ngërthen katër çështje. Cila prej tyre e përmbledh teuhidin e emrave dhe cilësive?",o:["Besimi në ekzistencën e Allahut","Besimi në rububijjetin e Tij","Besimi në uluhijjetin e Tij","Besimi në atë që Ai e pohoi për Veten prej emrash e cilësish"],a:3,e:"Katër çështjet: ekzistenca, rububijjeti, uluhijjeti, dhe emrat e cilësitë; e fundit është pikërisht teuhidi i asma ue sifat."},
{t:"Hyrje",q:"Ajeti «وَلِلَّهِ الْأَسْمَاءُ الْحُسْنَى فَادْعُوهُ بِهَا» përmban urdhrin për ta thërritur Allahun me emrat e Tij; kjo lutje përfshin:",o:["Vetëm lutjen e kërkesës (mes'ele)","Vetëm lutjen e adhurimit (ibade)","Si lutjen e kërkesës ashtu edhe atë të adhurimit","Lutjen me zë të lartë në çdo rast"],a:2,e:"«Du'a» në ajet ngërthen du'anë e mes'eles (kërkesa) dhe du'anë e ibades (adhurimi) nëpërmjet kuptimit të emrave."},
{t:"Hyrje",q:"Dallimi thelbësor mes lutjes së kërkesës dhe lutjes së adhurimit me emrat e Allahut është:",o:["E para i paraprin kërkesës me një emër të përshtatshëm; e dyta adhuron sipas kuptimit të emrit","E para bëhet natën, e dyta ditën","E para me zë, e dyta pa zë","Nuk ka dallim mes tyre"],a:0,e:"Mes'ele: «Ja Gafur, më fal». Ibade: të pendohesh ngaqë Ai është Et-Teuuab, ta frikësohesh fshehtas ngaqë është El-Latifu'l-Habir."},
{t:"Hyrje",q:"Pse njohja e emrave dhe cilësive zë pozitë aq të lartë sa pa të adhurimi mbetet i mangët?",o:["Sepse e lehtëson jetën në dynja","Sepse robi nuk mund ta adhurojë Allahun me vetëdije (besira) pa e njohur Atë","Sepse është kusht i vlefshmërisë së abdesit","Sepse e shumëfishon shpërblimin e sadakasë"],a:1,e:"Adhurimi i plotë kërkon njohje; kush e njeh Allahun me emrat e cilësitë e adhuron me basira dhe dashuri e frikë."},
{t:"Hyrje",q:"«Et-Teuuab» (Pranuesi i pendimit) adhurohet në formën e lutjes së adhurimit kur robi:",o:["I kërkon vetëm begati materiale","Bën teube ngaqë e di se Ai e pranon pendimin","E përmend vetëm me gjuhë pa vepër","E mëson emrin përmendsh"],a:1,e:"Lutja e adhurimit është ta adhurosh Allahun sipas kuptimit të emrit — teube ngaqë Ai është Et-Teuuab."},
{t:"Hyrje",q:"Thelbi i teuhidit të emrave e cilësive, siç e pohon Ehlu Sunneti, është:",o:["Pohimi i tyre me ngjasim ndaj krijesave","Pohimi i tyre ashtu siç i takojnë Allahut, pa tahrif, ta'til, tekjif e temthil","Mohimi i kuptimit dhe dorëzimi i tij Allahut","Interpretimi i tyre sipas gjuhës filozofike"],a:1,e:"Rregulli i artë i Ehlu Sunnetit: pohim pa temthil, tenzih pa ta'til — «لَيْسَ كَمِثْلِهِ شَيْءٌ وَهُوَ السَّمِيعُ الْبَصِيرُ»."},
{t:"Hyrje",q:"Cila nga këto NUK llogaritet prej çështjeve që ngërthen besimi i drejtë në Allahun?",o:["Besimi në rububijjetin e Tij","Besimi në uluhijjetin e Tij","Besimi se Ai ka nevojë për krijesat e Tij","Besimi në emrat dhe cilësitë e Tij"],a:2,e:"Nevoja ndaj krijesave është mangësi; Allahu është El-Ganijj (i Pavaruri), ndaj kjo s'është prej besimit por e kundërta e tij."},

/* ——— Rregullat e EMRAVE ——— */
{t:"Emrat",q:"Pohimi se «emrat e Allahut janë të gjithë husna» nënkupton se ata:",o:["Janë thjesht etiketa dalluese pa përmbajtje","Përmbajnë kuptime të përsosura pa asnjë mangësi në asnjë aspekt","Janë të kufizuar në numër dhe në kuptim","Tregojnë vetëm Qenien pa cilësi"],a:1,e:"«Husna» = kulmi i bukurisë, ngaqë secili ngërthen cilësi të plotë përsosmërie, pa mangësi real ose të supozuar."},
{t:"Emrat",q:"Emri «El-Hajj» është husna sepse ngërthen:",o:["Një jetë të ngjashme me jetën e krijesave","Jetën e plotë që s'i paraprin mosekzistencë, s'e pason zhdukje, dhe kërkon çdo përsosmëri","Vetëm vazhdimësinë pa cilësi të tjera","Një jetë të fituar pas mosqenies"],a:1,e:"El-Hajj ngërthen jetën e përkryer që sjell domosdoshmërisht dituri, fuqi, dëgjim e shikim të përsosura."},
{t:"Emrat",q:"Pse bukuria e emrave shfaqet edhe në çiftëzimin e tyre, p.sh. «El-Azizu'l-Hakim»?",o:["Sepse çdo emër më vete tregon mangësi që plotësohet nga tjetri","Sepse bashkimi i «izzetit» me «urtësinë» largon keqkuptimin se forca është e verbër","Sepse dy emra kanë më shumë shkronja","Sepse njëri e mohon tjetrin"],a:1,e:"Bukuria është edhe në çiftim: izzeti i Allahut shoqërohet me urtësi, ndryshe nga forca e padrejtë e krijesave."},
{t:"Emrat",q:"Thënia se emrat e Allahut janë njëkohësisht «a'lam ue ausaf» do të thotë se ata:",o:["Tregojnë Qenien (si emra) dhe bartin kuptime (si cilësi)","Janë vetëm etiketa pa kuptim","Janë vetëm cilësi që s'tregojnë Qenien","Ndryshojnë nga një kohë në tjetrën"],a:0,e:"Si a'lam tregojnë një të emërtuar (Allahun); si ausaf bartin kuptime — prandaj janë sinonimë në njërën anë, të ndryshëm në tjetrën."},
{t:"Emrat",q:"Në ç'kuptim emrat e Allahut janë «muteradife» (sinonimë) dhe në ç'kuptim «mutebajine» (të ndryshëm)?",o:["Sinonimë në kuptim, të ndryshëm në Qenie","Sinonimë sepse tregojnë një të emërtuar; të ndryshëm sepse secili bart kuptim të veçantë","Sinonimë në numër, të ndryshëm në shqiptim","Të dyja njëkohësisht në të njëjtin aspekt"],a:1,e:"Nga tregimi i Qenies janë sinonimë (një i emërtuar); nga kuptimet janë të ndryshëm (El-Alim ≠ El-Kadir ≠ Es-Semi')."},
{t:"Emrat",q:"Pohimi «Allahu është Semi' pa dëgjim, Basir pa shikim» përfaqëson metodën e:",o:["Ehlu Sunnetit që pohon emrin e cilësinë","Mohuesve që i zbrazin emrat prej kuptimeve (ehlu te'tilit)","Mushebbihëve që ngjasojnë cilësitë","Selefit që ndalet te lafzi"],a:1,e:"Zbrazja e emrit prej cilësisë që bart është ta'til; Ehlu Sunneti pohon emrin bashkë me cilësinë që ai ngërthen."},
{t:"Emrat",q:"Arsyeja pse «Ed-Dehr» (koha) nuk llogaritet prej emrave të Allahut është:",o:["Sepse s'përmendet në Kuran","Sepse është emër i ngrirë (xhamid) që s'bart kuptim cilësie, dhe është emër i kohës","Sepse e thonë Mutezilët","Sepse ka kuptim negativ"],a:1,e:"Emri duhet të bartë kuptim përsosmërie; «Ed-Dehr» është emër i kohës, jamid, pa kuptim që e bashkon me el-husna."},
{t:"Emrat",q:"Hadithi «أنا الدهر» (në një transmetim «لا تسبوا الدهر فإن الله هو الدهر») kuptohet në dritën e fjalisë vijuese:",o:["«بيدي الأمر أقلب الليل والنهار» — pra Ai e drejton kohën","Se koha është vetë Allahu","Se Dehri është krijesa më e lartë","Se koha ka vullnet të pavarur"],a:0,e:"Kuptimi: «Në Dorën Time është çështja, e ndërroj natën e ditën» — pra Allahu e sundon kohën, s'është vetë koha."},
{t:"Emrat",q:"Emri që tregon cilësi kalimtare (muteadije), si «Es-Semi'», ngërthen tri çështje; cili rend është i saktë?",o:["Pohimi i emrit, i Qenies, dhe i gjykimit","Pohimi i emrit, i cilësisë (dëgjimit), dhe i gjykimit/efektit të saj","Pohimi i cilësisë, i mënyrës, dhe i numrit","Pohimi i emrit dhe mohimi i cilësisë e gjykimit"],a:1,e:"Emri me cilësi kalimtare ngërthen: emrin, cilësinë, dhe gjykimin/efektin — Es-Semi' → dëgjimi → «يَسْمَعُ تَحَاوُرَكُمَا»."},
{t:"Emrat",q:"Emri që tregon cilësi JOkalimtare (si «El-Hajj») ndryshon nga ai kalimtar sepse ngërthen:",o:["Tri çështje","Vetëm dy: pohimin e emrit dhe pohimin e cilësisë, pa gjykim kalimtar","Vetëm emrin pa cilësi","Katër çështje"],a:1,e:"Cilësia jokalimtare s'ka objekt, prandaj emri ngërthen vetëm emrin dhe cilësinë (El-Hajj → hajat)."},
{t:"Emrat",q:"«El-Halik» e tregon Qenien e Allahut dhe cilësinë e krijimit së bashku me treguesin e:",o:["Tedammunit","Mutabekas (përputhjes së plotë)","Iltizamit","Kijasit"],a:1,e:"Treguesi i mutabekas = fjala tregon tërë kuptimin e saj (Qenien + cilësinë e krijimit së bashku)."},
{t:"Emrat",q:"«El-Halik» tregon diturinë dhe fuqinë e Allahut me treguesin e:",o:["Mutabekas","Tedammunit","Iltizamit (domosdoshmërisë)","Mohimit"],a:2,e:"Krijimi kërkon domosdoshmërisht dituri e fuqi; pra El-Halik i tregon ato me iltizam (jashtë kuptimit të drejtpërdrejtë)."},
{t:"Emrat",q:"Pohimi se emrat e Allahut janë «teukifijje» përjashton:",o:["Marrjen e tyre nga Kurani dhe Sunneti","Çdo shtim a pakësim me anë të mendjes a kijasit","Lutjen me ta","Besimin në kuptimet e tyre"],a:1,e:"Teukifijje = kufizohen në atë që solli teksti; mendja s'ka kompetencë të shtojë a heqë emra."},
{t:"Emrat",q:"Pse mendja nuk ka autoritet të shpikë emra për Allahun?",o:["Sepse arabishtja është e vështirë","Sepse mendja s'e kap atë që i takon Allahut, e emërtimi pa dije është shpifje ndaj Tij","Sepse Profeti ndaloi menduarit","Sepse emrat janë të fshehtë nga të gjithë"],a:1,e:"Emërtimi i Allahut me diçka pa teukif është «القول على الله بلا علم» — e ndaluar rreptësisht."},
{t:"Emrat",q:"Hadithi «إن لله تسعة وتسعين اسمًا... من أحصاها دخل الجنة» NUK e kufizon numrin e emrave sepse:",o:["Është hadith i dobët","Formulimi s'është «emrat e Allahut janë 99», por «Allahu ka 99 emra, kush i numëron...»","Numri 99 është simbolik","Emrat janë saktësisht 100"],a:1,e:"Ndryshe nga «emrat janë 99», formulimi «ka 99, kush i numëron hyn në Xhennet» s'e përjashton ekzistencën e emrave të tjerë."},
{t:"Emrat",q:"Prova më e fortë se emrat e Allahut s'janë të kufizuar me numër është:",o:["Lista e dijetarëve","Hadithi «...أو استأثرت به في علم الغيب عندك» — ka emra që Allahu i mbajti në dijen e fshehtë","Numërimi i emrave në Kuran","Mendimi i Mutezilëve"],a:1,e:"Lutja profetike përmend emra «që i veçove në dijen e fshehtë» — të panumërueshëm për ne, pra emrat s'janë të kufizuar."},
{t:"Emrat",q:"Çfarë statusi ka hadithi që i PËRCAKTON 99 emrat në një listë të caktuar (transmetimi i Velid ibn Muslimit)?",o:["Mutevatir","I dobët (da'if); përcaktimi s'është fjalë e Profetit sipas dijetarëve të hadithit","Muttefekun alejhi","Kudsij"],a:1,e:"Numri 99 është në Buhari e Muslim, por LISTA e caktuar vjen me zinxhir të dobët; përcaktimi nuk i atribuohet Profetit."},
{t:"Emrat",q:"«El-Ihsa» i emrave, që shpie në Xhennet, në kuptimin e tij më të plotë nënkupton:",o:["Vetëm numërimin me gishta","Ruajtjen në shprehje, kuptimin e domethënies, dhe adhurimin e Allahut me to","Vetëm shkrimin e tyre","Përsëritjen 99 herë në ditë"],a:1,e:"Ihsa përfshin tri shkallë: t'i ruash, t'i kuptosh, dhe t'i adhurosh Allahut sipas përmbajtjes së tyre."},
{t:"Emrat",q:"Ilhadi (shmangia) në emrat e Allahut përkufizohet si:",o:["Numërimi i tyre","Animi me ta nga e vërteta e detyrueshme rreth tyre","Lutja me ta","Pohimi i kuptimeve të tyre"],a:1,e:"Ilhad = «el-mejl» (anim); në emra = shmangia prej asaj që është detyrë ndaj tyre (mohim, ngjasim, shpifje, nxjerrje idhujsh)."},
{t:"Emrat",q:"Cila nga këto është shembull i ilhadit përmes «emërtimit të Allahut me çka s'e ka emërtuar Veten»?",o:["Mohimi i cilësive nga Xhehmijtë","Emërtimi i Tij «Baba» nga të krishterët, ose «shkaku vepërues» nga filozofët","Ngjasimi i Dorës me dorën e krijesës","Nxjerrja e El-Uzzasë nga El-Aziz"],a:1,e:"Ky lloj ilhadi është emërtimi pa teukif: «el-Eb» te të krishterët, «el-illetu'l-fa'ile» te filozofët."},
{t:"Emrat",q:"Nxjerrja e emrave «El-Lat» nga «El-Ilah» dhe «El-Uzza» nga «El-Aziz» është shembull i:",o:["Ta'tilit","Ilhadit përmes nxjerrjes së emrave për idhujt","Tekjifit","Tefuidit"],a:1,e:"Mushrikët bënë ilhad duke prejardhur emra idhujsh nga emrat e Allahut — devijim nga qëllimi i tyre i vërtetë."},
{t:"Emrat",q:"Dallimi mes treguesit të mutabekas, tedammunit dhe iltizamit qëndron në atë që:",o:["Mutabeka = tregim i tërë kuptimit; tedammun = i një pjese; iltizam = i një gjëje jashtë kuptimit por të domosdoshme","Të tria tregojnë të njëjtën gjë","Iltizam = tërë kuptimi; mutabeka = pjesa","Vetëm mutabeka është e vlefshme"],a:0,e:"Mutabeka (tërësia), tedammun (pjesa brenda), iltizam (e domosdoshmja jashtë kuptimit) — tri llojet e dilaletit."},
{t:"Emrat",q:"Në cilin aspekt dy emra si «El-Alim» dhe «El-Kadir» konsiderohen të ndryshëm (mutebajin)?",o:["Në tregimin e Qenies","Në kuptimet e tyre të veçanta: dija ≠ fuqia","Në numrin e shkronjave","Në kohën e zbritjes"],a:1,e:"Si tregues të Qenies janë një; si tregues kuptimesh janë të ndryshëm — dija nuk është fuqia."},

/* ——— Rregullat e CILËSIVE ——— */
{t:"Cilësitë",q:"Pohimi se «cilësitë e Allahut janë të gjitha kemal» vërtetohet me:",o:["Vetëm me mendje","Me sem' (sheriat), akl (mendje) dhe fitra (natyrshmëri)","Vetëm me ixhma","Vetëm me shqisë"],a:1,e:"Tri rrugët: sheriati («وَلِلَّهِ الْمَثَلُ الْأَعْلَى»), mendja (çdo ekzistues real ka cilësi), dhe fitra që e madhëron të përkryerin."},
{t:"Cilësitë",q:"«وَلِلَّهِ الْمَثَلُ الْأَعْلَى» përdoret si provë sem'ije për:",o:["Mohimin e cilësive","Se Allahut i takon përshkrimi më i lartë e më i përsosur","Ngjasimin e Tij me krijesat","Kufizimin e cilësive"],a:1,e:"«El-Methelu'l-A'la» = cilësia/përshkrimi më sublim; pra çdo cilësi e Allahut është në kulmin e përsosmërisë."},
{t:"Cilësitë",q:"Një cilësi që është mangësi e pastër (vdekja, padituria, pafuqia, harresa) ndaj Allahut është:",o:["E lejuar të pohohet","E pamundur (mohohet patjetër, me pohim të së kundërtës së përkryer)","E detyrueshme të pohohet","E pëlqyeshme"],a:1,e:"Mangësia e pastër mohohet për Allahun; «وَتَوَكَّلْ عَلَى الْحَيِّ الَّذِي لَا يَمُوتُ» mohon vdekjen e pohon jetën e përkryer."},
{t:"Cilësitë",q:"Cilësia që është përsosmëri në një gjendje e mangësi në një tjetër (mekri, kejdi, hud'a) trajtohet me:",o:["Pohim absolut","Mohim absolut","Detajim: pohohet vetëm në kontekst të kundërpërgjigjes (mukabele), jo si cilësi e pakufizuar","Heshtje të plotë"],a:2,e:"Nuk pohohet e as mohohet absolutisht: «وَيَمْكُرُونَ وَيَمْكُرُ اللَّهُ» — mekri i Allahut vjen vetëm si kundërpërgjigje e drejtë."},
{t:"Cilësitë",q:"Pse Kurani e përshkruan Allahun me «mekr» dhe «istihza» vetëm në trajtën e kundërpërgjigjes?",o:["Sepse janë cilësi të zakonshme","Sepse si veprim nismëtar do të ishin mangësi, por si ndëshkim i drejtë ndaj armikut janë përsosmëri","Sepse Allahu nuk i ka këto cilësi fare","Sepse i përmendi vetëm një herë"],a:1,e:"Mekri/istihzaja janë lavdi kur janë përgjigje ndaj atij që i meriton; prandaj Kurani i kushtëzon me mukabele."},
{t:"Cilësitë",q:"Pse thënia popullore «خان الله من يخون» (Allahu e tradhton atë që tradhton) refuzohet, ndonëse mekri pranohet si kundërpërgjigje?",o:["Sepse është në arabisht","Sepse tradhtia (khijane) është mashtrim në vend amaneti — mangësi e qortueshme absolutisht, pa anë lavdie","Sepse është fjalë e gjatë","Sepse e thonë vetëm disa"],a:1,e:"Ndryshe nga mekri, khijaneti është pabesi në vend besimi — gjithmonë i qortueshëm; prandaj Allahu tha «فَأَمْكَنَ مِنْهُمْ», jo «fe khanehum»."},
{t:"Cilësitë",q:"Rregulli «dera e cilësive është më e gjerë se dera e emrave» mbështetet në atë që:",o:["Cilësitë janë më të lehta për t'u kuptuar","Çdo emër ngërthen cilësi, dhe disa cilësi lidhen me vepra e fjalë të Allahut që s'kanë fund","Emrat janë të fshehtë","Cilësitë janë metaforike"],a:1,e:"Çdo emër ngërthen cilësi (jo e kundërta), e cilësitë e lidhura me veprat s'kanë fund: «مَا نَفِدَتْ كَلِمَاتُ اللَّهِ»."},
{t:"Cilësitë",q:"Pse e përshkruajmë Allahun me «zbret», «vjen», «kap» por s'themi se prej emrave të Tij janë «En-Nazil», «El-Xhai», «El-Akhidh»?",o:["Sepse këto vepra s'kanë ndodhur","Sepse derë e cilësive (përshkrimi) është më e gjerë se derë e emrave (teukifi i emrave është më i ngushtë)","Sepse janë metafora","Sepse Mutezilët e ndaluan"],a:1,e:"Përshkruajmë me veprat siç erdhën, por emrat janë teukifijje e më të ngushta; s'nxjerrim emra nga çdo vepër."},
{t:"Cilësitë",q:"Ndarja parësore e cilësive sipas Ibn Uthejminit është:",o:["Vetjake dhe veprore","Pohuese (thubutijje) dhe mohuese (selbijje)","Lajmëruese dhe racionale","Të mëdha dhe të vogla"],a:1,e:"Ndarja e parë: thubutijje (ato që Allahu i pohoi — kemal) dhe selbijje (ato që i mohoi — naks)."},
{t:"Cilësitë",q:"Qëllimi kryesor kur Allahu MOHON një cilësi (selbijje) për Veten është:",o:["Thjesht mohimi, pa kuptim tjetër","Pohimi i përsosmërisë së të kundërtës, ngaqë mohimi i thjeshtë s'është lavdi","Krahasimi me krijesat","Fshehja e cilësisë"],a:1,e:"Mohimi bëhet lavdi vetëm kur ngërthen pohimin e së kundërtës së përkryer; mohimi i zhveshur mund të jetë edhe shenjë paaftësie."},
{t:"Cilësitë",q:"«وَمَا كَانَ اللَّهُ لِيُعْجِزَهُ مِن شَيْءٍ» — mohimi i paaftësisë këtu ngërthen:",o:["Vetëm mohimin e paaftësisë","Pohimin e përsosmërisë së diturisë DHE të fuqisë së Tij","Mohimin e diturisë","Pohimin e vetëm fuqisë"],a:1,e:"Prandaj vjen «إِنَّهُ كَانَ عَلِيمًا قَدِيرًا» — një cilësi selbijje mund të ngërthejë më shumë se një përsosmëri."},
{t:"Cilësitë",q:"Pse cilësitë pohuese (thubutijje) që Allahu lajmëroi për Veten janë shumë më të shumta se ato mohuese?",o:["Sepse mohimi është i vështirë","Sepse cilësitë pohuese tregojnë lavdi e kemal, e sa më shumë e të larmishme, aq më tepër shfaqet përsosmëria","Sepse Allahu i fshehu mohueset","Sepse mendja s'i kap"],a:1,e:"Cilësitë thubutijje janë medh ue kemal; shumësia dhe larmia e tyre e shfaq më plotë përsosmërinë e të përshkruarit."},
{t:"Cilësitë",q:"Cilësitë mohuese (selbijje) përmenden zakonisht vetëm në tri raste. Cili NUK është prej tyre?",o:["Tregimi i përgjithësisë së përsosmërisë («لَيْسَ كَمِثْلِهِ شَيْءٌ»)","Mohimi i trillimeve të gënjeshtarëve («أَن دَعَوْا لِلرَّحْمَٰنِ وَلَدًا»)","Largimi i hamendjes së mangësisë në një çështje të caktuar","Shpikja e cilësive të reja që mendja i sheh të bukura"],a:3,e:"Tri rastet: përgjithësimi i kemalit, mohimi i trillimeve, largimi i mangësisë së hamendur; cilësitë nuk shpiken me mendje."},
{t:"Cilësitë",q:"Cilësitë pohuese (thubutijje) ndahen më tej në:",o:["Vetjake (dhatijje) dhe veprore (fi'lijje)","Të qarta dhe të paqarta","Kalimtare dhe jokalimtare","Të lashta dhe të reja"],a:0,e:"Thubutijje → dhatijje (Allahu përshkruhet gjithmonë me to) dhe fi'lijje (lidhen me vullnetin)."},
{t:"Cilësitë",q:"Dallimi mes cilësive vetjake (dhatijje) dhe atyre veprore (fi'lijje) është:",o:["Dhatijje janë të dukshme, fi'lijje të fshehta","Dhatijje: Allahu përshkruhet me to përherë (dija, fuqia); fi'lijje: lidhen me vullnetin (nëse do, i bën)","Dhatijje janë metafora, fi'lijje reale","S'ka dallim mes tyre"],a:1,e:"Dhatijje nuk ndahen prej Tij (dija, fuqia, dëgjimi); fi'lijje varen nga meshi'eja (istiuaja, nuzuli)."},
{t:"Cilësitë",q:"Cilësitë lajmëruese (khaberijje) — fytyra, dy duart, dy sytë — klasifikohen te:",o:["Cilësitë veprore","Cilësitë vetjake (dhatijje)","Cilësitë mohuese","Cilësitë metaforike"],a:1,e:"Khaberijjet (uexh, jedejn, ajnejn) janë dhatijje, ngaqë Allahu përshkruhet me to përgjithmonë."},
{t:"Cilësitë",q:"Pse istiuaja mbi Arsh dhe nuzuli në qiellin e dynjasë klasifikohen si cilësi veprore (fi'lijje)?",o:["Sepse janë metafora","Sepse lidhen me vullnetin e Allahut — i realizon kur të dojë","Sepse i kanë edhe krijesat","Sepse janë mangësi"],a:1,e:"Fi'lijje = varen nga meshi'eja; istiuaja e nuzuli janë vepra që Allahu i kryen kur të dojë."},
{t:"Cilësitë",q:"Cilësia e Kelamit (Të folurit) te Ibn Uthejmini konsiderohet:",o:["Vetëm vetjake","Vetëm veprore","Vetjake-veprore njëkohësisht: vetjake nga origjina, veprore nga njësitë","Mohuese"],a:2,e:"Nga origjina (Allahu është gjithmonë folës) → dhatijje; nga njësitë (flet kur të dojë me çka të dojë) → fi'lijje: «إِذَا أَرَادَ شَيْئًا أَن يَقُولَ لَهُ كُن»."},
{t:"Cilësitë",q:"Çdo cilësi e lidhur me vullnetin e Allahut është njëkohësisht:",o:["E rastësishme, pa qëllim","E ndjekur nga urtësia (hikmeti) e Tij","E detyruar nga diçka","E pakuptimtë"],a:1,e:"«إِنَّ اللَّهَ كَانَ عَلِيمًا حَكِيمًا» — Allahu s'do asgjë veçse në pajtim me urtësinë, qoftë kjo e dukshme a e fshehtë për ne."},
{t:"Cilësitë",q:"Dy rreziqet që duhen shmangur patjetër në POHIMIN e cilësive janë:",o:["Dëgjimi dhe mendja","Temthili dhe tekjifi","Lutja dhe dhikri","Mohimi dhe pohimi"],a:1,e:"Kush pohon cilësitë duhet të largohet nga temthili (ngjasimi) dhe tekjifi (përshkrimi i mënyrës) — të dyja të kota me sem' e akl."},
{t:"Cilësitë",q:"Dallimi teorik mes temthilit dhe teshbihit (te ata që i dallojnë) është:",o:["Temthili = barazim në të gjitha cilësitë; teshbihi = barazim në shumicën e tyre","Temthili = pjesë; teshbihi = e tëra","Janë sinonime të plota","Temthili ka të bëjë me emrat, teshbihi me Qenien"],a:0,e:"Temthil = musavat në çdo cilësi; teshbih = musavat në shumicën; por preferohet shprehja «nefju't-temthil» për t'u pajtuar me Kuranin."},
{t:"Cilësitë",q:"Pse Kurani preferon shprehjen «nefju't-temthil» (mohimi i temthilit) ndaj «nefju't-teshbih»?",o:["Sepse teshbihi s'ekziston","Për t'u pajtuar me fjalën «لَيْسَ كَمِثْلِهِ شَيْءٌ», që e mohon «mith-lin»","Sepse është më e shkurtër","Sepse Mutezilët e përdorin"],a:1,e:"Kurani mohon «mithl» (të barabartin); prandaj shprehja më e saktë kur'anore është mohimi i temthilit."},
{t:"Cilësitë",q:"Thënia e Imam Ahmedit «لا يوصف الله إلا بما وصف به نفسه أو وصفه به رسوله» shpreh rregullin se cilësitë janë:",o:["Racionale","Teukifijje — vërtetohen vetëm nga Kurani e Sunneti","Metaforike","Të hapura për shtim me kijas"],a:1,e:"Si emrat, edhe cilësitë janë teukifijje: s'i tejkalojmë Kuranin dhe hadithin në pohim a mohim."},
{t:"Cilësitë",q:"Treguesi i Kuranit e Sunnetit për pohimin e një cilësie vjen në tri mënyra. Cila NUK është prej tyre?",o:["Përmendja e drejtpërdrejtë e cilësisë (izza, fuqia, fytyra)","Përfshirja e cilësisë nga një emër (El-Gafur → falja)","Përmendja e një vepre a përshkrimi që e tregon (istiuaja)","Nxjerrja e cilësisë përmes silogjizmit filozofik"],a:3,e:"Tri mënyrat: tesrihu bis-sifa, tedammunu'l-ism leha, tesrihu bi fi'l dall alejha — jo deduktim filozofik."},
{t:"Cilësitë",q:"Pohimi se cilësia e Allahut është «حقيقة» (reale) do të thotë:",o:["Metaforike (mexhaz)","Reale, jo mexhaz, por në mënyrën që i përshtatet Allahut e s'u ngjan krijesave","Identike me cilësitë e krijesave","Pa kuptim të njohur"],a:1,e:"Ehlu Sunneti i pohon cilësitë në kuptimin e tyre real (hakika), por «la'ike bihi» — pa ngjasim e pa tekjif."},

/* ——— Provat, dhahiri, tefuidi ——— */
{t:"Provat",q:"Provat e vetme me të cilat vërtetohen emrat dhe cilësitë e Allahut janë:",o:["Mendja dhe shija e shëndoshë","Libri dhe Sunneti — e asgjë tjetër","Ixhmaja dhe kijasi","Ëndrrat e të devotshëmve"],a:1,e:"Emrat e cilësitë janë gajb; vërtetohen vetëm me teukif prej Kuranit dhe Sunnetit, jo me mendje a burime të tjera."},
{t:"Provat",q:"Ndaj një shprehjeje që s'ka ardhur as pohim as mohim (si «el-xhihe», «el-xhism»), metoda e Ehlu Sunnetit ndaj LAFZIT (shprehjes) është:",o:["Pohimi i saj","Teuakkufi (ndalemi) — as pohojmë, as mohojmë vetë fjalën","Mohimi i saj","Përkthimi i saj"],a:1,e:"Ndaj lafzit të pandriçuar nga teksti ndalemi; kurse ndaj KUPTIMIT detajojmë (i verteti pranohet, i koti refuzohet)."},
{t:"Provat",q:"Ndaj KUPTIMIT të fjalës «el-xhihe» (drejtim) për Allahun, qëndrimi është:",o:["Pranim i plotë pa kusht","Detajim: drejtimi i poshtëm kot; i larti rrethues kot; i larti jo-rrethues i vërtetë","Mohim i plotë","Heshtje pa kuptim"],a:1,e:"Lafzi s'është në tekst → teuakkuf; por kuptimi detajohet: uluvv që i përshtatet madhështisë (jo-rrethues) është i vërtetë."},
{t:"Provat",q:"Detyra ndaj teksteve të cilësive, veçanërisht aty ku s'ka vend mendimi, është:",o:["T'i interpretojmë me mendje","T'i kalojmë mbi kuptimin e dukshëm (dhahir) pa tahrif","T'ua dorëzojmë kuptimin Allahut","T'i mohojmë fare"],a:1,e:"Kurani zbriti në arabishte të qartë; detyra është kuptimi i dhahirit pa tahrif, posaçërisht te cilësitë ku s'ka vend re'ji."},
{t:"Provat",q:"Prova kryesore se tekstet kuptohen sipas dhahirit arab është:",o:["Pajtimi i dijetarëve vetëm","Se Kurani zbriti «بِلِسَانٍ عَرَبِيٍّ مُّبِينٍ», dhe Allahu i qortoi çifutët pikërisht për tahrif","Se mendja e kërkon","Se është më e lehtë"],a:1,e:"Gjuha e qartë arabe kërkon kuptimin e dhahirit; çifutët u qortuan për shtrembërimin (tahrif) e fjalës nga vendet e saj."},
{t:"Provat",q:"Rregulli i tretë i provave te Kavaidu'l-Muthla: kuptimet e dukshme (dhauahir) të teksteve të cilësive janë:",o:["Krejtësisht të panjohura","Të njohura për nga kuptimi, të panjohura për nga mënyra (kejfijjeti)","Krejtësisht të njohura, edhe mënyra","Metaforike në tërësi"],a:1,e:"Dallimi vendimtar: kuptimin e dimë (p.sh. istiua = lartësi/qëndrim), mënyrën s'e dimë — prandaj refuzohet tefuidi i kuptimit."},
{t:"Provat",q:"Medh'hebi i Mufeuvide (që ia dorëzojnë Allahut edhe KUPTIMIN e cilësive, jo vetëm mënyrën) është:",o:["Medh'hebi i selefit","I kotë; Ibn Tejmijje e quan prej thënieve më të këqija të bidatit dhe ilhadit","Medh'hebi i saktë i Ehlu Sunnetit","I detyrueshëm për dijetarët"],a:1,e:"Tefuidi i kuptimit e bën shpalljen gjëegjëzë pa dobi; selefi pohuan kuptimet dhe ia lanë Allahut vetëm kejfijjetin."},
{t:"Provat",q:"Dallimi vendimtar mes metodës së selefit dhe asaj të Mufeuvide është:",o:["Selefi mohon kuptimin; Mufeuvidja e pohon","Selefi pohon kuptimin e ia lë Allahut mënyrën; Mufeuvidja ia lë Allahut edhe kuptimin","Të dy pohojnë gjithçka","Të dy mohojnë gjithçka"],a:1,e:"Thëniet e selefit janë mutevatir në pohimin e kuptimeve; vetëm kejfijjetin ia dorëzojnë Allahut — e kundërta e tefuidit të kuptimit."},

/* ——— Tre grupet & përkufizimet ——— */
{t:"Grupet",q:"Përballë kuptimeve të dukshme të teksteve të cilësive, njerëzit u ndanë në tri grupe. Grupi i parë (që e mbajtën dhahirin kuptim të vërtetë që i përshtatet Allahut) janë:",o:["Mushebbihet","Selefi — Ehlu Sunneti vel-Xhemati","Muattilet","Mufeuvidja"],a:1,e:"Vetëm ata që e mbajtën dhahirin kuptim të vërtetë të përshtatshëm për Allahun e meritojnë emrin «Ehlu Sunneti vel-Xhemati»."},
{t:"Grupet",q:"Grupi i dytë e bëri dhahirin kuptim të kotë që s'i përshtatet Allahut, POR e pohoi atë; këta janë:",o:["Selefi","Mushebbihet (ngjasuesit)","Ehlu te'tili","Mufeuvidja"],a:1,e:"Mushebbihet ranë në jinaje ndaj teksteve: e kuptuan dhahirin si ngjasim e pastaj e pohuan — kundër «لَيْسَ كَمِثْلِهِ شَيْءٌ»."},
{t:"Grupet",q:"Grupi i tretë e bëri dhahirin kuptim të kotë dhe pastaj e MOHOI kuptimin e vërtetë; këta janë:",o:["Ehlu Sunneti","Ehlu te'tili / Muattilet","Mushebbihet","Selefi"],a:1,e:"Muattilet e supozuan dhahirin ngjasim, e pastaj e mohuan kuptimin e vërtetë e të përshtatshëm — duke e quajtur «te'vil», që në të vërtetë është tahrif."},
{t:"Grupet",q:"Dallimi thelbësor mes Mushebbihëve dhe Muattilëve është se:",o:["Të dy mohojnë cilësitë","Mushebbihu e kupton gabim dhahirin dhe e POHON (ngjasim); Muattili e kupton gabim dhe e MOHON (zbrazje)","Të dy i pohojnë drejt cilësitë","Mushebbihu mohon, Muattili pohon"],a:1,e:"Të dy nisin nga i njëjti gabim (dhahiri = ngjasim), por njëri pohon ngjasimin, tjetri mohon kuptimin — të dyja të kota."},
{t:"Grupet",q:"Tahrifi dallohet nga ta'tili në atë që:",o:["Janë identikë","Tahrifi = shtrembërimi i tekstit te një kuptim tjetër; ta'tili = mohimi i vetë kuptimit/cilësisë","Tahrifi = pohim; ta'tili = ngjasim","Tahrifi ka të bëjë me emrat, ta'tili me veprat"],a:1,e:"Shpesh shkojnë bashkë: muattili e shtrembëron tekstin (tahrif) për të arritur mohimin e cilësisë (ta'til)."},
{t:"Grupet",q:"Ta'tili ndahet në dy shkallë. Ta'tili i plotë (kul-li) është medh'hebi i:",o:["Esharive","Xhehmijve (gulatët e të cilëve mohojnë edhe emrat)","Selefit","Mushebbihëve"],a:1,e:"Ta'til kul-li = mohim i të gjitha cilësive (Xhehmijtë), e gulatët e tyre mohojnë edhe emrat; ta'til xhuz'i = Esharitë."},
{t:"Grupet",q:"Ta'tili i pjesshëm (xhuz'i) — mohim i disa cilësive e jo i disave — është medh'hebi i:",o:["Xhehmijve të plotë","Esharive","Selefit","Sahabëve"],a:1,e:"Esharitë bëjnë ta'til xhuz'i: pohojnë shtatë cilësi e mohojnë pjesën tjetër; i pari me ta'til ishte El-Xha'd ibn Dirham."},
{t:"Grupet",q:"Kush ishte i pari që njihet se futi ta'tilin në këtë ummet, dhe kush i pari me teshbihin e Krijuesit me krijesën?",o:["Të dy: Xhehm ibn Safuan","Ta'til: El-Xha'd ibn Dirham; teshbih: Hisham ibn El-Hakem","Ta'til: Vasil ibn Ata; teshbih: El-Xha'd","Të dy: Hisham ibn El-Hakem"],a:1,e:"I pari me ta'til: El-Xha'd ibn Dirham; i pari me këtë lloj teshbihi (Krijuesin me krijesën): Hisham ibn El-Hakem err-Rafidij."},
{t:"Grupet",q:"Tekjifi, si term, dallohet nga temthili sepse:",o:["Janë e njëjta gjë","Tekjifi = përshkrimi i MËNYRËS (pa domosdo ngjasim); temthili = pohimi i një të BARABARTI (mithl)","Tekjifi = mohim; temthili = pohim i kuptimit","Tekjifi lidhet me emrat"],a:1,e:"Çdo temthil ngërthen tekjif, por jo e kundërta: mund të përshkruash mënyrë pa pohuar të barabartë — ndaj tekjifi është më i gjerë."},
{t:"Grupet",q:"Dallimi mes temthilit dhe teshbihit në përkufizim është:",o:["Temthili = pohim i «mith-lit» (të barabartit); teshbihi = pohim i «shebih-it» (të ngjashmit)","Janë sinonime pa dallim","Temthili lidhet me Qenien, teshbihi me emrat","Temthili = mohim; teshbihi = pohim"],a:0,e:"Mithl = barazim i plotë; shebih = ngjashmëri; disa dallojnë: temthil në çdo cilësi, teshbih në shumicën."},
{t:"Grupet",q:"Ilhadi, gjuhësisht, nënkupton:",o:["Dituri","«El-mejl» (anim/shmangie)","Pohim","Drejtësi"],a:1,e:"Ilhad = anim nga e drejta; në terminologji = shmangie prej asaj që është detyrë të besohet a të veprohet."},
{t:"Grupet",q:"Ilhadi në ajetet SHERIATIKE (tekstet) dhe ai në ajetet KAUNIJJE (krijimi) dallojnë në atë që:",o:["Të dy janë tahrif tekstesh","Në tekste = tahrif, përgënjeshtrim lajmesh, kundërshtim gjykimesh; në krijim = atribuim dikujt tjetër ose besim ortaku","Të dy janë shirk në adhurim","S'ka dallim"],a:1,e:"Ilhadi ndahet në atë të ajeteve sher'ijje (tekstet) dhe ato kaunijje (krijesat); secili ka format e veta."},
{t:"Grupet",q:"Ta'tili, në thelbin e tij, përkufizohet si:",o:["Pohimi i cilësive ashtu siç i takojnë Allahut","Zbrazja e Allahut nga cilësitë e përsosmërisë (ose nga disa prej tyre)","Përmendja e emrave të bukur","Lutja me emrat"],a:1,e:"Ta'til = ta'tilu'l-khalik an sifatihi — zbrazja e Krijuesit nga cilësitë që i takojnë, tërësisht ose pjesërisht."},

/* ——— Tedmurija ——— */
{t:"Tedmurija",q:"Devijuesit nga rruga e të dërguarve në emrat e cilësitë ndahen në dy lloje, që janë:",o:["Besimtarë dhe mohues","Mumethile (që teprojnë në pohim e mangësojnë në mohim) dhe Muattile (e kundërta)","Arabë dhe joarabë","Të ditur dhe injorantë"],a:1,e:"Mumethilet e tepruan pohimin (ngjasim) e mangësuan mohimin; Muattilet e tepruan mohimin e mangësuan pohimin — të dy devijime."},
{t:"Tedmurija",q:"Medh'hebi i Mumethileve rrëzohet me tri rrugë provash. Cilat?",o:["Sem', ixhma, kijas","Sem' (sheriat), akl (mendje) dhe hiss (shqisë)","Fitra, shija, zakoni","Vetëm me mendje"],a:1,e:"Rrëzohet me sheriatin («لَيْسَ كَمِثْلِهِ شَيْءٌ»), mendjen (Krijuesi ≠ krijesa në qenie→cilësi), dhe shqisën (dallimi i dukshëm i qenieve)."},
{t:"Tedmurija",q:"Ajeti «لَيْسَ كَمِثْلِهِ شَيْءٌ وَهُوَ السَّمِيعُ الْبَصِيرُ» është boshti sepse njëkohësisht:",o:["Mohon cilësitë dhe pohon ngjasimin","Rrëzon temthilin («لَيْسَ كَمِثْلِهِ شَيْءٌ») dhe pohon cilësitë («وَهُوَ السَّمِيعُ الْبَصِيرُ»)","Pohon temthilin","Mohon edhe emrat edhe cilësitë"],a:1,e:"Gjysma e parë mohon temthilin kundër Mumethilëve; gjysma e dytë pohon cilësitë kundër Muattilëve — një ajet kundër dy devijimeve."},
{t:"Tedmurija",q:"Sipas Tedmurijes, Muattilet ndahen në katër grupe (taife). Grupi i PARË — që pohojnë emrat dhe shtatë cilësi — janë:",o:["Mutezilët","Esharitë dhe ata që u ngjasojnë prej Maturidive e të tjerëve","Xhehmijtë","Filozofët"],a:1,e:"Grupi i parë (Esharitë/Maturiditë) pohon emrat dhe shtatë cilësi, e mohon shumicën e realiteteve të tjera."},
{t:"Tedmurija",q:"Shtatë cilësitë që pohon grupi i parë (Esharitë) janë:",o:["Fytyra, duart, sytë, ardhja, zbritja, istiuaja, mëshira","Jeta, Dituria, Fuqia, Vullneti, Të folurit, Dëgjimi, Shikimi","Mëshira, hidhërimi, dashuria, kënaqësia, urrejtja, ardhja, zbritja","Të gjithë emrat e bukur pa cilësi"],a:1,e:"Shtatë sifatu'l-me'ani: el-hajat, el-ilm, el-kudra, el-irade, el-kelam, es-sem', el-besar."},
{t:"Tedmurija",q:"Grupi i DYTË i Muattileve pohon emrat POR i zbraz nga cilësitë; këta janë:",o:["Esharitë","Mutezilët dhe pasuesit e tyre","Mushebbihet","Selefi"],a:1,e:"Mutezilët pohojnë emrat si etiketa: «Alim bila ilm, Kadir bila kudra» — pohim i emrit, mohim i cilësisë."},
{t:"Tedmurija",q:"Disa Mutezilë i trajtojnë emrat (El-Alim, El-Kadir, Es-Semi') si:",o:["Cilësi reale të ndryshme","Etiketa të zbrazëta ose sinonime që s'bartin kuptime të veçanta","Të krijuara nga robërit","Metafora të Qenies"],a:1,e:"Shubha e tyre: pohimi i cilësive kërkon tedammun; prandaj i bëjnë emrat etiketa pa përmbajtje — pozicion i refuzuar me sem' e akl."},
{t:"Tedmurija",q:"Grupi i TRETË i Muattileve mohon edhe emrat edhe cilësitë dhe e përshkruan Allahun vetëm me mohim; këta janë:",o:["Esharitë","Gulatët e Xhehmijve, Karamitët dhe Batinitët","Mutezilët","Maturiditë"],a:1,e:"Grupi i tretë (gulatu'l-xhehmijje, el-karamita, el-batinijje) e përshkruan Allahun me nefj të pastër («el-mevxhudu'l-mutlak bi shartil-itlak»)."},
{t:"Tedmurija",q:"Grupi i KATËRT (gulatu'l-gulat prej filozofëve e xhehmijve) e teproi edhe më tej duke:",o:["Pohuar të gjitha cilësitë","S'pohuar e s'mohuar — «as ekziston as s'ekziston, as i gjallë as i vdekur»","Ngjasuar Allahun me krijesat","Pohuar vetëm emrat"],a:1,e:"Grupi i katërt mohon edhe pohimin edhe mohimin, nga frika se pohimi ngjason me ekzistuesit dhe mohimi me joekzistuesit."},
{t:"Tedmurija",q:"Secili prej katër grupeve ra në pesë rreziqe (mehadhir). Cili NUK është prej tyre?",o:["Kundërshtimi i rrugës së selefit","Ta'tili i teksteve nga kuptimi i synuar dhe tahrifi i tyre","Zbrazja e Allahut nga cilësitë e kemalit që i përmbajnë tekstet","Pohimi i cilësive ashtu siç i takojnë Allahut, pa ngjasim"],a:3,e:"Pesë mehadhiret janë devijime; pohimi korrekt i cilësive s'është rrezik — është pikërisht rruga e shpëtimit e selefit."},
{t:"Tedmurija",q:"Parimi i parë (el-aslu'l-evvel) i Tedmurijes është:",o:["«El-kaulu fis-sifat kel-kauli fiz-dhat»","«El-kaulu fi ba'di's-sifat kel-kauli fi ba'd» (fjala për disa cilësi është si për disa të tjera)","«El-istivau ma'lum»","«Allahu fi kul-li mekan»"],a:1,e:"Parimi i parë u drejtohet atyre që pohojnë disa cilësi e mohojnë disa të tjera: s'ka dallim mes asaj që pohove e asaj që mohove."},
{t:"Tedmurija",q:"Zbatim i parimit të parë: atij që pohon iraden (vullnetin) e mohon gadabin (hidhërimin), i thuhet:",o:["Ke të drejtë në dallimin","S'ka dallim mes realitetit të iradës që pohove e gadabit që mohove — pohi të dyja a moho të dyja","Hidhërimi s'ekziston fare","Vullneti është metaforë"],a:1,e:"Parimi i parë detyron konsekuencë: kush pohon një cilësi real detyrohet të pohojë të ngjashmet; përndryshe bie në kundërthënie."},
{t:"Tedmurija",q:"Parimi i dytë (el-aslu'th-thani) i Tedmurijes është:",o:["«El-kaulu fis-sifat kel-kauli fiz-dhat» (fjala për cilësitë është si fjala për Qenien)","«El-istivau bid'a»","«El-esmau tis'atun ue tis'une»","«Akl mbi tekst»"],a:0,e:"Parimi i dytë u drejtohet mumethilit dhe muattilit: ashtu siç pohon Qenie që s'u ngjan qenieve, pohi cilësi që s'u ngjajnë cilësive."},
{t:"Tedmurija",q:"Si zbatohet parimi i dytë ndaj Mumethilit?",o:["«Moho edhe Qenien»","«A nuk pohon Qenie që s'u ngjan qenieve? Pra pse ia ngjason cilësitë cilësive të krijesave?»","«Pohi cilësitë dy herë»","«Hesht për Qenien»"],a:1,e:"Fjala për cilësitë është degë e fjalës për Qenien; kush s'e ngjason Qenien, s'duhet t'i ngjasojë cilësitë."},
{t:"Tedmurija",q:"Si zbatohet parimi i dytë ndaj Muattilit (Mutezilit)?",o:["«Moho edhe Qenien që s'ta pranon mendja»","«A nuk pohon Qenie që s'u ngjan qenieve të tjera? Atëherë pohi cilësi që s'u ngjajnë cilësive të tjera»","«Ngjasoje me krijesat»","«Hesht»"],a:1,e:"Muattilit i kthehet argumenti i tij: nëse pranon Qenie të papërngjashme pa rënë në tashbih, le të pranojë edhe cilësi të papërngjashme."},
{t:"Tedmurija",q:"Kur dikush pyet «Si (kejf) është istiuaja e Allahut?», përgjigjja sipas parimit të dytë është:",o:["«Istiuaja është ngjitje trupore»","«Fjala për cilësitë është si për Qenien — ma trego ti si është Qenia e Tij?»","«Istiuaja është vetëm sundim (istivla)»","«Allahu s'ka istiua»"],a:1,e:"Ashtu si pohojmë Qenie reale pa e ditur kejfin, pohojmë istiua reale pa e ditur kejfin — s'ka dallim."},
{t:"Tedmurija",q:"Thënia e Imam Malikut për istiuanë (kur u pyet «kejfe isteva?») ishte:",o:["«Istiuaja është e panjohur»","«El-istivau ma'lum, uel-kejfu mexhhul, uel-imanu bihi uaxhib, ues-su'alu anhu bid'a»","«Istiuaja do të thotë sundim»","«Mos e pohoni istiuanë»"],a:1,e:"«Istiuaja është e njohur (kuptimi), kejfi i panjohur, besimi detyrë, pyetja për të bidat» — rregull për çdo cilësi."},
{t:"Tedmurija",q:"Sipas shpjegimit të thënies së Malikut, «الاستواء معلوم» dhe «الكيف مجهول» ndajnë:",o:["Dy aspekte të kundërta që përjashtojnë njëri-tjetrin","Kuptimin (i njohur në gjuhë arabe) nga mënyra (e panjohur për ne)","Kohën nga vendi","Lafzin nga shqiptimi"],a:1,e:"Kuptimi i istiuasë njihet (lartësi/qëndrim kur kushtëzohet me «ala»); kejfijjeti mbetet i panjohur — pyetja për të është bidat."},
{t:"Tedmurija",q:"Istiuaja, kur kushtëzohet me parafjalën «على» (si në «اسْتَوَى عَلَى الْعَرْشِ»), ka kuptimin gjuhësor të:",o:["Të pushtuarit me forcë (istivla)","Lartësisë dhe qëndrimit/vendosjes (uluvv ue istikrar)","Të krijuarit","Mëshirës"],a:1,e:"«Isteva ala» në arabisht = u ngjit e qëndroi lart («لِتَسْتَوُوا عَلَى ظُهُورِهِ»); interpretimi «istivla» (pushtoi) është tahrif."},
{t:"Tedmurija",q:"Dy shembujt (el-methlan) që sjell Tedmurija për të ilustruar pohimin pa ngjasim janë:",o:["Dielli dhe hëna","Begatitë e Xhennetit dhe shpirti (err-ruh)","Qielli dhe toka","Jeta dhe vdekja"],a:1,e:"Begatitë e Xhennetit (reale, por ndryshe nga ato të dynjasë) dhe shpirti (real, por i panjohur për nga realiteti) ilustrojnë pohimin pa ngjasim."},
{t:"Tedmurija",q:"Begatitë e Xhennetit përputhen me ato të dynjasë në njërën anë e ndryshojnë në tjetrën; kjo tregon se:",o:["Ato janë identike","Përputhen në KUPTIM (emër) e ndryshojnë në REALITET — si pohimi i cilësive të Allahut","S'kanë lidhje fare","Janë metaforë"],a:1,e:"Ibn Abasi: «Në dynja s'ka gjë nga Xhenneti veç emrave» — përputhje në emër, ndryshim rrënjësor në realitet."},
{t:"Tedmurija",q:"Mësimi i shembullit të shpirtit (err-ruh) për çështjen e cilësive është:",o:["Shpirti është trup si trupat e tjerë","Shpirti është real, por s'u ngjan trupave të dëshmuar — aq më parësore Krijuesi: real, pa ngjasim","Shpirti s'ekziston","Shpirtin e njohim plotësisht"],a:1,e:"Kush e mohon shpirtin është muattil, kush e ngjason është mumeththil; aq më tepër Krijuesi — real, por pa ngjasim."},

/* ——— Hamawija ——— */
{t:"Hamawija",q:"Risaleja «El-Fetua El-Hamauijje» u shkrua nga Ibn Tejmijje si:",o:["Libër i pavarur fikhu","Përgjigje për një pyetje që i erdhi nga Shami rreth ajeteve e haditheve të cilësive","Letër drejtuar një mbreti","Koment i plotë i Kuranit"],a:1,e:"Ibn Tejmijje (v. 728 h.) e shkroi më 698 h. si përgjigje (~83 faqe) për një pyetje nga Shami; Ibn Uthejmini e përmblodhi."},
{t:"Hamawija",q:"Ibn Uthejmini e përmblodhi «El-Hamauijjen» në veprën e tij me titull:",o:["El-Kavaidu'l-Muthla","Fet'hu Rabbi'l-Berijje bi telkhisi'l-Hamauijje","Takribu't-Tedmurijje","Sherhu'l-Akideti'l-Uasitijje"],a:1,e:"Telkhis (përmbledhje) e Ibn Uthejminit i Hamauijes së Ibn Tejmijes."},
{t:"Hamawija",q:"Kreu i parë i Hamauijes thekson se detyrë mbi robin në fenë e tij është:",o:["Të ndjekë mendjen e tij","Të ndjekë atë që thanë Allahu, i Dërguari ﷺ dhe të parët e devotshëm (selefi, sahabët, tabi'inët)","Të ndjekë filozofët e urtë","Të heshtë ndaj çdo çështjeje"],a:1,e:"«قُلْ يَا أَيُّهَا النَّاسُ...» dhe «عليكم بسنتي وسنة الخلفاء الراشدين» — detyrë është pasimi i udhëzimit profetik dhe i selefit."},
{t:"Hamawija",q:"Risaleja e Profetit ﷺ, sipas Hamauijes, ngërthen dy gjëra, që janë:",o:["Pasuri dhe pushtet","Dije të dobishme ('ilm nafi') dhe vepër të mirë ('amel salih)","Lehtësi dhe vështirësi","Fjalë dhe heshtje"],a:1,e:"«هُوَ الَّذِي أَرْسَلَ رَسُولَهُ بِالْهُدَى وَدِينِ الْحَقِّ» — hudaja = dija e dobishme, dini'l-hakk = vepra e mirë; më e madhja dije është njohja e Allahut."},
{t:"Hamawija",q:"Argumenti pse është e pamundur që Profeti ﷺ ta ketë lënë mangët ose të paqartë sqarimin e emrave e cilësive është:",o:["Sepse ishte i pasur","Sepse ai ishte më i dituri për Zotin, më këshilluesi për ummetin, dhe më i qarti në shprehje — e çështja është më e rëndësishmja","Sepse ishte arab","Sepse jetoi gjatë"],a:1,e:"Njohja e Allahut është dija më e lartë; e pamundur që më i dituri, më këshilluesi e më i qarti ta lërë atë mangët."},
{t:"Hamawija",q:"Teza qendrore e Hamauijes për rrugën e selefit është se ajo është:",o:["Vetëm më e sigurt (aslem), kurse khalefi më e ditur","Njëkohësisht më e sigurt (aslem), më e ditur (a'lem) DHE më e urtë (ahkem)","Më e vështirë por më pak e saktë","E barabartë me rrugën e khalefit"],a:1,e:"Kundër pretendimit «selefi aslem, khalefi a'lem ue ahkem», Hamauija provon se selefi është aslem edhe a'lem edhe ahkem."},
{t:"Hamawija",q:"Pse pretendimi «rruga e selefit është aslem, por e khalefit a'lem ue ahkem» është kontradiktor në vetvete?",o:["Sepse selefi ishin pak në numër","Sepse siguria (selame) s'arrihet pa dituri e urtësi; pra «aslem» e kërkon domosdoshmërisht «a'lem» dhe «ahkem»","Sepse khalefi ishin shumë","Sepse është fjali e gjatë"],a:1,e:"Nuk ka selame pa ilm e hikme; të quash një rrugë më të sigurt e njëkohësisht më pak të ditur është kontradiktë e brendshme."},
{t:"Hamawija",q:"Pse e vërteta në çështjen e cilësive duhet të jetë te selefi e jo te khalefi (argumenti i dilemës)?",o:["Sepse selefi ishin arabë","Sepse ndryshe do pasonte se sahabët e tabi'inët ose folën të kotën ose heshtën nga e vërteta — të dyja të pamundura","Sepse khalefi ishin të varfër","Sepse selefi ishin më shumë"],a:1,e:"E vërteta ose është te selefi ose te khalefi; e dyta e bën ekzistencën e Kuranit e Sunnetit «darar mahd» — e pamundur."},
{t:"Hamawija",q:"Pretendimi se metoda e selefit ishte «thjesht besim në lafzet pa pohim kuptimi» (tefuid i kuptimit) është:",o:["I vërtetë dhe i saktë","Gënjeshtër ndaj selefit — ata ishin më të diturit e ummetit për kuptimet e teksteve","Mendim i Ibn Tejmijes","I saktë pjesërisht"],a:1,e:"Selefi pohuan kuptimet (herë përmbledhtas, herë hollësisht) e ia lanë Allahut vetëm kejfijjetin; tefuidi i kuptimit s'është medh'hebi i tyre."},
{t:"Hamawija",q:"Fakhrud-Din er-Razi, prototip i dijetarit të kelamit, në fund të jetës pranoi se:",o:["Kelami është shërues i sigurt","Rrugët kelamike e filozofike s'shërojnë të sëmurin e s'shuajnë etjen, dhe se rruga më e afërt është rruga e Kuranit","Selefi gabuan","Mendja duhet mbi tekstin"],a:1,e:"Rrëfimi i famshëm i Razit: «ما رأيتها تشفي عليلاً ولا تروي غليلاً... وأقرب الطرق طريقة القرآن» — pranim i epërsisë së rrugës së selefit."},
{t:"Hamawija",q:"Pse rruga e khalefit s'mund të jetë «më e ditur» (a'lem) se ajo e selefit?",o:["Sepse khalefi flisnin arabisht dobët","Sepse selefi janë trashëgimtarët e profetëve, që i morën dijet nga burimet e shpalljes, kurse khalefi i përzien me burime të huaja","Sepse khalefi ishin të paktë","Sepse selefi jetuan më gjatë"],a:1,e:"Selefi janë «verethetu'l-enbija»; khalefi e ngatërruan dijen me burime magjie, mushrikësh, çifutësh e Jonanësh — s'mund të jenë a'lem."},

/* ——— Lartësia (uluvvi) ——— */
{t:"Uluvvi",q:"Lartësia (uluvvi) e Allahut ndahet në dy lloje, që janë:",o:["Lartësi e dukshme dhe e fshehtë","Uluvvu'dh-dhat (lartësi e Qenies) dhe uluvvu's-sifat (lartësi e cilësive)","Lartësi e madhe dhe e vogël","Lartësi reale dhe metaforike"],a:1,e:"Uluvvi është prej cilësive dhatijje; ndahet në lartësi të Qenies (mbi krijesat) dhe lartësi të cilësive (çdo cilësi më e larta)."},
{t:"Uluvvi",q:"Dallimi mes uluvvu's-sifat dhe uluvvu'dh-dhat është:",o:["I pari = Allahu mbi Arsh; i dyti = cilësitë e larta","Sifat: çdo cilësi e Allahut është më e larta e më e plota; dhat: Qenia e Tij është mbi të gjitha krijesat","Të dy nënkuptojnë se Allahu është kudo","S'ka dallim mes tyre"],a:1,e:"Uluvvu's-sifat = përsosmëria absolute e çdo cilësie; uluvvu'dh-dhat = Qenia e Allahut mbi gjithë krijesat."},
{t:"Uluvvi",q:"Lartësia e Qenies së Allahut vërtetohet me sa prova?",o:["Vetëm me Kuran","Me pesë: Libër, Sunnet, ixhma, akl dhe fitra","Vetëm me mendje e shqisë","Me tri: Libër, Sunnet, kijas"],a:1,e:"Pesë burimet dëshmojnë njëzëri uluvvu'dh-dhat: Kurani, Sunneti, ixhmaja e selefit, mendja, dhe natyrshmëria."},
{t:"Uluvvi",q:"Argumenti mendor (akl) për lartësinë mbështetet në atë që:",o:["Lartësia e poshtërsia janë të barabarta","Lartësia (uluvv) është cilësi përsosmërie, kurse poshtërsia (sufl) është mangësi — pra Allahut i takon kemal-i","Lartësia është metaforë","Mendja s'ka vend këtu"],a:1,e:"Uluvvi është kemal, sufli naks; Allahut i takon çdo kemal e tenzihohet nga çdo naks, pra lartësia e Qenies është e domosdoshme."},
{t:"Uluvvi",q:"Cili prej këtyre ajeteve është provë e DREJTPËRDREJTË për lartësinë e Qenies (jo vetëm istiua)?",o:["«قُلْ هُوَ اللَّهُ أَحَدٌ»","«أَأَمِنتُم مَّن فِي السَّمَاءِ» / «يَخَافُونَ رَبَّهُم مِّن فَوْقِهِمْ»","«إِيَّاكَ نَعْبُدُ»","«اللَّهُ الصَّمَدُ»"],a:1,e:"Lartësia dëshmohet me uluvv, feukijje, istiua e «fi's-sema»: «أَأَمِنتُم مَّن فِي السَّمَاءِ», «يَخَافُونَ رَبَّهُم مِّن فَوْقِهِمْ»."},
{t:"Uluvvi",q:"Thënia e Imam El-Euza'ijt «كنا والتابعون متوافرون نقول...» përmban dëshminë se:",o:["Allahu është në çdo vend","Allahu, i Lartësuar qoftë, është mbi Arshin e Tij, dhe besohet në cilësitë e ardhura në Sunnet","Cilësitë janë metaforë","Mendja vendos për lartësinë"],a:1,e:"El-Euza'ij dëshmon ixhmanë e selefit (sahabë e tabi'inë) për uluvvin — «إن الله فوق عرشه»."},
{t:"Uluvvi",q:"Historia e Ebu'l-Me'ali El-Xhuvejnit me Ebu Xha'fer El-Hemedanin, për istiuanë, përfundon me pranimin se:",o:["Allahu është kudo me Qenien","Lartësia është domosdoshmëri e natyrshme (fitra) që s'largohet nga zemra — «حيّرني الهمداني»","Istiuaja është metaforë e sundimit","Arshi s'ekziston"],a:1,e:"El-Hemedani tregoi se tërheqja e zemrës drejt lart është fitra që s'mund të mohohet; El-Xhuvejni pranoi: «Më hutoi Hemedani»."},
{t:"Uluvvi",q:"Ajeti «سَبِّحِ اسْمَ رَبِّكَ الْأَعْلَى» dëshmon cilësinë e:",o:["Mëshirës","Lartësisë (uluvv)","Dëgjimit","Kelamit"],a:1,e:"«El-A'la» = më i Larti; ajeti pohon lartësinë e Allahut, prej cilësive dhatijje të Tij."},
{t:"Uluvvi",q:"Kuptimi i saktë i «وَهُوَ اللَّهُ فِي السَّمَاوَاتِ وَفِي الْأَرْضِ» është:",o:["Qenia e Allahut është në tokë ashtu si në qiell","Ai është i Adhuruari (el-ma'luh) në qiej e në tokë — hyjni e vetme kudo","Allahu është i përzier me krijesat","Allahu është kudo me Qenien"],a:1,e:"Kuptimi: Ai është Ilah/Ma'luh në qiej e në tokë; kush e kupton si prani e Qenies në tokë ka gabuar dhe gënjen se kjo është fjalë e selefit."},

/* ——— Xhihe, Arsh, Kursi, Istiua ——— */
{t:"Arshi",q:"Fjala «el-xhihe» (drejtim) për Allahun kërkon detajim. Drejtimi i poshtëm (sufl) për Allahun është:",o:["I vërtetë","I kotë (batil), sepse bie ndesh me lartësinë e Tij","I lejuar","Metaforik"],a:1,e:"Tri mundësitë: sufl (kot, kundër uluvvit); uluvv rrethues (kot); uluvv jo-rrethues (i vërtetë)."},
{t:"Arshi",q:"Nga tri mundësitë e «el-xhihe», cila është e vërteta?",o:["Drejtimi i poshtëm","Drejtimi i lartë që E RRETHON Allahun","Drejtimi i lartë që NUK e rrethon Allahun (epërsi që i përshtatet madhështisë)","Asnjë drejtim fare"],a:2,e:"I poshtmi kot (kundër uluvvit); i larti rrethues kot (Allahu s'rrethohet); i larti jo-rrethues i vërtetë — Allahu mbi krijesat, s'e rrethon asgjë."},
{t:"Arshi",q:"Pse «drejtimi i lartë që e rrethon Allahun» është i kotë?",o:["Sepse Allahu s'është i lartë","Sepse Allahu është më i madh se ta rrethojë diçka prej krijesave të Tij","Sepse drejtimi s'ekziston","Sepse Arshi s'ekziston"],a:1,e:"Rrethimi do të thoshte se krijesa është më e madhe se Krijuesi — e pamundur; Allahu është i lartë pa u rrethuar."},
{t:"Arshi",q:"Arshi, në kuptimin gjuhësor, do të thotë:",o:["Toka","Froni i mbretit (serir el-mulk)","Qielli i shtatë","Reja"],a:1,e:"«El-Arsh» = serir'l-mulk (froni i mbretërisë); Arshi i Er-Rahmanit mbi të cilin u ngjit është froni më i madh që rrethon krijesat."},
{t:"Arshi",q:"Hadithi i Ebu Dherrit tregon raportin mes Kursisë e shtatë qiejve/tokave si:",o:["Të barabartë","Shtatë qiejt e tokat para Kursisë janë si një unazë e hedhur në shkretëtirë","Kursija mbi Arsh","Qiejt më të mëdhenj se Kursija"],a:1,e:"«ما السماوات السبع... عند الكرسي إلا كحلقة ملقاة بأرض فلاة» — e madhështia e Arshit mbi Kursinë si shkretëtira mbi atë unazë."},
{t:"Arshi",q:"Transmetimi i Ibn Abasit për Kursinë është:",o:["«Kursija është vetë Arshi»","«El-Kursijju meudi'u'l-kademejn» (vendi i dy Këmbëve)","«Kursija është dija»","«Kursija është qielli»"],a:1,e:"Ibn Abasi: Kursija është vendi i dy Këmbëve, kurse Arshin s'mund ta masë kush — përmasa të ndryshme."},
{t:"Arshi",q:"Një dijetar ia ktheu Xhehmiut që pyeste për mënyrën e cilësive: «Nëse s'mund ta përshkruash mënyrën e Qenies së Allahut,",o:["atëherë mohoje Qenien»","atëherë as cilësive s'u bën tekjif, sepse cilësia e pason të përshkruarin (es-sifatu tabi'a lil-meusuf)»","atëherë hesht për fenë»","atëherë pyet filozofët»"],a:1,e:"Ashtu si pohon Qenie pa kejf, pohon cilësi pa kejf — sepse njohja e mënyrës së cilësisë degëzohet nga njohja e mënyrës së Qenies."},
{t:"Arshi",q:"El-Kursijju, në kuptimin gjuhësor, nënkupton:",o:["Fronin më të madh (Arshin)","Vendin ku ulesh (ndenjësen)","Qiellin e shtatë","Tokën e parë"],a:1,e:"Gjuhësisht kursi = ajo mbi të cilën ulesh; është më i vogël se Arshi sipas hadithit të Ebu Dherrit."},

/* ——— Meijja (bashkësia) ——— */
{t:"Meijja",q:"Meijja (bashkësia e Allahut me krijesat) ndahet në:",o:["Trupore dhe shpirtërore","Të përgjithshme ('amme) dhe të veçantë (khasse)","Të dukshme dhe të fshehtë","Të madhe dhe të vogël"],a:1,e:"Meijja 'amme (gjithëpërfshirëse) dhe khasse (vetëm për besimtarët e të dërguarit) — asnjëra s'bie ndesh me uluvvin."},
{t:"Meijja",q:"Meijja e PËRGJITHSHME ('amme) nënkupton:",o:["Ndihmën e besimtarëve","Rrethimin e të gjitha krijesave (besimtar e jobesimtar) me dije, fuqi, dëgjim, shikim, sundim e drejtim","Praninë trupore mes krijesave","Vetëm mëshirën"],a:1,e:"Meijja 'amme buron nga rububijjeti: Allahu i rrethon të gjithë me dije e sundim; i kërkon robit murakabe (vetëkontroll)."},
{t:"Meijja",q:"Meijja e VEÇANTË (khasse) dallon nga ajo e përgjithshme sepse:",o:["Nënkupton praninë trupore","Nënkupton ndihmën (nasr) dhe përkrahjen (te'jid) për atë të cilit i përshkruhet","Rrethon të gjithë","Nënkupton dënimin"],a:1,e:"Meijja khasse i jep besimtarit/të dërguarit thebat (qëndrueshmëri); «إِنَّ اللَّهَ مَعَ الَّذِينَ اتَّقَوا»."},
{t:"Meijja",q:"Ndaj cilit grup ajetesh i përket meijja e PËRGJITHSHME ('amme)?",o:["«إِنَّ اللَّهَ مَعَنَا» (në shpellë)","«وَهُوَ مَعَكُمْ أَيْنَ مَا كُنتُمْ» dhe «مَا يَكُونُ مِن نَّجْوَى ثَلَاثَةٍ إِلَّا هُوَ رَابِعُهُمْ»","«إِنَّنِي مَعَكُمَا أَسْمَعُ وَأَرَى»","«إِنَّ اللَّهَ مَعَ الَّذِينَ اتَّقَوا»"],a:1,e:"«Me ju kudo që të jeni» dhe «i katërti i tre vetave» shprehin meijjen 'amme (dije e rrethim), jo ndihmë të posaçme."},
{t:"Meijja",q:"Ajeti «إِنَّ اللَّهَ مَعَنَا» (fjala e Profetit ﷺ Ebu Bekrit në shpellë) dhe «إِنَّنِي مَعَكُمَا أَسْمَعُ وَأَرَى» (Musait e Harunit) janë shembuj të meijjes:",o:["Të përgjithshme","Të veçantë (khasse) — që sjell ndihmë e përkrahje","Trupore","Metaforike"],a:1,e:"Të dyja janë meijje khasse: sjellin nasr e te'jid për të dërguarit e Allahut dhe pasuesit e tyre."},
{t:"Meijja",q:"Pse meijja (bashkësia) e Allahut me krijesat NUK bie ndesh me lartësinë (uluvvin) e Tij mbi Arsh?",o:["Sepse njëra e mohon tjetrën","Sepse meijja shpreh dijen, fuqinë e rrethimin, jo përzierjen trupore — pra bashkëjeton me uluvvin","Sepse Arshi s'ekziston","Sepse meijja është metaforë"],a:1,e:"Meijja e vërtetë bashkohet me uluvvin: Allahu është mbi Arsh e njëkohësisht me ne në dije, fuqi e sundim, pa përzierje."},
{t:"Meijja",q:"Meijja e përgjithshme i kërkon besimtarit ___, kurse ajo e veçantë i jep ___:",o:["frikë nga krijesat / pasuri","murakabe (vetëkontroll) / thebat (qëndrueshmëri)","vetmi / dyshim","heshtje / pushtet"],a:1,e:"Kush beson meijjen 'amme ruan vetëkontrollin; kush beson atë khasse fiton qëndrueshmëri — «لَا تَحْزَنْ إِنَّ اللَّهَ مَعَنَا»."},

/* ——— Çështje të cilësive ——— */
{t:"Çështje",q:"Cilësitë lajmëruese (es-sifatu'l-khaberijje) janë ato që njihen vetëm nga lajmi (teksti); shembuj të tyre janë:",o:["Dija, fuqia, dëgjimi","Fytyra (uexh), dy duart (jedejn), dy sytë ('ajnejn)","Istiuaja, nuzuli, mexhi'i","Mëshira, hidhërimi, dashuria"],a:1,e:"Khaberijjet njihen vetëm nga teksti (uexh, jedejn, ajnejn) e klasifikohen te cilësitë dhatijje."},
{t:"Çështje",q:"Në «لِمَا خَلَقْتُ بِيَدَيَّ», ai që e shtrembëron «dy Duart» në «fuqi» ose «mirësi» ka bërë:",o:["Pohim të drejtë","Tahrif (shtrembërim) të tekstit pa provë","Teukif","Pohim të mënyrës"],a:1,e:"Dora e shtuar te Krijuesi është reale e la'ike bihi; interpretimi i saj si «kudra/ni'me» është tahrif pa dëshmi."},
{t:"Çështje",q:"Pse interpretimi i «dy Duarve» si «fuqi» te ajeti i Iblisit është i pasaktë edhe logjikisht?",o:["Sepse fuqia s'ekziston","Sepse «dy duart» këtu u shtuan ndaj Krijuesit (la'ike bihi) dhe teksti kërkon kuptimin real, jo metaforën pa provë","Sepse Iblisi s'ekziston","Sepse Allahu s'ka fuqi"],a:1,e:"Kur fjala shtohet te Krijuesi merr kuptim që i përshtatet Atij; kërkohet dëshmi për largimin nga dhahiri — e muattili s'e ka."},
{t:"Çështje",q:"Qëndrimi i Ehlu Sunnetit ndaj cilësive veprore (si «يَنزِلُ رَبُّنَا إِلَى السَّمَاءِ الدُّنْيَا») është:",o:["T'i mohojnë si të pamundura","T'i pohojnë ashtu siç erdhën, pa tahrif, ta'til, tekjif e temthil","T'i interpretojnë si zbritje e mëshirës","Të heshtin për kuptimin e tyre"],a:1,e:"Nuzuli është cilësi fi'lijje reale që i përshtatet Allahut; pohohet pa u krahasuar me zbritjen e krijesave e pa u pyetur për kejfin."},
{t:"Çështje",q:"Vullneti (irade) i Allahut ndahet në dy lloje, që janë:",o:["I madh dhe i vogël","Kauni (meshi'eja që realizohet patjetër) dhe sher'ij (që ka kuptimin e dashurisë/pëlqimit)","I dukshëm dhe i fshehtë","Arab dhe joarab"],a:1,e:"Iradeja kaunijje (= meshi'e, ndodh patjetër, përfshin edhe atë që Allahu s'e do) dhe sher'ijje (= mehabbe, s'ndodh domosdo)."},
{t:"Çështje",q:"Dallimi mes iradës kaunijje dhe asaj sher'ijje duket në atë që:",o:["Të dyja realizohen patjetër","Kaunijja realizohet patjetër (edhe te kafiri që Allahu e lejoi), sher'ijja është dashuri që s'realizohet domosdo (si imani i kafirit)","Të dyja janë dashuri","S'ka dallim"],a:1,e:"Allahu «deshi» (kaunen) kufrin e Iblisit duke e lejuar, por s'e «deshi» (sher'an) atë, sepse s'e do kufrin."},
{t:"Çështje",q:"Cilësitë si dashuria (mehabbe), hidhërimi (gadab) dhe kënaqësia (rida) për Allahun janë:",o:["Mohuese","Cilësi reale që i përshtaten Atij, pohohen pa ngjasim","Metaforike (= shpërblim a ndëshkim)","Të krijuara"],a:1,e:"Ehlu Sunneti i pohon mehabben, gadabin e ridanë si cilësi reale la'ika bihi; interpretimi i tyre si «thevab/intikam» është tahrif."},
{t:"Çështje",q:"Shprehja «بِلَا كَيْفَ» (pa mënyrë) që thanë selefi për cilësitë nënkupton:",o:["Mohimin e cilësisë","Pohimin e cilësisë me mohimin e njohjes së mënyrës (kejfijjetit), jo mohimin e mënyrës vetë","Mohimin e kuptimit","Ngjasimin me krijesat"],a:1,e:"«Pa kejf» s'do të thotë se cilësia s'ka kejf, por se ne s'e dimë kejfin — selefi pohuan një kejfijjet të panjohur për ne."},
{t:"Çështje",q:"Kur Imam Ahmedi tha për hadithin e nuzulit «نؤمن به ونصدق به، لا كيف ولا معنى», fjala «معنى» që ai mohoi ishte:",o:["Çdo kuptim i cilësisë","Kuptimi i KOTË i Xhehmijve mohues, jo kuptimi i vërtetë","Kuptimi gjuhësor arab","Kuptimi i selefit"],a:1,e:"Ahmedi mohoi «ma'nanë» batile të Xhehmijve (që e shtrembëronin dhahirin) dhe kejfijjetin — jo kuptimin e vërtetë të tekstit."},

/* ——— Metoda e Ehlu Sunnetit ——— */
{t:"Metoda",q:"Metoda e Ehlu Sunnetit në POHIM (ithbat) është:",o:["Të pohojnë me ngjasim ndaj krijesave","Të pohojnë atë që pohoi Allahu e i Dërguari ﷺ, pa tahrif, ta'til, tekjif e temthil","Të pohojnë vetëm shtatë cilësi","Të interpretojnë çdo cilësi"],a:1,e:"Katër mohimet e Ehlu Sunnetit në pohim: la tahrif, la ta'til, la tekjif, la temthil."},
{t:"Metoda",q:"Metoda e Ehlu Sunnetit në MOHIM (nefj) është:",o:["Të mohojnë gjithçka që s'e kuptojnë","Të mohojnë atë që Allahu e mohoi për Veten, bashkë me pohimin e së kundërtës së përkryer","Të heshtin ndaj mohimeve","Të pohojnë mangësitë"],a:1,e:"Mohimi te Ehlu Sunneti s'është zbrazje: p.sh. mohimi i gjumit ngërthen pohimin e jetës e kajjumijjetit të përkryer."},
{t:"Metoda",q:"Metoda e Ehlu Sunnetit është rruga e mesme (el-kaulu'l-vesat) mes:",o:["Dy medh'hebeve të fikhut","Ehlu te'tilit (mohuesve) dhe ehlu temthilit (ngjasuesve)","Arabëve dhe joarabëve","Sufive dhe fukahave"],a:1,e:"Ehlu Sunneti qëndron mes zbrazjes (ta'til) e ngjasimit (temthil): pohim pa temthil, tenzih pa ta'til."},
{t:"Metoda",q:"Në çështjen e akides, Ehlu Sunneti i kundërshton pikërisht:",o:["Vetëm filozofët","Maturiditë, Esharitë, Mutezilët, Xhehmijtë dhe filozofët gulat","Vetëm çifutët e të krishterët","Katër imamët e medh'hebeve"],a:1,e:"Ehlu Sunneti kundërshton devijuesit në cilësi: Maturiditë, Esharitë, Mutezilët, Xhehmijtë, filozofët gulat — e i pohon cilësitë ashtu siç i takojnë Allahut."},
{t:"Metoda",q:"Shkaku rrënjësor i humbjes së Mumethileve e Muattileve, sipas kësaj metode, ishte:",o:["Padituria e gjuhës arabe","Nisja nga një parim i gabuar (dhahiri = ngjasim) dhe dorëzimi i mendjes mbi tekstin","Varfëria e tyre","Numri i vogël"],a:1,e:"Të dy grupet nisën nga supozimi se dhahiri do të thotë ngjasim; pastaj njëri e pohoi, tjetri e mohoi — gabimi fillestar i njëjtë."},
{t:"Metoda",q:"Pse pohimi i cilësive të Allahut NUK është teshbih?",o:["Sepse cilësitë s'kanë kuptim real","Sepse pohohen në mënyrë që i përshtatet Allahut, nën «لَيْسَ كَمِثْلِهِ شَيْءٌ» — përputhja në emër s'kërkon përputhje në realitet","Sepse janë metaforë","Sepse e thanë dijetarët"],a:1,e:"Dora e njeriut ndryshon nga «dora» e elefantit edhe pse ndajnë emrin; pra ndarja e emrit s'sjell ngjasim në realitet — aq më tepër Krijuesi."},
{t:"Metoda",q:"Përputhja në EMËR mes Krijuesit dhe krijesës (p.sh. «dorë», «dëgjim») tregon se:",o:["Kërkon përputhje edhe në realitet","Nuk kërkon përputhje në realitet e në mënyrë — dallimi Krijues-krijesë është më i madh","Është teshbih i ndaluar","Është metaforë"],a:1,e:"Përputhja në ism s'detyron përputhje në hakika; dallimi mes Krijuesit e krijesës është më i madh e më i qartë se mes vetë krijesave."},

/* ——— Thellim ——— */
{t:"Thellim",q:"Treguesi i mutabekas, tedammunit dhe iltizamit ilustrohet me emrin «El-Halik». Cili pohim është i saktë?",o:["Mutabeka → dija; tedammun → fuqia; iltizam → Qenia","Mutabeka → Qenia+krijimi; tedammun → njëra prej tyre; iltizam → dija e fuqia","Mutabeka → fuqia; iltizam → krijimi","Të tria tregojnë vetëm Qenien"],a:1,e:"El-Halik: mutabeka (Qenia + cilësia e krijimit), tedammun (njëra veç), iltizam (dija e fuqia që i nënkupton krijimi)."},
{t:"Thellim",q:"Pse mohimi i thjeshtë (pa pohim përsosmërie) NUK konsiderohet lavdi?",o:["Sepse është i shkurtër","Sepse mohimi i zhveshur mund të vijë nga paaftësia ose mungesa e vendit — pra edhe mangësi (si «muri s'bën padrejtësi»)","Sepse s'ka kuptim","Sepse është arabisht"],a:1,e:"Mohimi bëhet kemal vetëm kur ngërthen pohimin e së kundërtës; ndryshe mund të jetë thjesht mungesë (paaftësi), pra naks."},
{t:"Thellim",q:"«وَتَوَكَّلْ عَلَى الْحَيِّ الَّذِي لَا يَمُوتُ» ilustron rregullin se mohimi i vdekjes:",o:["Është thjesht mohim","Ngërthen pohimin e përsosmërisë së jetës së Allahut","Tregon mangësi","E krahason me krijesat"],a:1,e:"Mohimi i vdekjes synon pohimin e jetës së përkryer e të përhershme — jo thjesht mungesën e vdekjes."},
{t:"Thellim",q:"Esharitë dhe Maturiditë, në çështjen e cilësive, klasifikohen te:",o:["Ehlu Sunneti i plotë","Muattilet (mohues të pjesshëm — ta'til xhuz'i)","Mushebbihet","Selefi"],a:1,e:"Ata pohojnë shtatë cilësi e mohojnë pjesën tjetër; pra bëjnë ta'til xhuz'i — grupi i parë i Muattileve te Tedmurija."},
{t:"Thellim",q:"Mutezilët, që pohojnë vetëm emrat duke mohuar cilësitë, klasifikohen si:",o:["Mushebbihe","Muattile të emrave nga kuptimet (ta'til i cilësive)","Ehlu Sunnet","Selef"],a:1,e:"Mutezilët pohojnë emra pa cilësi («Alim bila ilm») — pra i zbrazin emrat nga cilësitë, lloj i ta'tilit."},
{t:"Thellim",q:"Fakti që Kurani zbriti në gjuhë arabe të qartë provon se tekstet e cilësive:",o:["S'kanë kuptim","Kanë kuptim të njohur që duhet marrë sipas dhahirit arab, veç kur ndalon një provë sheriatike","Janë metaforë","Janë të fshehta nga të gjithë"],a:1,e:"Gjuha e qartë kërkon kuptimin e dhahirit; largimi prej tij lejohet vetëm me dëshmi sher'ije, që te cilësitë nuk ka."},
{t:"Thellim",q:"«لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ» — mohimi i kotjes e gjumit ngërthen:",o:["Mangësi","Pohimin e përsosmërisë së jetës e të vazhdimësisë (kajjumijjetit) së Allahut","Krahasim me krijesat","Mohim të jetës"],a:1,e:"Mohimi i gjumit s'është zbrazje, por pohim i hajat-it e kajjumijjet-it të përkryer — Ai e mban çdo gjë e s'e kap kotja."},
{t:"Thellim",q:"Si pajtohet cilësia e istiuasë mbi Arsh me të qenit e Allahut «fi's-sema» (në qiell)?",o:["Janë të kundërta e përjashtohen","Të dyja tregojnë lartësinë e Allahut mbi krijesat; «fi's-sema» = mbi qiell (uluvv)","E para e mohon të dytën","S'kanë lidhje"],a:1,e:"«Fi's-sema» nënkupton «ala's-sema» (mbi qiell); bashkë me istiuanë dëshmojnë uluvvu'dh-dhat — jo rrethim nga qielli."},
{t:"Thellim",q:"Mohimi i «tekjifit» për cilësitë NUK nënkupton mohimin e:",o:["Mënyrës (kejfijjetit)","Kuptimit dhe realitetit të cilësisë","Njohjes së kejfit","Pyetjes për mënyrën"],a:1,e:"Mohojmë njohjen e kejfit, jo vetë cilësinë; cilësia është reale me kuptim të njohur, por mënyra mbetet e panjohur."},
{t:"Thellim",q:"Thënia që tregon epërsinë e rrugës së Kuranit mbi kelamin e filozofinë («ما رأيتها تشفي عليلاً... وأقرب الطرق طريقة القرآن») i atribuohet:",o:["Imam Malikut","Fakhrud-Din er-Razit (në fund të jetës)","Ibn Abasit","Imam Ahmedit"],a:1,e:"Rrëfimi i Razit, prototip i mutekel-limit, që pranoi kotësinë e rrugëve racionale dhe epërsinë e rrugës së Kuranit — pra të selefit."},
{t:"Thellim",q:"«Tefsiri» që mohoi Muhammed ibn El-Hasen (kur tha se fukahaja pajtohen në iman pa «tefsir, teshbih») i referohej:",o:["Çdo tefsiri të lejuar","Tefsirit të Xhehmijve mohues që shpikën interpretimin, kundër asaj që ishin sahabët e tabi'inët","Tefsirit gjuhësor","Tefsirit të Ibn Abasit"],a:1,e:"Ashtu si te Ahmedi, «tefsiri» i mohuar është interpretimi i Xhehmijve muattile — jo pohimi i kuptimeve të vërteta nga selefi."},
{t:"Thellim",q:"Ata që pretenduan se «s'ka dallim mes medh'hebit të selefit dhe të interpretuesve (mu'avvile)» bënë:",o:["Thanë të vërtetën","Lubsu'l-hakk bil-batil (ngatërrim të së vërtetës me të kotën) — gënjeshtër ndaj selefit","U pajtuan me selefin","Pohuan cilësitë"],a:1,e:"Kjo është gënjeshtër: asnjë prej selefit s'e mohoi treguesin e teksteve mbi cilësitë; mu'avviletja ishin kundërshtarë të tyre."},
{t:"Thellim",q:"Fakti që interpretuesit (mu'avvile) i akuzonin selefin për teshbih e texhsim provon se:",o:["Selefi vërtet bënin teshbih","Selefi i POHONin cilësitë (përndryshe s'do akuzoheshin për teshbih)","Selefi heshtnin për cilësitë","S'kishte dallim mes dy palëve"],a:1,e:"Akuza për teshbih do të kishte kuptim vetëm nëse selefi pohonin cilësi; pra ata s'ishin tefuidxhinj të kuptimit, por pohues."},
{t:"Thellim",q:"Dëshmia e fitres për lartësinë e Allahut shfaqet qartë kur njeriu në fatkeqësi:",o:["Shikon drejt tokës","E ngre zemrën e duart lart drejt Allahut, pa e mësuar nga askush","E mohon Zotin","Pyet filozofët"],a:1,e:"Çdo lutës, arab e joarab, kur i bie fatkeqësia e ngre zemrën lart — dëshmi e fitres së pandryshuar për uluvvin."},
{t:"Thellim",q:"«أَفَمَن يَخْلُقُ كَمَن لَّا يَخْلُقُ» dhe «هَلْ تَعْلَمُ لَهُ سَمِيًّا» përdoren si prova për:",o:["Mohimin e cilësive","Mohimin e temthilit — Krijuesi s'është si krijesa, s'ka të ngjashëm","Pohimin e ngjasimit","Tekjifin"],a:1,e:"Të dy ajetet rrëzojnë temthilin: Krijuesi ndryshon rrënjësisht nga krijesa dhe s'ka «semijj» (të ngjashëm)."},
{t:"Thellim",q:"Dallimi Krijues-krijesë, sipas mendjes, krahasuar me dallimin mes vetë krijesave, është:",o:["Më i vogël","Më i madh e më i qartë — prandaj ngjasimi me Krijuesin është edhe më i pamundur","I barabartë","Jo i vërtetë"],a:1,e:"Nëse dora e njeriut s'i ngjan «dorës» së elefantit megjithë emrin e njëjtë, aq më tepër s'i ngjan Dora e Krijuesit duarve të krijesave."},
{t:"Thellim",q:"Pse cilësitë e Allahut s'i nënshtrohen mendjes së pavarur (re'jit)?",o:["Sepse mendja është gjithmonë e pavlerë","Sepse janë çështje gajbi që i njeh vetëm shpallja; detajimi i tyre merret vetëm nga sem'i","Sepse arabishtja është e vështirë","Sepse janë të panevojshme"],a:1,e:"Detajimi i asaj që është e detyrueshme, e pamundur a e mundur për Allahun kapet vetëm nga teksti — jo nga mendja e pavarur."},
{t:"Thellim",q:"Ixhmaja e Ehlu Sunnetit, siç e transmeton Ibn Abdil-Berr, mbi cilësitë e ardhura në Kuran e Sunnet është:",o:["Interpretimi i tyre","Pohimi, besimi dhe mbajtja e tyre në realitet (jo mexhaz), pa tekjif e pa kufizim numri","Mohimi i tyre","Dorëzimi i kuptimit Allahut"],a:1,e:"«أهل السنة مجمعون على الإقرار بالصفات... وحملها على الحقيقة لا على المجاز، إلا أنهم لا يكيفون» — ixhma e Ehlu Sunnetit."},
