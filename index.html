<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
html,body{margin:0;padding:0}
:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Kuiz: Emrat dhe Cilësitë</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Noto+Sans:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap">
<style>
/* Layout: single reading column; three screens (start / kuiz / rezultate). Palette: smerald + ar on ngjyrë letre e ngrohtë. */
:root{
  --bg:#f3f1e9; --surface:#fffdf7; --surface-2:#f7f4ea;
  --fg:#23312b; --muted:#6a776f; --border:#e4ddcc;
  --accent:#0e6b52; --accent-ink:#0b5944; --accent-soft:#dcebe2;
  --gold:#b0842c;
  --correct:#0d7a4d; --correct-bg:#def1e5; --correct-bd:#9ad3b4;
  --wrong:#be392b; --wrong-bg:#fbe5e0; --wrong-bd:#eeb6ab;
  --idle:#ece7da; --idle-fg:#8a897c;
  --shadow:0 1px 2px rgba(20,40,32,.05),0 6px 20px rgba(20,40,32,.07);
  --maxw:50rem;
  --font-display:"Marcellus",Georgia,serif;
  --font-body:"Noto Sans","Amiri","Segoe UI",system-ui,sans-serif;
  --font-ar:"Amiri",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11161b; --surface:#19211d; --surface-2:#202823;
  --fg:#e9ede9; --muted:#9db0a6; --border:#2d3a33;
  --accent:#43b78c; --accent-ink:#5ac79c; --accent-soft:#1c342b;
  --gold:#d6b25e;
  --correct:#54c48d; --correct-bg:#15362666; --correct-bd:#2f6a4e;
  --wrong:#e67f70; --wrong-bg:#3d201b66; --wrong-bd:#7a3a31;
  --idle:#232c27; --idle-fg:#7f8d84;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 22px rgba(0,0,0,.35);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#11161b; --surface:#19211d; --surface-2:#202823;
  --fg:#e9ede9; --muted:#9db0a6; --border:#2d3a33;
  --accent:#43b78c; --accent-ink:#5ac79c; --accent-soft:#1c342b;
  --gold:#d6b25e;
  --correct:#54c48d; --correct-bg:#153626; --correct-bd:#2f6a4e;
  --wrong:#e67f70; --wrong-bg:#3d201b; --wrong-bd:#7a3a31;
  --idle:#232c27; --idle-fg:#7f8d84;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 22px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);line-height:1.5;
  -webkit-font-smoothing:antialiased;font-size:16px}
.wrap{max-width:var(--maxw);margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:24px 56px}
.ar{font-family:var(--font-ar);font-size:1.15em;line-height:1.9}
h1,h2,h3{font-family:var(--font-display);font-weight:400;text-wrap:balance;margin:0}
.muted{color:var(--muted)}
button{font-family:inherit;cursor:pointer}

/* ---------- Start screen ---------- */
.hero{background:var(--surface);border:1px solid var(--border);border-radius:18px;
  box-shadow:var(--shadow);overflow:hidden}
.hero-top{padding:30px 26px 22px;background:
  radial-gradient(120% 120% at 100% 0,var(--accent-soft) 0,transparent 60%);
  border-bottom:1px solid var(--border)}
.eyebrow{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:700}
.hero h1{font-size:clamp(1.8rem,5vw,2.6rem);margin:.4rem 0 .3rem;color:var(--accent-ink)}
.hero-sub{color:var(--muted);font-size:1.02rem;max-width:40ch}
.creed{margin:22px 26px;padding:18px 20px;border-radius:14px;background:var(--surface-2);
  border:1px solid var(--border);border-left:4px solid var(--accent)}
.creed .lbl{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:6px}
.creed p{margin:0;font-size:1.06rem;line-height:1.65}
.meta-row{display:flex;flex-wrap:wrap;gap:12px;margin:0 26px 8px}
.stat{flex:1 1 7rem;min-width:0;background:var(--surface-2);border:1px solid var(--border);
  border-radius:12px;padding:12px 14px}
.stat b{font-family:var(--font-display);font-size:1.5rem;color:var(--accent-ink);display:block;line-height:1.1}
.stat span{font-size:.82rem;color:var(--muted)}
.rules{margin:16px 26px 8px;padding:0;list-style:none;display:grid;gap:9px}
.rules li{display:flex;gap:10px;align-items:flex-start;font-size:.95rem;color:var(--fg)}
.rules li::before{content:"";flex:0 0 7px;height:7px;border-radius:50%;background:var(--accent);margin-top:8px}
.actions{padding:20px 26px 28px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.btn{border:1px solid transparent;border-radius:11px;padding:13px 22px;font-size:1rem;font-weight:600;
  background:var(--accent);color:#fff;transition:filter .15s,transform .05s}
.btn:hover{filter:brightness(1.06)} .btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--accent-ink);border-color:var(--border)}
.btn.ghost:hover{background:var(--surface-2);filter:none}
.btn.sm{padding:9px 15px;font-size:.9rem;border-radius:9px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.books{margin:4px 26px 0;font-size:.82rem;color:var(--muted);line-height:1.7}
.books b{color:var(--fg);font-weight:600}

/* ---------- Top bar (quiz) ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--border);margin-bottom:22px}
.topbar-in{max-width:var(--maxw);margin:0 auto;display:flex;align-items:center;gap:12px;
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.counter{font-family:var(--font-display);font-size:1.05rem;white-space:nowrap}
.counter small{color:var(--muted);font-size:.8em}
.progress{flex:1 1 auto;min-width:0;height:8px;border-radius:99px;background:var(--idle);overflow:hidden}
.progress>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--gold));transition:width .25s}
.iconbtn{border:1px solid var(--border);background:var(--surface);color:var(--fg);border-radius:9px;
  padding:7px 11px;font-size:.85rem;font-weight:600}

/* ---------- Question card ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);
  padding:24px 22px}
.qtag{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px}
.qtext{font-size:1.22rem;line-height:1.5;margin:0 0 20px;font-weight:500}
.opts{display:grid;gap:11px}
.opt{display:flex;gap:13px;align-items:flex-start;text-align:start;width:100%;
  background:var(--surface-2);border:1.5px solid var(--border);border-radius:12px;padding:14px 15px;
  font-size:1.02rem;color:var(--fg);transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--accent)}
.opt .key{flex:0 0 1.6rem;height:1.6rem;border-radius:50%;background:var(--surface);border:1.5px solid var(--border);
  display:grid;place-items:center;font-weight:700;font-size:.9rem;color:var(--muted);font-family:var(--font-display)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .key{background:var(--accent);border-color:var(--accent);color:#fff}
.opt .txt{min-width:0;padding-top:1px}
.navbtns{display:flex;gap:11px;margin-top:20px;align-items:center;flex-wrap:wrap}
.spacer{flex:1 1 auto}

/* ---------- Jump navigator ---------- */
.jump{margin-top:18px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px}
.jump h3{font-size:.95rem;margin-bottom:12px;color:var(--muted);letter-spacing:.04em}
.grid-n{display:grid;grid-template-columns:repeat(auto-fill,minmax(2.2rem,1fr));gap:7px}
.cell{aspect-ratio:1;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);
  color:var(--muted);font-weight:600;font-size:.82rem;font-variant-numeric:tabular-nums;
  display:grid;place-items:center;transition:transform .05s}
.cell:hover{transform:translateY(-1px)}
.cell.answered{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent)}
.cell.current{outline:2px solid var(--gold);outline-offset:1px}
.cell.correct{background:var(--correct-bg);color:var(--correct);border-color:var(--correct-bd)}
.cell.wrong{background:var(--wrong-bg);color:var(--wrong);border-color:var(--wrong-bd)}
.cell.blank{background:var(--idle);color:var(--idle-fg)}

/* ---------- Results ---------- */
.score{background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);
  padding:26px;text-align:center;margin-bottom:18px;background-image:
  radial-gradient(130% 120% at 50% -10%,var(--accent-soft) 0,transparent 55%)}
.score .big{font-family:var(--font-display);font-size:clamp(2.6rem,10vw,4rem);line-height:1;color:var(--accent-ink)}
.score .pct{font-size:1.1rem;color:var(--muted);margin-top:6px}
.score .tags{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:16px}
.pill{border-radius:99px;padding:7px 14px;font-size:.88rem;font-weight:600;border:1px solid var(--border)}
.pill.ok{background:var(--correct-bg);color:var(--correct);border-color:var(--correct-bd)}
.pill.no{background:var(--wrong-bg);color:var(--wrong);border-color:var(--wrong-bd)}
.pill.sk{background:var(--idle);color:var(--idle-fg)}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin:4px 2px 14px;font-size:.84rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.dot{width:13px;height:13px;border-radius:4px;border:1px solid var(--border)}
.dot.c{background:var(--correct-bg);border-color:var(--correct-bd)}
.dot.w{background:var(--wrong-bg);border-color:var(--wrong-bd)}
.dot.b{background:var(--idle)}

/* review panel */
.review{margin-top:18px;display:grid;gap:14px}
.rev-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 17px;scroll-margin-top:72px}
.rev-head{display:flex;gap:10px;align-items:baseline;margin-bottom:4px}
.rev-num{font-family:var(--font-display);font-size:1.05rem;color:var(--accent-ink)}
.rev-badge{font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:99px;text-transform:uppercase;letter-spacing:.06em}
.rev-badge.ok{background:var(--correct-bg);color:var(--correct)}
.rev-badge.no{background:var(--wrong-bg);color:var(--wrong)}
.rev-badge.sk{background:var(--idle);color:var(--idle-fg)}
.rev-q{font-weight:500;font-size:1.08rem;margin:6px 0 13px;line-height:1.45}
.rev-opts{display:grid;gap:8px}
.rev-opt{display:flex;gap:11px;align-items:flex-start;border:1.5px solid var(--border);border-radius:10px;
  padding:11px 13px;font-size:.98rem;background:var(--surface-2)}
.rev-opt .key{flex:0 0 1.5rem;height:1.5rem;border-radius:50%;display:grid;place-items:center;
  font-weight:700;font-size:.85rem;font-family:var(--font-display);border:1.5px solid var(--border);background:var(--surface);color:var(--muted)}
.rev-opt.c{background:var(--correct-bg);border-color:var(--correct-bd);color:var(--correct)}
.rev-opt.c .key{background:var(--correct);border-color:var(--correct);color:#fff}
.rev-opt.w{background:var(--wrong-bg);border-color:var(--wrong-bd);color:var(--wrong)}
.rev-opt.w .key{background:var(--wrong);border-color:var(--wrong);color:#fff}
.rev-opt .mark{margin-inline-start:auto;font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;align-self:center}
.filterbar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 2px}
.chip{border:1px solid var(--border);background:var(--surface);color:var(--fg);border-radius:99px;
  padding:7px 14px;font-size:.86rem;font-weight:600}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.foot{margin-top:28px;text-align:center;color:var(--muted);font-size:.82rem;line-height:1.7}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
/* buton sqarimi + popup */
.hintbtn{margin-top:14px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--gold)}
.modal-bk{position:fixed;inset:0;z-index:40;background:rgba(10,22,17,.55);
  display:flex;align-items:flex-end;justify-content:center;padding:0;animation:fade .15s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media(min-width:560px){.modal-bk{align-items:center;padding:20px}}
.modal{background:var(--surface);border:1px solid var(--border);width:100%;max-width:34rem;
  border-radius:18px 18px 0 0;box-shadow:0 -8px 40px rgba(0,0,0,.35);
  padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));max-height:86vh;overflow:auto}
@media(min-width:560px){.modal{border-radius:18px}}
.modal .mtag{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:8px}
.modal .mq{font-weight:500;font-size:1.1rem;margin:0 0 15px;line-height:1.45}
.modal .ans{display:flex;gap:11px;align-items:flex-start;background:var(--correct-bg);
  border:1.5px solid var(--correct-bd);border-radius:12px;padding:13px 14px;color:var(--correct)}
.modal .ans .key{flex:0 0 1.6rem;height:1.6rem;border-radius:50%;background:var(--correct);color:#fff;
  display:grid;place-items:center;font-weight:700;font-family:var(--font-display)}
.modal .ans .atx{min-width:0;padding-top:1px;font-weight:600}
.modal .why{margin-top:14px;padding:13px 15px;background:var(--surface-2);border:1px solid var(--border);
  border-left:4px solid var(--gold);border-radius:10px;font-size:.98rem;line-height:1.55}
.modal .why b{color:var(--gold);display:block;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;margin-bottom:5px}
.modal .closeRow{display:flex;justify-content:flex-end;margin-top:18px}
.rev-why{margin-top:12px;padding:11px 14px;background:var(--surface-2);border:1px solid var(--border);
  border-left:4px solid var(--gold);border-radius:9px;font-size:.92rem;line-height:1.5}
.rev-why b{color:var(--gold);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;margin-inline-end:6px}
@media (max-width:420px){
  .creed,.meta-row,.rules,.actions,.books{margin-left:18px;margin-right:18px}
  .card{padding:20px 16px}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================ TË DHËNAT: 200 PYETJE ============================ */
/* Burimet: 1) Takribut-Tedmurijje (f.21-46) 2) El-Kavaidul-Muthla – Ibn Uthejmin
             3) Fet'hu Rabbil-Berijje bi telkhisil-Hamauijje – Ibn Uthejmin.
   a = indeksi i përgjigjes së saktë (në renditjen e shkruar).                       */
const QUESTIONS = [
/* ——— Hyrje & rëndësia ——— */
{t:"Hyrje",q:"Teuhidi i emrave dhe cilësive, në ndarjen e njohur, është:",o:["Lloji i tretë, krahas rububijjetit e uluhijjetit","Një degë brenda teuhidit të rububijjetit","Një degë brenda teuhidit të uluhijjetit","Kushti paraprak i dy llojeve të tjera"],a:0,e:"Teuhidi ndahet në tri lloje të pandashme por të dallueshme: rububijjet, uluhijjet, dhe asma ue sifat — ky i fundit është i treti."},
{t:"Hyrje",q:"Besimi në Allahun ngërthen katër çështje: ekzistencën, rububijjetin, uluhijjetin, dhe:",o:["Pohimin e emrave e cilësive që Ai i vërtetoi për Veten","Mohimin e çdo cilësie nga Qenia e Tij","Dorëzimin e kuptimit të cilësive tek Allahu","Barazimin e cilësive të Tij me ato të krijesave"],a:0,e:"Çështja e katërt është pikërisht teuhidi i asma ue sifat: pohimi i tyre ashtu siç i takojnë Allahut."},
{t:"Hyrje",q:"«وَلِلَّهِ الْأَسْمَاءُ الْحُسْنَى فَادْعُوهُ بِهَا» — lutja (du'a) këtu ngërthen:",o:["Vetëm lutjen e kërkesës (mes'ele)","Vetëm lutjen e adhurimit (ibade)","Si lutjen e kërkesës ashtu edhe atë të adhurimit","Vetëm përmendjen (dhikrin) me gjuhë"],a:2,e:"«Du'a» në ajet përfshin mes'elen (t'i kërkosh me emër të përshtatshëm) dhe ibaden (ta adhurosh sipas kuptimit të emrit)."},
{t:"Hyrje",q:"Dallimi mes du'au-l mes'ele dhe du'au-l ibade me emrat e Allahut është:",o:["E para i paraqet kërkesës një emër të përshtatshëm; e dyta e adhuron Allahun sipas kuptimit të emrit","E para bëhet fshehurazi; e dyta haptazi","E para me gjuhë; e dyta me zemër","E para për dynja; e dyta për ahiret"],a:0,e:"Mes'ele: «Ja Rahim, më mëshiro». Ibade: të pendohesh ngaqë Ai është Et-Teuuab, ta frikësohesh ngaqë është El-Habir."},
{t:"Hyrje",q:"Pse njohja e emrave e cilësive është kusht i adhurimit të plotë?",o:["Sepse pa të adhurimi s'bëhet me vetëdije (besira) e me dashuri e frikë të vërtetë","Sepse e shumëfishon shpërblimin e sadakasë","Sepse është kusht i vlefshmërisë së abdesit","Sepse e lehtëson jetesën në dynja"],a:0,e:"Robi s'mund ta adhurojë Allahun në formën më të plotë pa e njohur Atë; njohja prodhon basiranë, dashurinë e frikën."},
{t:"Hyrje",q:"Lutja e adhurimit me emrin «Et-Teuuab» realizohet kur robi:",o:["Pendohet (bën teube) ngaqë e di se Ai e pranon pendimin","Ia përmend emrin 99 herë në ditë","E lut vetëm për begati materiale","E mëson emrin përmendsh pa vepër"],a:0,e:"Du'au-l ibade: ta adhurosh Allahun sipas përmbajtjes së emrit — teube ngaqë Ai është Et-Teuuab."},
{t:"Hyrje",q:"Rregulli i artë i Ehlu Sunnetit për emrat e cilësitë është:",o:["Pohim pa temthil, tenzih pa ta'til","Mohim i kuptimit, dorëzim i tij tek Allahu","Pohim i kuptimit sipas gjasës me krijesat","Ndalje te lafzi pa asnjë kuptim"],a:0,e:"Ehlu Sunneti pohon pa ngjasim (kundër Mumethilëve) e tenzihon pa zbrazje (kundër Muattilëve): «لَيْسَ كَمِثْلِهِ شَيْءٌ وَهُوَ السَّمِيعُ الْبَصِيرُ»."},
{t:"Hyrje",q:"Cila NUK bën pjesë në besimin e drejtë ndaj Allahut?",o:["Besimi në pavarësinë e Tij absolute (El-Ganijj)","Besimi në rububijjetin dhe uluhijjetin e Tij","Besimi se Ai ka nevojë për krijesat e Tij","Besimi në emrat dhe cilësitë e Tij"],a:2,e:"Nevoja është mangësi; Allahu është El-Ganijj — krijesat kanë nevojë për Të, jo e kundërta."},

/* ——— Rregullat e EMRAVE ——— */
{t:"Emrat",q:"«Emrat e Allahut janë të gjithë husna» nënkupton se secili prej tyre:",o:["Ngërthen kuptim të përsosur, pa asnjë mangësi në asnjë aspekt","Është etiketë dalluese pa përmbajtje kuptimore","Tregon vetëm Qenien, pa cilësi","Është i kufizuar në kuptim e në numër"],a:0,e:"«Husna» = kulmi i bukurisë, ngaqë secili ngërthen cilësi të plotë kemal-i, pa naks real a të supozuar."},
{t:"Emrat",q:"Emri «El-Hajj» është husna sepse ngërthen jetën që:",o:["Nuk i paraprin mosekzistencë, s'e pason zhdukje, e kërkon çdo përsosmëri","Fillon pas mosqenies e vazhdon përjetë","I ngjan jetës së krijesave në përmbajtje","Është cilësi e krijuar në kohë"],a:0,e:"El-Hajj ngërthen jetën e përkryer që sjell domosdoshmërisht dije, fuqi, dëgjim e shikim të përsosura."},
{t:"Emrat",q:"Çiftimi «El-Azizu'l-Hakim» shfaq bukuri shtesë sepse:",o:["Izzeti (forca) shoqërohet me urtësi, ndryshe nga forca e padrejtë e krijesave","Dy emra kanë tingull më të bukur se një","Njëri emër e kufizon kuptimin e tjetrit","Bashkimi i kthen emrat në sinonime"],a:0,e:"Bukuria shfaqet edhe në bashkim: izzeti i Allahut nuk është forcë e verbër, por i shoqëruar me hikme."},
{t:"Emrat",q:"Pohimi «emrat janë a'lam ue ausaf» do të thotë se ata:",o:["Tregojnë Qenien (si emra) dhe bartin kuptime (si cilësi)","Janë vetëm emra pa kuptime të veçanta","Janë vetëm cilësi që s'e tregojnë Qenien","Ndryshojnë kuptimin sipas kohës"],a:0,e:"Si a'lam tregojnë një të emërtuar (Allahun) → sinonimë; si ausaf bartin kuptime të veçanta → të ndryshëm."},
{t:"Emrat",q:"Në cilin aspekt emrat e Allahut janë sinonimë (muteradife), e në cilin të ndryshëm (mutebajine)?",o:["Sinonimë në tregimin e Qenies; të ndryshëm në kuptimet që bartin","Sinonimë në kuptim; të ndryshëm në Qenie","Sinonimë në shqiptim; të ndryshëm në numër","Të dyja në të njëjtin aspekt njëherësh"],a:0,e:"Nga tregimi i një të emërtuari (Allahut) janë muteradife; nga kuptimet e veçanta (El-Alim ≠ El-Kadir) janë mutebajine."},
{t:"Emrat",q:"Pohimi «Allahu është Semi' pa dëgjim, Basir pa shikim» është metodë e:",o:["Mohuesve që i zbrazin emrat prej cilësive (ehlu te'tilit)","Ehlu Sunnetit që pohon emrin bashkë me cilësinë","Mushebbihëve që ngjasojnë cilësitë e Allahut","Selefit që ndalet te lafzi i emrit"],a:0,e:"Zbrazja e emrit nga cilësia që bart është ta'til (metodë e Mutezilëve); Ehlu Sunneti pohon emrin me cilësinë e tij."},
{t:"Emrat",q:"Pse «Ed-Dehr» (koha) nuk llogaritet prej emrave të Allahut?",o:["Sepse është emër i ngrirë (xhamid), pa kuptim lavdie, dhe është emër i kohës","Sepse s'përmendet fare në Kuran e Sunnet","Sepse ka kuptim mohues në gjuhë","Sepse e refuzojnë Mutezilët"],a:0,e:"Emri duhet të bartë kuptim kemal-i që e bashkon me el-husna; «Ed-Dehr» është emër i kohës, jamid — ndaj jo emër i Allahut."},
{t:"Emrat",q:"Hadithi «أنا الدهر» kuptohet me fjalinë vijuese «بيدي الأمر أقلب الليل والنهار», që tregon:",o:["Se Allahu e drejton kohën — s'është vetë koha","Se koha është vetë Allahu","Se dehri ka vullnet të pavarur","Se koha është krijesa më e lartë"],a:0,e:"Kuptimi: «Në Dorën Time është çështja, e ndërroj natën e ditën» — Allahu e sundon kohën, s'është koha."},
{t:"Emrat",q:"Emri që tregon cilësi kalimtare (si «Es-Semi'») ngërthen tri çështje; cilat?",o:["Pohimin e emrit, të cilësisë (dëgjimit), dhe të gjykimit/efektit","Pohimin e emrit, të Qenies, dhe të mënyrës","Pohimin e cilësisë, të numrit, dhe të kohës","Pohimin e emrit dhe mohimin e cilësisë e të efektit"],a:0,e:"Es-Semi' ngërthen: emrin, cilësinë e dëgjimit, dhe efektin — që Ai dëgjon («يَسْمَعُ تَحَاوُرَكُمَا»)."},
{t:"Emrat",q:"Emri që tregon cilësi JOkalimtare (si «El-Hajj») ngërthen:",o:["Dy çështje: pohimin e emrit dhe pohimin e cilësisë","Tri çështje: emrin, cilësinë, dhe gjykimin","Vetëm pohimin e emrit pa cilësi","Katër çështje përfshi mënyrën"],a:0,e:"Cilësia jokalimtare s'ka objekt, prandaj mungon gjykimi kalimtar: El-Hajj → emri + cilësia e jetës."},
{t:"Emrat",q:"Emri «El-Halik» e tregon Qenien e Allahut dhe cilësinë e krijimit SË BASHKU me treguesin e:",o:["Mutabekas (përputhjes së plotë)","Tedammunit (përfshirjes së një pjese)","Iltizamit (domosdoshmërisë jashtë kuptimit)","Kijasit (analogjisë racionale)"],a:0,e:"Mutabeka = fjala tregon tërë kuptimin e saj; El-Halik → Qenia + cilësia e krijimit së bashku."},
{t:"Emrat",q:"Emri «El-Halik» i tregon diturinë dhe fuqinë e Allahut me treguesin e:",o:["Iltizamit (domosdoshmërisë)","Mutabekas (përputhjes)","Tedammunit (përfshirjes)","Mohimit (nefjit)"],a:0,e:"Krijimi kërkon domosdoshmërisht dije e fuqi; pra El-Halik i tregon ato me iltizam — jashtë kuptimit të drejtpërdrejtë."},
{t:"Emrat",q:"«Emrat e Allahut janë teukifijje» përjashton:",o:["Çdo shtim a pakësim me mendje a kijas","Marrjen e tyre nga Kurani e Sunneti","Lutjen me ta e besimin në kuptimet e tyre","Ruajtjen e tyre në shprehje"],a:0,e:"Teukifijje = kufizohen në atë që solli teksti; mendja s'ka kompetencë të shpikë a të heqë emra."},
{t:"Emrat",q:"Pse mendja nuk ka autoritet të shpikë emra për Allahun?",o:["Sepse emërtimi pa teukif është «القول على الله بلا علم», e mendja s'e kap atë që i takon Atij","Sepse gjuha arabe është e vështirë","Sepse emrat janë të fshehtë nga të gjithë","Sepse Profeti e ndaloi menduarit"],a:0,e:"Emërtimi i Allahut pa dëshmi është shpifje ndaj Tij; prandaj emrat merren vetëm me teukif."},
{t:"Emrat",q:"Pse hadithi «إن لله تسعة وتسعين اسمًا... من أحصاها دخل الجنة» NUK e kufizon numrin e emrave?",o:["Sepse formulimi s'është «emrat e Allahut janë 99», por «ka 99, kush i numëron hyn në Xhennet»","Sepse hadithi është i dobët në zinxhir","Sepse numri 99 është simbolik, jo real","Sepse emrat janë saktësisht njëqind"],a:0,e:"«Ka 99 emra, kush i numëron...» s'e përjashton ekzistencën e emrave të tjerë — ndryshe nga «emrat janë 99»."},
{t:"Emrat",q:"Prova më e fortë se emrat e Allahut s'janë të kufizuar me numër është:",o:["Fjala e lutjes «...أو استأثرت به في علم الغيب عندك» — emra që Allahu i mbajti në dijen e fshehtë","Ndryshimi i listës nga një dijetar te tjetri","Numri i madh i emrave në Kuran","Mendimi i shumicës së Mutezilëve"],a:0,e:"Ka emra që Allahu i veçoi në dijen e fshehtë, të panumërueshëm për ne — pra emrat s'janë të kufizuar në 99."},
{t:"Emrat",q:"Çfarë statusi ka hadithi që PËRCAKTON 99 emrat në listë të caktuar (transmetimi me renditjen)?",o:["I dobët (da'if); përcaktimi s'është fjalë e Profetit sipas dijetarëve të hadithit","Mutevatir, i transmetuar nga shumë sahabë","Muttefekun alejhi (Buhari e Muslim)","Kudsij me zinxhir të vërtetë"],a:0,e:"Numri 99 është në Buhari e Muslim, por LISTA e renditur vjen me zinxhir të dobët; përcaktimi s'i atribuohet Profetit."},
{t:"Emrat",q:"«El-Ihsa» i emrave (që shpie në Xhennet), në kuptimin më të plotë, është:",o:["Ruajtja në shprehje, kuptimi i domethënies, dhe adhurimi i Allahut me to","Numërimi i tyre një nga një me gishta","Shkrimi i tyre në një listë","Përsëritja e tyre çdo mëngjes e mbrëmje"],a:0,e:"Ihsa ngërthen tri shkallë: t'i ruash, t'i kuptosh, dhe ta adhurosh Allahun sipas përmbajtjes së tyre."},
{t:"Emrat",q:"Ilhadi (shmangia) në emrat e Allahut përkufizohet si:",o:["Animi me ta nga e vërteta e detyrueshme rreth tyre","Ruajtja e tyre në shprehje dhe kuptim","Lutja me ta në çdo rast","Pohimi i kuptimeve të tyre reale"],a:0,e:"Ilhad = «el-mejl» (anim); në emra = shmangie prej asaj që është detyrë ndaj tyre."},
{t:"Emrat",q:"Emërtimi i Allahut «Baba» nga të krishterët dhe «shkaku vepërues» nga filozofët është ilhad i llojit:",o:["Emërtim i Tij me çka s'e ka emërtuar Veten","Mohim i emrave dhe i cilësive që ata tregojnë","Nxjerrje emrash idhujsh nga emrat e Tij","Ngjasim i cilësive me ato të krijesave"],a:0,e:"Ky lloj ilhadi është emërtimi pa teukif: «el-Eb» te të krishterët, «el-illetu'l-fa'ile» te filozofët."},
{t:"Emrat",q:"Nxjerrja e «El-Lat» nga «El-Ilah» dhe «El-Uzza» nga «El-Aziz» është ilhad i llojit:",o:["Nxjerrje emrash idhujsh nga emrat e Allahut","Mohim i kuptimeve të emrave","Emërtim i Allahut me emër të ri","Përshkrim i mënyrës së cilësive"],a:0,e:"Mushrikët bënë ilhad duke prejardhur emra idhujsh nga emrat e Allahut — devijim i rëndë."},
{t:"Emrat",q:"Dallimi i treguesve: mutabeka tregon ___, tedammun tregon ___, iltizam tregon ___:",o:["tërë kuptimin / një pjesë të tij / një gjë jashtë kuptimit por të domosdoshme","një pjesë / tërësinë / të kundërtën","të domosdoshmen / tërësinë / pjesën","vetëm Qenien / vetëm cilësinë / vetëm emrin"],a:0,e:"Mutabeka = tërësia; tedammun = pjesa brenda; iltizam = e domosdoshmja jashtë kuptimit të drejtpërdrejtë."},
{t:"Emrat",q:"«El-Alim» dhe «El-Kadir» konsiderohen të ndryshëm (mutebajin) sepse:",o:["Secili bart kuptim të veçantë: dija s'është fuqia","Secili tregon një të emërtuar tjetër","Ndryshojnë në numrin e shkronjave","U zbritën në kohë të ndryshme"],a:0,e:"Nga tregimi i Qenies janë një; nga kuptimet janë të ndryshëm — El-Alim (dija) ≠ El-Kadir (fuqia)."},

/* ——— Rregullat e CILËSIVE ——— */
{t:"Cilësitë",q:"«Cilësitë e Allahut janë të gjitha kemal» vërtetohet me tri rrugë; cilat?",o:["Sem' (sheriat), akl (mendje) dhe fitra (natyrshmëri)","Sem', ixhma dhe kijas","Akl, shija dhe zakoni","Ixhma, hiss dhe ëndrra"],a:0,e:"Sheriati («وَلِلَّهِ الْمَثَلُ الْأَعْلَى»), mendja (çdo ekzistues real ka cilësi) dhe fitra (adhurohet vetëm i përkryeri)."},
{t:"Cilësitë",q:"«وَلِلَّهِ الْمَثَلُ الْأَعْلَى» përdoret si provë për:",o:["Se Allahut i takon përshkrimi më i lartë e më i përsosur","Mohimin e cilësive të Tij","Ngjasimin e Tij me krijesat","Kufizimin e cilësive në numër"],a:0,e:"«El-Methelu'l-A'la» = cilësia/përshkrimi më sublim — çdo cilësi e Allahut është në kulmin e përsosmërisë."},
{t:"Cilësitë",q:"Cilësia që është mangësi e pastër (vdekja, padituria, pafuqia) ndaj Allahut është:",o:["E pamundur — mohohet, me pohim të së kundërtës së përkryer","E lejuar të pohohet në disa raste","E detyrueshme të pohohet","E pëlqyeshme të përmendet"],a:0,e:"Mangësia e pastër mohohet; «وَتَوَكَّلْ عَلَى الْحَيِّ الَّذِي لَا يَمُوتُ» mohon vdekjen e pohon jetën e përkryer."},
{t:"Cilësitë",q:"Cilësia që është kemal në një gjendje e naks në tjetrën (mekri, kejdi) trajtohet me:",o:["Detajim: pohohet vetëm në kontekst të kundërpërgjigjes (mukabele)","Pohim absolut në çdo rast","Mohim absolut në çdo rast","Heshtje të plotë pa gjykim"],a:0,e:"S'pohohet e as mohohet absolutisht: «وَيَمْكُرُونَ وَيَمْكُرُ اللَّهُ» — mekri i Allahut vetëm si kundërpërgjigje e drejtë."},
{t:"Cilësitë",q:"Pse Allahu e përshkruan Veten me «mekr» dhe «istihza» vetëm në trajtën e kundërpërgjigjes?",o:["Sepse si nismë do të ishin naks, por si ndëshkim i drejtë ndaj armikut janë kemal","Sepse janë cilësi të pakufizuara si dija","Sepse Ai s'i ka këto cilësi aspak","Sepse u përmendën vetëm një herë në Kuran"],a:0,e:"Mekri/istihzaja janë lavdi kur janë përgjigje ndaj atij që i meriton; prandaj Kurani i kushtëzon me mukabele."},
{t:"Cilësitë",q:"Pse thënia «خان الله من يخون» refuzohet, ndonëse mekri si kundërpërgjigje pranohet?",o:["Sepse khijaneti (tradhtia) është pabesi në vend amaneti — naks absolut, pa anë lavdie","Sepse khijaneti është cilësi e krijuar","Sepse mekri dhe khijaneti janë e njëjta gjë","Sepse thënia është në gjuhën popullore"],a:0,e:"Ndryshe nga mekri, khijaneti është gjithmonë i qortueshëm; prandaj Kurani tha «فَأَمْكَنَ مِنْهُمْ», jo «fe khanehum»."},
{t:"Cilësitë",q:"Rregulli «dera e cilësive është më e gjerë se dera e emrave» mbështetet në:",o:["Çdo emër ngërthen cilësi (jo e kundërta), e cilësitë e lidhura me veprat s'kanë fund","Cilësitë janë më të lehta për t'u kuptuar se emrat","Cilësitë janë metaforike, emrat realë","Emrat janë të fshehtë, cilësitë të dukshme"],a:0,e:"Çdo emër jep cilësi, por jo çdo cilësi jep emër; e cilësitë fi'lijje s'kanë fund: «مَا نَفِدَتْ كَلِمَاتُ اللَّهِ»."},
{t:"Cilësitë",q:"Pse e përshkruajmë Allahun «zbret, vjen, kap», por s'themi se prej emrave të Tij janë «En-Nazil, El-Xhai, El-Akhidh»?",o:["Sepse derë e cilësive (përshkrimi) është më e gjerë se derë e emrave (teukifi i emrave më i ngushtë)","Sepse këto vepra s'kanë ndodhur realisht","Sepse këta do të ishin emra metaforikë","Sepse Mutezilët e ndaluan nxjerrjen e tyre"],a:0,e:"Përshkruajmë me veprat siç erdhën, por s'nxjerrim emra nga çdo vepër — emrat janë teukifijje e më të ngushta."},
{t:"Cilësitë",q:"Ndarja parësore e cilësive është:",o:["Pohuese (thubutijje) dhe mohuese (selbijje)","Vetjake (dhatijje) dhe veprore (fi'lijje)","Lajmëruese (khaberijje) dhe racionale","Të qarta (muhkem) dhe të paqarta (muteshabih)"],a:0,e:"Ndarja e parë: thubutijje (ato që Allahu i pohoi — kemal) dhe selbijje (ato që i mohoi — naks)."},
{t:"Cilësitë",q:"Qëllimi kryesor kur Allahu MOHON një cilësi (selbijje) për Veten është:",o:["Pohimi i përsosmërisë së të kundërtës, ngaqë mohimi i zhveshur s'është lavdi","Vetëm mohimi, pa kuptim tjetër","Krahasimi i Tij me krijesat","Fshehja e asaj cilësie prej robërve"],a:0,e:"Mohimi bëhet lavdi vetëm kur ngërthen pohimin e së kundërtës së përkryer; mohimi i thatë mund të jetë edhe mungesë (paaftësi)."},
{t:"Cilësitë",q:"«وَمَا كَانَ اللَّهُ لِيُعْجِزَهُ مِن شَيْءٍ» — mohimi i paaftësisë ngërthen pohimin e:",o:["Përsosmërisë së diturisë DHE të fuqisë së Tij","Vetëm fuqisë së Tij","Vetëm diturisë së Tij","Vetvetiu asgjëje — është thjesht mohim"],a:0,e:"Prandaj vjen «إِنَّهُ كَانَ عَلِيمًا قَدِيرًا» — një cilësi selbijje mund të ngërthejë më shumë se një përsosmëri."},
{t:"Cilësitë",q:"Pse cilësitë pohuese (thubutijje) që Allahu lajmëroi janë shumë më të shumta se ato mohuese?",o:["Sepse tregojnë lavdi e kemal, e sa më shumë e të larmishme, aq më plotë shfaqet përsosmëria","Sepse mohimi është i vështirë ta shprehet","Sepse mendja s'i kap cilësitë mohuese","Sepse Allahu i fshehu cilësitë mohuese"],a:0,e:"Thubutijjet janë medh ue kemal; shumësia dhe larmia e tyre e shfaq më plotë përsosmërinë e të përshkruarit."},
{t:"Cilësitë",q:"Cilësitë mohuese (selbijje) përmenden zakonisht në tri raste. Cili NUK është prej tyre?",o:["Shpikja e cilësive që mendja i sheh të bukura","Tregimi i përgjithësisë së përsosmërisë («لَيْسَ كَمِثْلِهِ شَيْءٌ»)","Mohimi i trillimeve të gënjeshtarëve («أَن دَعَوْا لِلرَّحْمَٰنِ وَلَدًا»)","Largimi i mangësisë së hamendur në një çështje"],a:0,e:"Tri rastet: përgjithësimi i kemalit, mohimi i trillimeve, largimi i mangësisë; cilësitë nuk shpiken me mendje."},
{t:"Cilësitë",q:"Cilësitë pohuese (thubutijje) ndahen më tej në:",o:["Vetjake (dhatijje) dhe veprore (fi'lijje)","Kalimtare dhe jokalimtare","Të qarta dhe të paqarta","Reale dhe metaforike"],a:0,e:"Thubutijje → dhatijje (Allahu përshkruhet gjithmonë me to) dhe fi'lijje (lidhen me vullnetin)."},
{t:"Cilësitë",q:"Dallimi mes cilësive vetjake (dhatijje) dhe veprore (fi'lijje) është:",o:["Dhatijje: Allahu i ka përherë (dija, fuqia); fi'lijje: lidhen me vullnetin (nëse do, i bën)","Dhatijje janë të dukshme; fi'lijje të fshehta","Dhatijje janë reale; fi'lijje metaforike","Dhatijje janë kalimtare; fi'lijje jokalimtare"],a:0,e:"Dhatijje nuk ndahen kurrë prej Tij; fi'lijje varen nga meshi'eja (istiuaja, nuzuli)."},
{t:"Cilësitë",q:"Cilësitë lajmëruese (khaberijje) — fytyra, dy duart, dy sytë — klasifikohen te:",o:["Cilësitë vetjake (dhatijje)","Cilësitë veprore (fi'lijje)","Cilësitë mohuese (selbijje)","Një kategori e veçantë jashtë dhatijve e fi'lijve"],a:0,e:"Khaberijjet (uexh, jedejn, ajnejn) janë dhatijje, ngaqë Allahu përshkruhet me to përgjithmonë."},
{t:"Cilësitë",q:"Pse istiuaja mbi Arsh dhe nuzuli klasifikohen si cilësi veprore (fi'lijje)?",o:["Sepse lidhen me vullnetin — Allahu i realizon kur të dojë","Sepse i kanë edhe krijesat","Sepse janë cilësi të krijuara","Sepse njihen vetëm nga mendja"],a:0,e:"Fi'lijje = varen nga meshi'eja; istiuaja e nuzuli janë vepra që Allahu i kryen kur të dojë."},
{t:"Cilësitë",q:"Cilësia e Kelamit (Të folurit) te Ibn Uthejmini është:",o:["Vetjake-veprore njëkohësisht: vetjake nga origjina, veprore nga njësitë","Vetëm vetjake (dhatijje)","Vetëm veprore (fi'lijje)","Mohuese (selbijje)"],a:0,e:"Nga origjina Allahu është gjithmonë folës (dhatijje); nga njësitë flet kur të dojë (fi'lijje): «إِذَا أَرَادَ شَيْئًا أَن يَقُولَ لَهُ كُن»."},
{t:"Cilësitë",q:"Çdo cilësi e lidhur me vullnetin e Allahut është njëkohësisht:",o:["E ndjekur nga urtësia (hikmeti) e Tij","E rastësishme, pa qëllim të caktuar","E detyruar nga diçka jashtë Tij","E pakuptimtë për robërit"],a:0,e:"«إِنَّ اللَّهَ كَانَ عَلِيمًا حَكِيمًا» — Allahu s'do asgjë veçse në pajtim me urtësinë, qoftë e dukshme a e fshehtë."},
{t:"Cilësitë",q:"Dy rreziqet që duhen shmangur patjetër në POHIMIN e cilësive janë:",o:["Temthili dhe tekjifi","Tahrifi dhe ta'tili","Dëgjimi dhe mendja","Pohimi dhe mohimi"],a:0,e:"Kush pohon cilësitë duhet të largohet nga temthili (ngjasimi) dhe tekjifi (përshkrimi i mënyrës)."},
{t:"Cilësitë",q:"Dallimi teorik mes temthilit dhe teshbihit (te ata që i dallojnë) është:",o:["Temthili = barazim në të gjitha cilësitë; teshbihi = barazim në shumicën","Temthili = barazim në shumicën; teshbihi = në të gjitha","Temthili lidhet me Qenien; teshbihi me emrat","Janë sinonime të plota pa asnjë dallim"],a:0,e:"Temthil = musavat në çdo cilësi; teshbih = musavat në shumicën; por preferohet «nefju't-temthil» për t'u pajtuar me Kuranin."},
{t:"Cilësitë",q:"Pse preferohet shprehja «nefju't-temthil» (mohimi i temthilit) ndaj «nefju't-teshbih»?",o:["Për t'u pajtuar me «لَيْسَ كَمِثْلِهِ شَيْءٌ», që e mohon «mith-lin»","Sepse teshbihi fare s'ekziston","Sepse është shprehje më e shkurtër","Sepse e përdorin Mutezilët"],a:0,e:"Kurani mohon «mithl» (të barabartin); prandaj shprehja më kur'anore është mohimi i temthilit."},
{t:"Cilësitë",q:"Thënia e Imam Ahmedit «لا يوصف الله إلا بما وصف به نفسه أو وصفه به رسوله» shpreh se cilësitë janë:",o:["Teukifijje — vërtetohen vetëm nga Kurani e Sunneti","Racionale — vërtetohen me kijas","Metaforike — s'kanë kuptim real","Të hapura për shtim sipas kohës"],a:0,e:"Si emrat, edhe cilësitë janë teukifijje: s'i tejkalojmë Kuranin dhe hadithin në pohim a mohim."},
{t:"Cilësitë",q:"Treguesi i Kuranit e Sunnetit për pohimin e një cilësie vjen në tri mënyra. Cila NUK është prej tyre?",o:["Deduktimi i saj përmes silogjizmit filozofik","Përmendja e drejtpërdrejtë e cilësisë (izza, fuqia, fytyra)","Përfshirja e saj nga një emër (El-Gafur → falja)","Përmendja e një vepre që e tregon (istiuaja)"],a:0,e:"Tri mënyrat: tesrihu bis-sifa, tedammunu'l-ism leha, tesrihu bi fi'l dall alejha — jo deduktim filozofik."},
{t:"Cilësitë",q:"Pohimi se cilësia e Allahut është «حقيقة» (reale) do të thotë:",o:["Reale, jo mexhaz, por në mënyrën që i përshtatet Atij","Identike me cilësitë e krijesave","Metaforike (mexhaz)","Pa kuptim të njohur për ne"],a:0,e:"Ehlu Sunneti i pohon cilësitë në kuptimin real (hakika), por «la'ike bihi» — pa ngjasim e pa tekjif."},

/* ——— Provat, dhahiri, tefuidi ——— */
{t:"Provat",q:"Provat e vetme me të cilat vërtetohen emrat dhe cilësitë e Allahut janë:",o:["Libri dhe Sunneti","Libri, Sunneti dhe kijasi i saktë","Libri, ixhmaja dhe mendja","Mendja dhe fitra e shëndoshë"],a:0,e:"Emrat e cilësitë janë gajb; vërtetohen vetëm me teukif prej Kuranit dhe Sunnetit, jo me kijas a mendje."},
{t:"Provat",q:"Ndaj një shprehjeje që s'ka ardhur as pohim as mohim (si «el-xhihe»), qëndrimi ndaj LAFZIT (shprehjes) është:",o:["Teuakkuf — as pohim, as mohim i vetë fjalës","Pohim i saj si cilësi","Mohim i saj si mangësi","Përkthim i saj në gjuhën arabe"],a:0,e:"Ndaj lafzit të pandriçuar nga teksti ndalemi; kurse ndaj KUPTIMIT detajojmë (i verteti pranohet, i koti refuzohet)."},
{t:"Provat",q:"Ndaj KUPTIMIT të fjalës «el-xhihe» (drejtim) për Allahun, qëndrimi është:",o:["Detajim: drejtimi i poshtëm kot; i larti rrethues kot; i larti jo-rrethues i vërtetë","Pranim i plotë pa kusht","Mohim i plotë i çdo kuptimi","Dorëzim i kuptimit tek Allahu"],a:0,e:"Lafzi s'është në tekst → teuakkuf; por kuptimi detajohet: uluvv jo-rrethues që i përshtatet madhështisë është i vërtetë."},
{t:"Provat",q:"Detyra ndaj teksteve të cilësive, veçanërisht aty ku s'ka vend re'ji, është:",o:["T'i kalojmë mbi kuptimin e dukshëm (dhahir) pa tahrif","T'i interpretojmë sipas mendjes (te'vil)","T'ua dorëzojmë kuptimin Allahut (tefuid)","T'i mohojmë si të pakuptimta"],a:0,e:"Kurani zbriti në arabishte të qartë; detyra është kuptimi i dhahirit pa tahrif, posaçërisht te cilësitë ku s'ka vend re'ji."},
{t:"Provat",q:"Prova kryesore se tekstet kuptohen sipas dhahirit arab është:",o:["Se Kurani zbriti «بِلِسَانٍ عَرَبِيٍّ مُّبِينٍ», e Allahu i qortoi çifutët pikërisht për tahrif","Se mendja e kërkon doemos","Se kështu është më e lehtë për njerëzit","Se vetëm selefi e mbështetën këtë"],a:0,e:"Gjuha e qartë arabe kërkon kuptimin e dhahirit; çifutët u qortuan për shtrembërimin (tahrif) e fjalës."},
{t:"Provat",q:"Kuptimet e dukshme (dhauahir) të teksteve të cilësive janë:",o:["Të njohura për nga kuptimi, të panjohura për nga mënyra (kejfijjeti)","Krejtësisht të panjohura, edhe në kuptim","Krejtësisht të njohura, edhe mënyra","Metaforike në tërësinë e tyre"],a:0,e:"Dallimi vendimtar: kuptimin e dimë (istiua = lartësi/qëndrim), mënyrën s'e dimë — prandaj refuzohet tefuidi i kuptimit."},
{t:"Provat",q:"Medh'hebi i Mufeuvide (që ia dorëzojnë Allahut edhe KUPTIMIN e cilësive) është:",o:["I kotë; prej thënieve më të këqija të bidatit dhe ilhadit sipas Ibn Tejmijes","Medh'hebi i vërtetë i selefit","Rruga e mesme mes dy ekstremeve","I detyrueshëm për njerëzit e thjeshtë"],a:0,e:"Tefuidi i kuptimit e bën shpalljen gjëegjëzë pa dobi; selefi pohuan kuptimet e ia lanë Allahut vetëm kejfijjetin."},
{t:"Provat",q:"Dallimi vendimtar mes metodës së selefit dhe asaj të Mufeuvide është:",o:["Selefi pohon kuptimin e ia lë Allahut mënyrën; Mufeuvidja ia lë Allahut edhe kuptimin","Selefi mohon kuptimin; Mufeuvidja e pohon","Selefi interpreton; Mufeuvidja ndalet te lafzi","Të dy ia dorëzojnë Allahut kuptimin e mënyrën"],a:0,e:"Thëniet e selefit janë mutevatir në pohimin e kuptimeve; vetëm kejfijjetin ia dorëzojnë Allahut — e kundërta e tefuidit të kuptimit."},

/* ——— Tre grupet & përkufizimet ——— */
{t:"Grupet",q:"Grupi i parë përballë teksteve të cilësive (që e mbajtën dhahirin kuptim të vërtetë që i përshtatet Allahut) janë:",o:["Selefi — Ehlu Sunneti vel-Xhemati","Mushebbihet (ngjasuesit)","Muattilet (mohuesit)","Mufeuvidja (dorëzuesit e kuptimit)"],a:0,e:"Vetëm këta e meritojnë me të vërtetë emrin «Ehlu Sunneti vel-Xhemati»."},
{t:"Grupet",q:"Grupi që e bëri dhahirin kuptim të kotë POR e pohoi (ngjasim) janë:",o:["Mushebbihet","Muattilet","Mufeuvidja","Selefi"],a:0,e:"Mushebbihet ranë në jinaje ndaj teksteve: e kuptuan dhahirin si ngjasim e pastaj e pohuan — kundër «لَيْسَ كَمِثْلِهِ شَيْءٌ»."},
{t:"Grupet",q:"Grupi që e bëri dhahirin kuptim të kotë dhe pastaj e MOHOI kuptimin e vërtetë janë:",o:["Muattilet (ehlu te'tilit)","Mushebbihet","Mufeuvidja","Selefi"],a:0,e:"Muattilet e supozuan dhahirin ngjasim, pastaj mohuan kuptimin e vërtetë — duke e quajtur «te'vil», që në të vërtetë është tahrif."},
{t:"Grupet",q:"Dallimi thelbësor mes Mushebbihëve dhe Muattilëve është:",o:["Të dy e kuptojnë gabim dhahirin (ngjasim); Mushebbihu e POHON, Muattili e MOHON kuptimin","Mushebbihu mohon, Muattili pohon","Të dy i pohojnë drejt cilësitë","Të dy mohojnë edhe emrat edhe cilësitë"],a:0,e:"Nisin nga i njëjti gabim (dhahiri = ngjasim), por njëri pohon ngjasimin, tjetri mohon kuptimin — të dyja të kota."},
{t:"Grupet",q:"Tahrifi, në përkufizim, është:",o:["Shtrembërimi i tekstit nga kuptimi i vërtetë te një kuptim tjetër","Mohimi i cilësisë që i takon Allahut","Përshkrimi i mënyrës (kejfijjetit) së cilësisë","Pohimi i një të ngjashmi me Allahun"],a:0,e:"Tahrif = shtrembërimi i fjalës; ta'til = mohimi i cilësisë; tekjif = përshkrimi i mënyrës; temthil = pohimi i të barabartit."},
{t:"Grupet",q:"Ta'tili, në përkufizim, është:",o:["Mohimi/zbrazja e Allahut nga cilësitë që i takojnë (ose nga disa)","Shtrembërimi i tekstit te një kuptim tjetër","Përshkrimi i mënyrës së cilësisë","Pohimi i një të ngjashmi me Allahun"],a:0,e:"Ta'til = ta'tilu'l-khalik an sifatihi; shpesh arrihet përmes tahrifit (mjeti) për të mohuar cilësinë (qëllimi)."},
{t:"Grupet",q:"Ta'tili ndahet në dy shkallë. Ta'tili i plotë (kul-li) është medh'hebi i:",o:["Xhehmijve (gulatët e të cilëve mohojnë edhe emrat)","Esharive","Maturidive","Mushebbihëve"],a:0,e:"Ta'til kul-li = mohim i të gjitha cilësive (Xhehmijtë); ta'til xhuz'i = mohim i disave (Esharitë)."},
{t:"Grupet",q:"Ta'tili i pjesshëm (xhuz'i) — mohim i disa cilësive e jo i disave — është medh'hebi i:",o:["Esharive","Xhehmijve të plotë","Selefit","Sahabëve"],a:0,e:"Esharitë bëjnë ta'til xhuz'i: pohojnë shtatë cilësi e mohojnë pjesën tjetër."},
{t:"Grupet",q:"I pari që njihet se futi ta'tilin, dhe i pari me teshbihin e Krijuesit me krijesën, ishin përkatësisht:",o:["El-Xha'd ibn Dirham dhe Hisham ibn El-Hakem","Xhehm ibn Safuan dhe Vasil ibn Ata","Vasil ibn Ata dhe El-Xha'd ibn Dirham","Hisham ibn El-Hakem dhe Xhehm ibn Safuan"],a:0,e:"I pari me ta'til: El-Xha'd ibn Dirham; i pari me këtë lloj teshbihi: Hisham ibn El-Hakem err-Rafidij."},
{t:"Grupet",q:"Tekjifi, si term, është:",o:["Përshkrimi i MËNYRËS (kejfijjetit) së cilësisë, pa domosdo ngjasim","Pohimi i një të BARABARTI (mithl) me Allahun","Mohimi i cilësisë nga Qenia e Tij","Shtrembërimi i tekstit te kuptim tjetër"],a:0,e:"Çdo temthil ngërthen tekjif, por jo e kundërta: mund të përshkruhet mënyrë pa pohuar të barabartë — ndaj tekjifi është më i gjerë."},
{t:"Grupet",q:"Dallimi mes temthilit dhe teshbihit, në përkufizim, është:",o:["Temthili = pohim i «mith-lit» (të barabartit); teshbihi = pohim i «shebih-it» (të ngjashmit)","Temthili lidhet me Qenien; teshbihi me cilësitë","Temthili = mohim; teshbihi = pohim","Janë sinonime pa asnjë dallim"],a:0,e:"Mithl = barazim i plotë; shebih = ngjashmëri; disa dallojnë: temthil në çdo cilësi, teshbih në shumicën."},
{t:"Grupet",q:"Ilhadi, gjuhësisht, nënkupton:",o:["«El-mejl» (anim/shmangie)","Dituri e thellë","Pohim të cilësive","Drejtësi e saktësi"],a:0,e:"Ilhad = anim nga e drejta; në terminologji = shmangie prej asaj që është detyrë të besohet a të veprohet."},
{t:"Grupet",q:"Ilhadi në ajetet SHERIATIKE (tekstet) është:",o:["Shtrembërimi i tyre, përgënjeshtrimi i lajmeve, ose kundërshtimi i gjykimeve","Atribuimi i krijesave dikujt tjetër përveç Allahut","Besimi se Allahu ka ortak në krijim","Mospërmendja e tyre fare"],a:0,e:"Ilhadi ndahet në atë të ajeteve sher'ijje (tekstet: tahrif/përgënjeshtrim/mosbindje) dhe kaunijje (krijesat)."},
{t:"Grupet",q:"Ilhadi në ajetet KAUNIJJE (krijimi) është:",o:["Atribuimi i tyre dikujt tjetër përveç Allahut, ose besimi i ortakut/ndihmësit","Shtrembërimi i teksteve të cilësive","Mohimi i cilësive të Allahut","Pohimi i emrave pa cilësi"],a:0,e:"Ilhadi kauni = atribuimi i krijesave dikujt tjetër, ose besimi se Allahu ka ortak a ndihmës në to."},

/* ——— Tedmurija ——— */
{t:"Tedmurija",q:"Devijuesit nga rruga e të dërguarve në emrat e cilësitë ndahen në:",o:["Mumethile (teprim në pohim, mangësi në mohim) dhe Muattile (e kundërta)","Besimtarë dhe mohues","Të ditur dhe injorantë","Arabë dhe joarabë"],a:0,e:"Mumethilet tepruan pohimin e mangësuan mohimin; Muattilet tepruan mohimin e mangësuan pohimin."},
{t:"Tedmurija",q:"Medh'hebi i Mumethileve rrëzohet me tri rrugë provash, që janë:",o:["Sem' (sheriat), akl (mendje) dhe hiss (shqisë)","Sem', ixhma dhe kijas","Fitra, zakoni dhe shija","Vetëm me argument mendor"],a:0,e:"Rrëzohet me sheriatin, mendjen (Krijuesi ≠ krijesa) dhe shqisën (dallimi i dukshëm i qenieve)."},
{t:"Tedmurija",q:"«لَيْسَ كَمِثْلِهِ شَيْءٌ وَهُوَ السَّمِيعُ الْبَصِيرُ» është boshti sepse njëkohësisht:",o:["Rrëzon temthilin (gjysma e parë) dhe pohon cilësitë (gjysma e dytë)","Mohon cilësitë dhe pohon ngjasimin","Pohon temthilin dhe mohon dëgjimin","Mohon edhe emrat edhe cilësitë"],a:0,e:"Gjysma e parë kundër Mumethilëve; gjysma e dytë kundër Muattilëve — një ajet kundër dy devijimeve."},
{t:"Tedmurija",q:"Sipas Tedmurijes, Muattilet ndahen në:",o:["Katër grupe (taife)","Dy grupe","Tre grupe","Gjashtë grupe"],a:0,e:"Katër grupet: Esharitë/Maturiditë; Mutezilët; gulatët e Xhehmijve/Karamitë/Batinitë; gulatu'l-gulat (filozofë)."},
{t:"Tedmurija",q:"Grupi i PARË i Muattileve — që pohojnë emrat dhe shtatë cilësi — janë:",o:["Esharitë dhe ata që u ngjasojnë prej Maturidive","Mutezilët dhe pasuesit e tyre","Gulatët e Xhehmijve","Filozofët dhe batinitët"],a:0,e:"Grupi i parë (Esharitë/Maturiditë) pohon emrat e shtatë cilësi, e mohon shumicën e realiteteve të tjera."},
{t:"Tedmurija",q:"Shtatë cilësitë që pohon grupi i parë (Esharitë) janë:",o:["Jeta, Dituria, Fuqia, Vullneti, Të folurit, Dëgjimi, Shikimi","Fytyra, duart, sytë, ardhja, zbritja, istiuaja, mëshira","Mëshira, hidhërimi, dashuria, kënaqësia, urrejtja, ardhja, zbritja","Krijimi, furnizimi, gjallërimi, vdekja, ringjallja, llogaria, gjykimi"],a:0,e:"Shtatë sifatu'l-me'ani: el-hajat, el-ilm, el-kudra, el-irade, el-kelam, es-sem', el-besar."},
{t:"Tedmurija",q:"Grupi i DYTË i Muattileve — që pohojnë emrat POR i zbrazin nga cilësitë — janë:",o:["Mutezilët dhe pasuesit e tyre","Esharitë","Maturiditë","Mushebbihet"],a:0,e:"Mutezilët pohojnë emrat si etiketa: «Alim bila ilm, Kadir bila kudra» — pohim i emrit, mohim i cilësisë."},
{t:"Tedmurija",q:"Disa Mutezilë i trajtojnë emrat (El-Alim, El-Kadir) si:",o:["Etiketa të zbrazëta ose sinonime pa kuptime të veçanta","Cilësi reale të dallueshme nga njëra-tjetra","Emra të krijuar nga robërit","Metafora të Qenies hyjnore"],a:0,e:"Shubha e tyre: pohimi i cilësive kërkon tedammun; prandaj i bëjnë emrat etiketa pa përmbajtje — refuzim me sem' e akl."},
{t:"Tedmurija",q:"Grupi i TRETË i Muattileve — që mohojnë edhe emrat edhe cilësitë — janë:",o:["Gulatët e Xhehmijve, Karamitët dhe Batinitët","Esharitë dhe Maturiditë","Mutezilët","Mushebbihet"],a:0,e:"Grupi i tretë e përshkruan Allahun vetëm me mohim («el-mevxhudu'l-mutlak bi shartil-itlak»)."},
{t:"Tedmurija",q:"Grupi i KATËRT (gulatu'l-gulat) e teproi edhe më tej duke:",o:["S'pohuar e s'mohuar — «as ekziston as s'ekziston, as i gjallë as i vdekur»","Pohuar të gjitha cilësitë bashkë me emrat","Ngjasuar Allahun hapur me krijesat","Pohuar vetëm emrat pa cilësi"],a:0,e:"Grupi i katërt mohon edhe pohimin edhe mohimin, nga frika se pohimi ngjason me ekzistuesit e mohimi me joekzistuesit."},
{t:"Tedmurija",q:"Secili prej katër grupeve ra në pesë rreziqe (mehadhir). Cili NUK është prej tyre?",o:["Pohimi i cilësive ashtu siç i takojnë Allahut, pa ngjasim","Kundërshtimi i rrugës së selefit","Ta'tili dhe tahrifi i teksteve nga kuptimi i synuar","Zbrazja e Allahut nga cilësitë e kemalit"],a:0,e:"Pohimi korrekt i cilësive s'është rrezik — është pikërisht rruga e shpëtimit e selefit."},
{t:"Tedmurija",q:"Parimi i parë (el-aslu'l-evvel) i Tedmurijes është:",o:["«Fjala për disa cilësi është si për disa të tjera» (القول في بعض الصفات كالقول في بعض)","«Fjala për cilësitë është si fjala për Qenien»","«Istiuaja është e njohur, kejfi i panjohur»","«Allahu është i lartë mbi Arshin e Tij»"],a:0,e:"Parimi i parë u drejtohet atyre që pohojnë disa cilësi e mohojnë disa të tjera: s'ka dallim mes tyre."},
{t:"Tedmurija",q:"Zbatim i parimit të parë: atij që pohon iraden e mohon gadabin, i thuhet:",o:["S'ka dallim mes realitetit të iradës që pohove e gadabit që mohove","Ke të drejtë në këtë dallim","Hidhërimi fare s'ekziston","Vullneti është metaforë"],a:0,e:"Parimi i parë detyron konsekuencë: kush pohon një cilësi real detyrohet të pohojë të ngjashmet; ndryshe bie në kundërthënie."},
{t:"Tedmurija",q:"Parimi i dytë (el-aslu'th-thani) i Tedmurijes është:",o:["«Fjala për cilësitë është si fjala për Qenien» (القول في الصفات كالقول في الذات)","«Fjala për disa cilësi është si për disa të tjera»","«Istiuaja është bidat»","«Emrat janë nëntëdhjetë e nëntë»"],a:0,e:"Parimi i dytë u drejtohet mumethilit e muattilit: ashtu siç pohon Qenie që s'u ngjan qenieve, pohi cilësi që s'u ngjajnë cilësive."},
{t:"Tedmurija",q:"Si zbatohet parimi i dytë ndaj Mumethilit?",o:["«A nuk pohon Qenie që s'u ngjan qenieve? Pse pra ia ngjason cilësitë cilësive të krijesave?»","«Moho edhe Qenien bashkë me cilësitë»","«Pohi cilësitë dy herë për siguri»","«Hesht për Qenien e cilësitë»"],a:0,e:"Fjala për cilësitë është degë e fjalës për Qenien; kush s'e ngjason Qenien, s'duhet t'i ngjasojë cilësitë."},
{t:"Tedmurija",q:"Si zbatohet parimi i dytë ndaj Muattilit (Mutezilit)?",o:["«A nuk pohon Qenie që s'u ngjan qenieve të tjera? Atëherë pohi cilësi që s'u ngjajnë cilësive të tjera»","«Moho edhe Qenien që s'ta pranon mendja»","«Ngjasoje Qenien me krijesat»","«Hesht e mos pohoni asgjë»"],a:0,e:"Muattilit i kthehet argumenti i tij: nëse pranon Qenie të papërngjashme pa rënë në tashbih, le të pranojë edhe cilësi të papërngjashme."},
{t:"Tedmurija",q:"Kur dikush pyet «Si (kejf) është istiuaja e Allahut?», përgjigjja sipas parimit të dytë është:",o:["«Fjala për cilësitë është si për Qenien — ma trego ti si është Qenia e Tij?»","«Istiuaja është ngjitje trupore mbi Arsh»","«Istiuaja do të thotë vetëm sundim (istivla)»","«Allahu fare s'ka istiua»"],a:0,e:"Ashtu si pohojmë Qenie reale pa e ditur kejfin, pohojmë istiua reale pa e ditur kejfin — s'ka dallim."},
{t:"Tedmurija",q:"Thënia e famshme e Imam Malikut për istiuanë (kur u pyet «kejfe isteva?») ishte:",o:["«Istiuaja e njohur, kejfi i panjohur, besimi detyrë, pyetja për të bidat»","«Istiuaja është e panjohur në kuptim e në mënyrë»","«Istiuaja do të thotë sundim mbi mbretërinë»","«Mos e pohoni istiuanë fare»"],a:0,e:"«El-istivau ma'lum, uel-kejfu mexhhul, uel-imanu bihi uaxhib, ues-su'alu anhu bid'a» — rregull për çdo cilësi."},
{t:"Tedmurija",q:"Te thënia e Malikut, «الاستواء معلوم» i referohet ___, kurse «الكيف مجهول» i referohet ___:",o:["kuptimit (i njohur në arabisht) / mënyrës (e panjohur për ne)","mënyrës / kuptimit","kohës / vendit","lafzit / shqiptimit"],a:0,e:"Kuptimi i istiuasë njihet (lartësi/qëndrim kur kushtëzohet me «ala»); kejfijjeti mbetet i panjohur — pyetja për të bidat."},
{t:"Tedmurija",q:"Istiuaja, kur kushtëzohet me «على» (si «اسْتَوَى عَلَى الْعَرْشِ»), ka kuptimin gjuhësor të:",o:["Lartësisë dhe qëndrimit/vendosjes (uluvv ue istikrar)","Të pushtuarit me forcë (istivla)","Të krijuarit e Arshit","Mëshirës që përfshin Arshin"],a:0,e:"«Isteva ala» në arabisht = u ngjit e qëndroi lart («لِتَسْتَوُوا عَلَى ظُهُورِهِ»); interpretimi «istivla» është tahrif."},
{t:"Tedmurija",q:"Dy shembujt (el-methlan) që sjell Tedmurija për të ilustruar pohimin pa ngjasim janë:",o:["Begatitë e Xhennetit dhe shpirti (err-ruh)","Dielli dhe hëna","Qielli dhe toka","Jeta dhe vdekja"],a:0,e:"Begatitë e Xhennetit (reale, por ndryshe nga dynjaja) dhe shpirti (real, por i panjohur) ilustrojnë pohimin pa ngjasim."},
{t:"Tedmurija",q:"Begatitë e Xhennetit përputhen me ato të dynjasë në ___ e ndryshojnë në ___:",o:["kuptim (emër) / realitet","mënyrë / emër","peshë / çmim","kohë / vend"],a:0,e:"Ibn Abasi: «Në dynja s'ka gjë nga Xhenneti veç emrave» — përputhje në emër, ndryshim rrënjësor në realitet."},
{t:"Tedmurija",q:"Mësimi i shembullit të shpirtit (err-ruh) për çështjen e cilësive është:",o:["Shpirti është real, por s'u ngjan trupave të dëshmuar — aq më tepër Krijuesi: real, pa ngjasim","Shpirti është trup si trupat e tjerë","Shpirti fare s'ekziston","Shpirtin e njohim plotësisht në realitet"],a:0,e:"Kush e mohon shpirtin është muattil, kush e ngjason është mumeththil; aq më tepër Krijuesi — real, por pa ngjasim."},

/* ——— Hamawija ——— */
{t:"Hamawija",q:"Risaleja «El-Fetua El-Hamauijje» u shkrua nga Ibn Tejmijje si:",o:["Përgjigje për një pyetje që i erdhi nga Shami rreth ajeteve e haditheve të cilësive","Libër i pavarur për çështjet e fikhut","Letër drejtuar një mbreti të kohës","Koment i plotë i tërë Kuranit"],a:0,e:"Ibn Tejmijje (v. 728 h.) e shkroi më 698 h. si përgjigje (~83 faqe); Ibn Uthejmini e përmblodhi."},
{t:"Hamawija",q:"Ibn Uthejmini e përmblodhi «El-Hamauijjen» në veprën:",o:["Fet'hu Rabbi'l-Berijje bi telkhisi'l-Hamauijje","El-Kavaidu'l-Muthla","Takribu't-Tedmurijje","Sherhu'l-Akideti'l-Uasitijje"],a:0,e:"«Fet'hu Rabbi'l-Berijje» është telkhisi (përmbledhja) i Ibn Uthejminit për Hamauijen e Ibn Tejmijes."},
{t:"Hamawija",q:"Kreu i parë i Hamauijes thekson se detyrë mbi robin në fenë e tij është:",o:["Të ndjekë atë që thanë Allahu, i Dërguari ﷺ dhe selefi (sahabët e tabi'inët)","Të ndjekë mendjen e tij të pavarur","Të ndjekë dijetarët e kelamit e filozofisë","Të heshtë ndaj çdo çështjeje të fesë"],a:0,e:"«قُلْ يَا أَيُّهَا النَّاسُ...» dhe «عليكم بسنتي وسنة الخلفاء الراشدين» — detyrë është pasimi i udhëzimit profetik e i selefit."},
{t:"Hamawija",q:"Risaleja e Profetit ﷺ ngërthen dy gjëra, që janë:",o:["Dije të dobishme ('ilm nafi') dhe vepër të mirë ('amel salih)","Pasuri dhe pushtet","Lehtësi dhe vështirësi","Fjalë e qartë dhe heshtje e urtë"],a:0,e:"«أَرْسَلَ رَسُولَهُ بِالْهُدَى وَدِينِ الْحَقِّ» — hudaja = dija e dobishme, dini'l-hakk = vepra e mirë; më e madhja dije është njohja e Allahut."},
{t:"Hamawija",q:"Pse është e pamundur që Profeti ﷺ ta ketë lënë mangët sqarimin e emrave e cilësive?",o:["Sepse ai ishte më i dituri për Zotin, më këshilluesi e më i qarti — e çështja më e rëndësishmja","Sepse ishte arab e e njihte gjuhën","Sepse jetoi gjatë e pati kohë","Sepse kishte shumë shokë"],a:0,e:"Njohja e Allahut është dija më e lartë; e pamundur që më i dituri, më këshilluesi e më i qarti ta lërë atë mangët."},
{t:"Hamawija",q:"Teza qendrore e Hamauijes për rrugën e selefit është se ajo është:",o:["Më e sigurt (aslem), më e ditur (a'lem) DHE më e urtë (ahkem)","Vetëm më e sigurt, kurse khalefi më e ditur","Më e vështirë por më pak e saktë","E barabartë me rrugën e khalefit"],a:0,e:"Kundër pretendimit «selefi aslem, khalefi a'lem ue ahkem», Hamauija provon se selefi është aslem edhe a'lem edhe ahkem."},
{t:"Hamawija",q:"Pse pretendimi «selefi aslem, khalefi a'lem ue ahkem» është kontradiktor në vetvete?",o:["Sepse siguria (selame) s'arrihet pa dituri e urtësi — pra «aslem» e kërkon «a'lem» dhe «ahkem»","Sepse selefi ishin më të paktë në numër","Sepse khalefi ishin më afër shpalljes","Sepse fjalia është gramatikisht e gjatë"],a:0,e:"Nuk ka selame pa ilm e hikme; të quash një rrugë më të sigurt e njëkohësisht më pak të ditur është kontradiktë e brendshme."},
{t:"Hamawija",q:"Pse e vërteta në çështjen e cilësive duhet të jetë te selefi (argumenti i dilemës)?",o:["Sepse ndryshe sahabët e tabi'inët ose folën të kotën ose heshtën nga e vërteta — të dyja të pamundura","Sepse selefi ishin arabë të pastër","Sepse khalefi ishin të varfër në dije botërore","Sepse selefi ishin shumë më tepër në numër"],a:0,e:"E vërteta ose është te selefi ose te khalefi; e dyta e bën ekzistencën e Kuranit e Sunnetit «darar mahd» — e pamundur."},
{t:"Hamawija",q:"Pretendimi se metoda e selefit ishte «thjesht besim në lafzet pa pohim kuptimi» (tefuid i kuptimit) është:",o:["Gënjeshtër ndaj selefit — ata ishin më të diturit e ummetit për kuptimet e teksteve","I vërtetë dhe i saktë historikisht","Mendim vetëm i Ibn Tejmijes","I saktë për disa cilësi, jo për të tjera"],a:0,e:"Selefi pohuan kuptimet (herë përmbledhtas, herë hollësisht) e ia lanë Allahut vetëm kejfijjetin."},
{t:"Hamawija",q:"Fakhrud-Din er-Razi, prototip i mutekel-limit, në fund të jetës pranoi se:",o:["Rrugët kelamike e filozofike s'shërojnë e s'shuajnë etjen, e rruga më e afërt është ajo e Kuranit","Kelami është shërues i sigurt i dyshimeve","Selefi gabuan në kuptimin e cilësive","Mendja duhet mbi tekstin gjithmonë"],a:0,e:"Rrëfimi i famshëm i Razit: «ما رأيتها تشفي عليلاً... وأقرب الطرق طريقة القرآن» — pranim i epërsisë së rrugës së selefit."},
{t:"Hamawija",q:"Pse rruga e khalefit s'mund të jetë «më e ditur» (a'lem) se ajo e selefit?",o:["Sepse selefi janë trashëgimtarët e profetëve e i morën dijet nga burimet e shpalljes, pa përzierje","Sepse khalefi flisnin arabisht dobët","Sepse khalefi ishin të paktë e të shpërndarë","Sepse selefi jetuan një jetë më të gjatë"],a:0,e:"Selefi janë «verethetu'l-enbija»; khalefi e ngatërruan dijen me burime të huaja — s'mund të jenë a'lem."},

/* ——— Lartësia (uluvvi) ——— */
{t:"Uluvvi",q:"Lartësia (uluvvi) e Allahut ndahet në:",o:["Uluvvu'dh-dhat (lartësi e Qenies) dhe uluvvu's-sifat (lartësi e cilësive)","Lartësi e dukshme dhe e fshehtë","Lartësi reale dhe metaforike","Lartësi të përhershme dhe të përkohshme"],a:0,e:"Uluvvi është cilësi dhatijje; ndahet në lartësi të Qenies (mbi krijesat) dhe lartësi të cilësive (çdo cilësi më e larta)."},
{t:"Uluvvi",q:"Dallimi mes uluvvu's-sifat dhe uluvvu'dh-dhat është:",o:["Sifat: çdo cilësi e Tij është më e larta; dhat: Qenia e Tij është mbi të gjitha krijesat","I pari: Allahu mbi Arsh; i dyti: cilësitë e larta","Të dy nënkuptojnë se Allahu është kudo","S'ka dallim real mes tyre"],a:0,e:"Uluvvu's-sifat = përsosmëria absolute e çdo cilësie; uluvvu'dh-dhat = Qenia e Allahut mbi gjithë krijesat."},
{t:"Uluvvi",q:"Lartësia e Qenies së Allahut vërtetohet me sa prova?",o:["Me pesë: Libër, Sunnet, ixhma, akl dhe fitra","Vetëm me Kuran","Me tri: Libër, Sunnet, kijas","Me dy: akl dhe hiss"],a:0,e:"Pesë burimet dëshmojnë njëzëri uluvvu'dh-dhat: Kurani, Sunneti, ixhmaja, mendja, dhe natyrshmëria."},
{t:"Uluvvi",q:"Argumenti mendor (akl) për lartësinë mbështetet në atë që:",o:["Lartësia (uluvv) është kemal, kurse poshtërsia (sufl) është naks — pra Allahut i takon kemal-i","Lartësia e poshtërsia janë të barabarta në vlerë","Lartësia është vetëm metaforë e madhështisë","Mendja s'ka fare vend në këtë çështje"],a:0,e:"Uluvvi është kemal, sufli naks; Allahut i takon çdo kemal — pra lartësia e Qenies është e domosdoshme."},
{t:"Uluvvi",q:"Cili ajet është provë e DREJTPËRDREJTË për lartësinë e Qenies?",o:["«أَأَمِنتُم مَّن فِي السَّمَاءِ» / «يَخَافُونَ رَبَّهُم مِّن فَوْقِهِمْ»","«قُلْ هُوَ اللَّهُ أَحَدٌ»","«اللَّهُ الصَّمَدُ»","«إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ»"],a:0,e:"Lartësia dëshmohet me uluvv, feukijje, istiua e «fi's-sema» — si «يَخَافُونَ رَبَّهُم مِّن فَوْقِهِمْ»."},
{t:"Uluvvi",q:"Thënia e Imam El-Euza'ijt «كنا والتابعون متوافرون نقول...» dëshmon se:",o:["Allahu, i Lartësuar qoftë, është mbi Arshin e Tij, dhe besohet në cilësitë e ardhura në Sunnet","Allahu është në çdo vend me Qenien","Cilësitë janë metaforë e madhështisë","Mendja vendos për çështjen e lartësisë"],a:0,e:"El-Euza'ij dëshmon ixhmanë e selefit (sahabë e tabi'inë) për uluvvin — «إن الله فوق عرشه»."},
{t:"Uluvvi",q:"Historia e El-Xhuvejnit me El-Hemedanin, për istiuanë, përfundon me pranimin se:",o:["Lartësia është domosdoshmëri e natyrshme (fitra) — «حيّرني الهمداني»","Allahu është kudo me Qenien e Tij","Istiuaja është vetëm metaforë e sundimit","Arshi në të vërtetë s'ekziston"],a:0,e:"El-Hemedani tregoi se tërheqja e zemrës drejt lart është fitra që s'mohohet; El-Xhuvejni pranoi: «Më hutoi Hemedani»."},
{t:"Uluvvi",q:"«سَبِّحِ اسْمَ رَبِّكَ الْأَعْلَى» dëshmon cilësinë e:",o:["Lartësisë (uluvv)","Mëshirës (rahme)","Dëgjimit (sem')","Të folurit (kelam)"],a:0,e:"«El-A'la» = më i Larti; ajeti pohon lartësinë e Allahut, prej cilësive dhatijje."},
{t:"Uluvvi",q:"Kuptimi i saktë i «وَهُوَ اللَّهُ فِي السَّمَاوَاتِ وَفِي الْأَرْضِ» është:",o:["Ai është i Adhuruari (el-ma'luh) në qiej e në tokë — hyjni e vetme kudo","Qenia e Tij është në tokë ashtu si në qiell","Allahu është i përzier me krijesat","Allahu është kudo me Qenien e Tij"],a:0,e:"Kuptimi: Ai është Ilah/Ma'luh në qiej e në tokë; kush e kupton si prani e Qenies në tokë ka gabuar e gënjen se kjo është fjalë e selefit."},

/* ——— Xhihe, Arsh, Kursi, Istiua ——— */
{t:"Arshi",q:"Nga tri mundësitë e «el-xhihe» (drejtimit) për Allahun, cila është e vërteta?",o:["Drejtimi i lartë që NUK e rrethon Allahun (epërsi që i përshtatet madhështisë)","Drejtimi i poshtëm (sufl)","Drejtimi i lartë që E RRETHON Allahun","Asnjë drejtim fare"],a:0,e:"I poshtmi kot (kundër uluvvit); i larti rrethues kot (Allahu s'rrethohet); i larti jo-rrethues i vërtetë."},
{t:"Arshi",q:"Pse «drejtimi i poshtëm (sufl)» për Allahun është i kotë?",o:["Sepse bie ndesh me lartësinë (uluvvin) e Tij mbi krijesat","Sepse drejtimi fare s'ekziston","Sepse Arshi është poshtë","Sepse e mohojnë filozofët"],a:0,e:"Sufli kundërshton uluvvu'dh-dhat që dëshmohet me Libër, Sunnet, ixhma, akl e fitra."},
{t:"Arshi",q:"Pse «drejtimi i lartë që e rrethon Allahun» është i kotë?",o:["Sepse Allahu është më i madh se ta rrethojë diçka prej krijesave","Sepse Allahu s'është i lartë fare","Sepse Arshi s'ekziston","Sepse rrethimi është metaforë"],a:0,e:"Rrethimi do të thoshte se krijesa është më e madhe se Krijuesi — e pamundur; Allahu është i lartë pa u rrethuar."},
{t:"Arshi",q:"Arshi, në kuptimin gjuhësor, do të thotë:",o:["Froni i mbretit (serir el-mulk)","Qielli i shtatë","Toka e parë","Reja mbi qiej"],a:0,e:"«El-Arsh» = serir'l-mulk; Arshi i Er-Rahmanit mbi të cilin u ngjit është froni më i madh që rrethon krijesat."},
{t:"Arshi",q:"Hadithi i Ebu Dherrit tregon raportin e Kursisë me shtatë qiejt/tokat si:",o:["Shtatë qiejt e tokat para Kursisë janë si një unazë e hedhur në shkretëtirë","Kursija dhe qiejt janë të barabartë","Kursija është nën qiejt","Qiejt janë shumë më të mëdhenj se Kursija"],a:0,e:"«ما السماوات السبع... عند الكرسي إلا كحلقة ملقاة بأرض فلاة» — e Arshi mbi Kursinë si shkretëtira mbi atë unazë."},
{t:"Arshi",q:"Transmetimi i Ibn Abasit për Kursinë është:",o:["«El-Kursijju meudi'u'l-kademejn» (vendi i dy Këmbëve)","«Kursija është vetë Arshi»","«Kursija është dija e Allahut»","«Kursija është qielli i shtatë»"],a:0,e:"Ibn Abasi: Kursija është vendi i dy Këmbëve, kurse Arshin s'mund ta masë kush."},
{t:"Arshi",q:"Një dijetar ia ktheu Xhehmiut: «Nëse s'mund ta përshkruash mënyrën e Qenies së Allahut:",o:["atëherë as cilësive s'u bën tekjif, sepse cilësia e pason të përshkruarin»","atëherë mohoje edhe Qenien»","atëherë hesht për tërë fenë»","atëherë pyet filozofët për mënyrën»"],a:0,e:"Ashtu si pohon Qenie pa kejf, pohon cilësi pa kejf — sepse njohja e mënyrës së cilësisë degëzohet nga njohja e Qenies."},
{t:"Arshi",q:"El-Kursijju, në kuptimin gjuhësor, nënkupton:",o:["Vendin ku ulesh (ndenjësen)","Fronin më të madh (Arshin)","Qiellin e shtatë","Tokën e parë"],a:0,e:"Gjuhësisht kursi = ajo mbi të cilën ulesh; është më i vogël se Arshi sipas hadithit të Ebu Dherrit."},

/* ——— Meijja (bashkësia) ——— */
{t:"Meijja",q:"Meijja (bashkësia e Allahut me krijesat) ndahet në:",o:["Të përgjithshme ('amme) dhe të veçantë (khasse)","Trupore dhe shpirtërore","Të dukshme dhe të fshehtë","Reale dhe metaforike"],a:0,e:"Meijja 'amme (gjithëpërfshirëse) dhe khasse (vetëm për besimtarët e të dërguarit) — asnjëra s'bie ndesh me uluvvin."},
{t:"Meijja",q:"Meijja e PËRGJITHSHME ('amme) nënkupton:",o:["Rrethimin e të gjitha krijesave me dije, fuqi, dëgjim, shikim e sundim","Ndihmën e posaçme të besimtarëve","Praninë trupore mes krijesave","Vetëm mëshirën e përgjithshme"],a:0,e:"Meijja 'amme buron nga rububijjeti: Allahu i rrethon të gjithë me dije e sundim; i kërkon robit murakabe."},
{t:"Meijja",q:"Meijja e VEÇANTË (khasse) nënkupton:",o:["Ndihmën (nasr) dhe përkrahjen (te'jid) për atë të cilit i përshkruhet","Rrethimin e të gjitha krijesave njësoj","Praninë trupore pranë besimtarit","Dënimin e armiqve të fesë"],a:0,e:"Meijja khasse i jep besimtarit/të dërguarit thebat; «إِنَّ اللَّهَ مَعَ الَّذِينَ اتَّقَوا»."},
{t:"Meijja",q:"Cili grup ajetesh i përket meijjes së PËRGJITHSHME ('amme)?",o:["«وَهُوَ مَعَكُمْ أَيْنَ مَا كُنتُمْ» dhe «هُوَ رَابِعُهُمْ»","«إِنَّ اللَّهَ مَعَنَا» (në shpellë)","«إِنَّنِي مَعَكُمَا أَسْمَعُ وَأَرَى»","«إِنَّ اللَّهَ مَعَ الَّذِينَ اتَّقَوا»"],a:0,e:"«Me ju kudo që të jeni» dhe «i katërti i tre vetave» shprehin meijjen 'amme (dije e rrethim), jo ndihmë të posaçme."},
{t:"Meijja",q:"«إِنَّ اللَّهَ مَعَنَا» (në shpellë) dhe «إِنَّنِي مَعَكُمَا أَسْمَعُ وَأَرَى» (Musait e Harunit) janë shembuj të meijjes:",o:["Të veçantë (khasse) — që sjell ndihmë e përkrahje","Të përgjithshme ('amme)","Trupore mes krijesave","Metaforike pa kuptim real"],a:0,e:"Të dyja janë meijje khasse: sjellin nasr e te'jid për të dërguarit e Allahut dhe pasuesit e tyre."},
{t:"Meijja",q:"Pse meijja e Allahut me krijesat NUK bie ndesh me lartësinë (uluvvin) e Tij mbi Arsh?",o:["Sepse meijja shpreh dije, fuqi e sundim — jo përzierje trupore; pra bashkëjeton me uluvvin","Sepse njëra e mohon tjetrën","Sepse Arshi fare s'ekziston","Sepse meijja është vetëm metaforë"],a:0,e:"Meijja e vërtetë bashkohet me uluvvin: Allahu është mbi Arsh e njëkohësisht me ne në dije, fuqi e sundim, pa përzierje."},
{t:"Meijja",q:"Meijja e përgjithshme i kërkon robit ___, kurse ajo e veçantë i jep ___:",o:["murakabe (vetëkontroll) / thebat (qëndrueshmëri)","frikë nga krijesat / pasuri","vetmi / dyshim","heshtje / pushtet"],a:0,e:"Kush beson meijjen 'amme ruan vetëkontrollin; kush beson atë khasse fiton qëndrueshmëri — «لَا تَحْزَنْ إِنَّ اللَّهَ مَعَنَا»."},

/* ——— Çështje të cilësive ——— */
{t:"Çështje",q:"Cilësitë lajmëruese (es-sifatu'l-khaberijje), që njihen vetëm nga teksti, përfshijnë:",o:["Fytyrën (uexh), dy duart (jedejn), dy sytë ('ajnejn)","Dijen, fuqinë, dëgjimin","Istiuanë, nuzulin, mexhi'in","Mëshirën, hidhërimin, dashurinë"],a:0,e:"Khaberijjet njihen vetëm nga lajmi (uexh, jedejn, ajnejn) e klasifikohen te cilësitë dhatijje."},
{t:"Çështje",q:"Në «لِمَا خَلَقْتُ بِيَدَيَّ», ai që i shtrembëron «dy Duart» në «fuqi» ka bërë:",o:["Tahrif (shtrembërim) të tekstit pa provë","Pohim të drejtë të cilësisë","Teuakkuf ndaj kuptimit","Pohim të mënyrës (tekjif)"],a:0,e:"Dora e shtuar te Krijuesi është reale e la'ike bihi; interpretimi i saj si «kudra/ni'me» është tahrif pa dëshmi."},
{t:"Çështje",q:"Pse interpretimi i «dy Duarve» si «fuqi» te ajeti i Iblisit është i pasaktë edhe logjikisht?",o:["Sepse fjala u shtua te Krijuesi (la'ike bihi) e teksti kërkon kuptimin real, jo metaforën pa provë","Sepse fuqia fare s'ekziston","Sepse Iblisi s'ishte real","Sepse Allahu s'ka fuqi"],a:0,e:"Kur fjala shtohet te Krijuesi merr kuptim që i përshtatet Atij; kërkohet dëshmi për largimin nga dhahiri — e muattili s'e ka."},
{t:"Çështje",q:"Qëndrimi i Ehlu Sunnetit ndaj cilësive veprore (si «يَنزِلُ رَبُّنَا إِلَى السَّمَاءِ الدُّنْيَا») është:",o:["T'i pohojnë siç erdhën, pa tahrif, ta'til, tekjif e temthil","T'i mohojnë si të pamundura","T'i interpretojnë si zbritje të mëshirës","Të heshtin për kuptimin e tyre"],a:0,e:"Nuzuli është cilësi fi'lijje reale që i përshtatet Allahut; pohohet pa u krahasuar me zbritjen e krijesave e pa tekjif."},
{t:"Çështje",q:"Vullneti (irade) i Allahut ndahet në:",o:["Kauni (meshi'eja që ndodh patjetër) dhe sher'ij (= dashuria/pëlqimi)","I madh dhe i vogël","I dukshëm dhe i fshehtë","Arab dhe joarab"],a:0,e:"Iradeja kaunijje (= meshi'e, ndodh patjetër, përfshin edhe atë që Allahu s'e do) dhe sher'ijje (= mehabbe, s'ndodh domosdo)."},
{t:"Çështje",q:"Dallimi mes iradës kaunijje dhe sher'ijje duket në atë që:",o:["Kaunijja ndodh patjetër (edhe te kafiri që Allahu e lejoi); sher'ijja është dashuri që s'ndodh domosdo","Të dyja ndodhin patjetër","Të dyja janë thjesht dashuri","S'ka dallim mes tyre"],a:0,e:"Allahu «deshi» (kaunen) kufrin e Iblisit duke e lejuar, por s'e «deshi» (sher'an), sepse s'e do kufrin."},
{t:"Çështje",q:"Cilësitë si dashuria (mehabbe), hidhërimi (gadab) e kënaqësia (rida) për Allahun janë:",o:["Cilësi reale që i përshtaten Atij, pohohen pa ngjasim","Metaforë e shpërblimit a ndëshkimit","Cilësi të krijuara në kohë","Cilësi që duhen mohuar"],a:0,e:"Ehlu Sunneti i pohon si cilësi reale la'ika bihi; interpretimi i tyre si «thevab/intikam» është tahrif."},
{t:"Çështje",q:"Shprehja «بِلَا كَيْفَ» (pa mënyrë) që thanë selefi për cilësitë nënkupton:",o:["Pohimin e cilësisë me mohimin e NJOHJES së mënyrës, jo mohimin e mënyrës vetë","Mohimin e vetë cilësisë","Mohimin e kuptimit të cilësisë","Ngjasimin e cilësisë me krijesat"],a:0,e:"«Pa kejf» s'do të thotë se cilësia s'ka kejf, por se ne s'e dimë kejfin — selefi pohuan një kejfijjet të panjohur për ne."},
{t:"Çështje",q:"Kur Imam Ahmedi tha për nuzulin «لا كيف ولا معنى», fjala «معنى» që ai mohoi ishte:",o:["Kuptimi i KOTË i Xhehmijve mohues, jo kuptimi i vërtetë","Çdo kuptim i cilësisë pa përjashtim","Kuptimi gjuhësor arab i fjalës","Kuptimi që pohuan sahabët"],a:0,e:"Ahmedi mohoi «ma'nanë» batile të Xhehmijve (që shtrembëronin dhahirin) dhe kejfijjetin — jo kuptimin e vërtetë."},

/* ——— Metoda e Ehlu Sunnetit ——— */
{t:"Metoda",q:"Metoda e Ehlu Sunnetit në POHIM (ithbat) është:",o:["Të pohojnë atë që pohoi Allahu e i Dërguari ﷺ, pa tahrif, ta'til, tekjif e temthil","Të pohojnë me ngjasim ndaj krijesave","Të pohojnë vetëm shtatë cilësi","Të interpretojnë çdo cilësi me mendje"],a:0,e:"Katër mohimet në pohim: la tahrif, la ta'til, la tekjif, la temthil."},
{t:"Metoda",q:"Metoda e Ehlu Sunnetit në MOHIM (nefj) është:",o:["Të mohojnë atë që Allahu e mohoi, bashkë me pohimin e së kundërtës së përkryer","Të mohojnë gjithçka që s'e kuptojnë","Të heshtin ndaj çdo mohimi","Të pohojnë mangësitë që s'i mohoi teksti"],a:0,e:"Mohimi s'është zbrazje: p.sh. mohimi i gjumit ngërthen pohimin e jetës e kajjumijjetit të përkryer."},
{t:"Metoda",q:"Metoda e Ehlu Sunnetit është rruga e mesme (el-kaulu'l-vesat) mes:",o:["Ehlu te'tilit (mohuesve) dhe ehlu temthilit (ngjasuesve)","Dy medh'hebeve të mëdha të fikhut","Sufive dhe fukahave","Arabëve dhe joarabëve"],a:0,e:"Ehlu Sunneti qëndron mes zbrazjes (ta'til) e ngjasimit (temthil): pohim pa temthil, tenzih pa ta'til."},
{t:"Metoda",q:"Në çështjen e akides, Ehlu Sunneti i kundërshton pikërisht:",o:["Maturiditë, Esharitë, Mutezilët, Xhehmijtë dhe filozofët gulat","Vetëm filozofët e lashtë","Çifutët e të krishterët vetëm","Katër imamët e medh'hebeve"],a:0,e:"Ehlu Sunneti kundërshton devijuesit në cilësi (Maturiditë, Esharitë, Mutezilët, Xhehmijtë, filozofët gulat) e i pohon cilësitë ashtu siç i takojnë Allahut."},
{t:"Metoda",q:"Shkaku rrënjësor i humbjes së Mumethileve e Muattileve ishte:",o:["Nisja nga një parim i gabuar (dhahiri = ngjasim) dhe dorëzimi i mendjes mbi tekstin","Padituria e plotë e gjuhës arabe","Varfëria e tyre materiale","Numri i tyre i vogël"],a:0,e:"Të dy grupet nisën nga supozimi se dhahiri do të thotë ngjasim; pastaj njëri e pohoi, tjetri e mohoi — gabimi fillestar i njëjtë."},
{t:"Metoda",q:"Pse pohimi i cilësive të Allahut NUK është teshbih?",o:["Sepse pohohen në mënyrë që i përshtatet Atij nën «لَيْسَ كَمِثْلِهِ شَيْءٌ» — përputhja në emër s'kërkon përputhje në realitet","Sepse cilësitë s'kanë kuptim real","Sepse janë metaforë e madhështisë","Sepse e thanë vetëm disa dijetarë"],a:0,e:"Dora e njeriut ndryshon nga «dora» e elefantit edhe pse ndajnë emrin; pra ndarja e emrit s'sjell ngjasim — aq më tepër Krijuesi."},
{t:"Metoda",q:"Përputhja në EMËR mes Krijuesit e krijesës (p.sh. «dorë», «dëgjim») tregon se:",o:["Nuk kërkon përputhje në realitet e në mënyrë — dallimi Krijues-krijesë është më i madh","Kërkon domosdo përputhje edhe në realitet","Është teshbih i ndaluar","Është metaforë, jo kuptim real"],a:0,e:"Përputhja në ism s'detyron përputhje në hakika; dallimi Krijues-krijesë është më i madh se mes vetë krijesave."},

/* ——— Thellim ——— */
{t:"Thellim",q:"Me emrin «El-Halik», treguesit ndahen kështu:",o:["Mutabeka → Qenia+krijimi; tedammun → njëra veç; iltizam → dija e fuqia","Mutabeka → dija; tedammun → fuqia; iltizam → Qenia","Mutabeka → fuqia; iltizam → krijimi; tedammun → Qenia","Të tria tregojnë vetëm Qenien"],a:0,e:"El-Halik: mutabeka (Qenia + krijimi), tedammun (njëra veç), iltizam (dija e fuqia që i nënkupton krijimi)."},
{t:"Thellim",q:"Pse mohimi i thjeshtë (pa pohim përsosmërie) NUK është lavdi?",o:["Sepse mund të vijë nga paaftësia a mungesa e vendit — pra edhe naks (si «muri s'bën padrejtësi»)","Sepse është shprehje e shkurtër","Sepse mohimi s'ka kuptim gjuhësor","Sepse është në gjuhë të huaj"],a:0,e:"Mohimi bëhet kemal vetëm kur ngërthen pohimin e së kundërtës; ndryshe mund të jetë thjesht mungesë (paaftësi)."},
{t:"Thellim",q:"«وَتَوَكَّلْ عَلَى الْحَيِّ الَّذِي لَا يَمُوتُ» — mohimi i vdekjes ngërthen:",o:["Pohimin e përsosmërisë së jetës së Allahut","Thjesht mungesën e vdekjes, pa kuptim tjetër","Një mangësi të fshehtë","Krahasimin me jetën e krijesave"],a:0,e:"Mohimi i vdekjes synon pohimin e jetës së përkryer e të përhershme — jo thjesht mungesën e vdekjes."},
{t:"Thellim",q:"Esharitë dhe Maturiditë, në çështjen e cilësive, klasifikohen te:",o:["Muattilet (mohues të pjesshëm — ta'til xhuz'i)","Ehlu Sunneti i plotë","Mushebbihet (ngjasuesit)","Selefi i hershëm"],a:0,e:"Ata pohojnë shtatë cilësi e mohojnë pjesën tjetër; pra bëjnë ta'til xhuz'i — grupi i parë i Muattileve te Tedmurija."},
{t:"Thellim",q:"Mutezilët, që pohojnë vetëm emrat duke mohuar cilësitë, klasifikohen si:",o:["Muattile të emrave nga kuptimet (ta'til i cilësive)","Mushebbihe të cilësive","Ehlu Sunnet me tefsir","Selef me tefuid"],a:0,e:"Mutezilët pohojnë emra pa cilësi («Alim bila ilm») — pra i zbrazin emrat nga cilësitë, lloj i ta'tilit."},
{t:"Thellim",q:"Fakti që Kurani zbriti në gjuhë arabe të qartë provon se tekstet e cilësive:",o:["Kanë kuptim të njohur që merret sipas dhahirit arab, veç kur ndalon një provë sheriatike","Janë pa kuptim fare","Janë metaforë në tërësi","Janë të fshehta nga të gjithë përveç Profetit"],a:0,e:"Gjuha e qartë kërkon kuptimin e dhahirit; largimi prej tij lejohet vetëm me dëshmi sher'ije, që te cilësitë nuk ka."},
{t:"Thellim",q:"«لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ» — mohimi i kotjes e gjumit ngërthen:",o:["Pohimin e përsosmërisë së jetës e të vazhdimësisë (kajjumijjetit) së Allahut","Një mangësi të fshehtë","Krahasimin me gjumin e krijesave","Vetëm mungesën, pa kuptim tjetër"],a:0,e:"Mohimi i gjumit s'është zbrazje, por pohim i hajat-it e kajjumijjet-it të përkryer — Ai e mban çdo gjë e s'e kap kotja."},
{t:"Thellim",q:"Si pajtohet istiuaja mbi Arsh me të qenit e Allahut «fi's-sema» (në qiell)?",o:["Të dyja tregojnë lartësinë e Allahut mbi krijesat; «fi's-sema» = mbi qiell","Janë të kundërta e përjashtojnë njëra-tjetrën","E para e mohon të dytën","S'kanë asnjë lidhje mes tyre"],a:0,e:"«Fi's-sema» nënkupton «ala's-sema» (mbi qiell); bashkë me istiuanë dëshmojnë uluvvu'dh-dhat — jo rrethim nga qielli."},
{t:"Thellim",q:"Mohimi i «tekjifit» për cilësitë NUK nënkupton mohimin e:",o:["Kuptimit dhe realitetit të cilësisë","Mënyrës (kejfijjetit) së saj","Njohjes së kejfit","Pyetjes për mënyrën"],a:0,e:"Mohojmë njohjen e kejfit, jo vetë cilësinë; cilësia është reale me kuptim të njohur, por mënyra mbetet e panjohur."},
{t:"Thellim",q:"Thënia «ما رأيتها تشفي عليلاً... وأقرب الطرق طريقة القرآن» i atribuohet:",o:["Fakhrud-Din er-Razit (në fund të jetës)","Imam Malikut","Ibn Abasit","Imam Ahmedit"],a:0,e:"Rrëfimi i Razit, prototip i mutekel-limit, që pranoi kotësinë e rrugëve racionale dhe epërsinë e rrugës së Kuranit."},
{t:"Thellim",q:"«Tefsiri» që mohoi Muhammed ibn El-Hasen (kur tha se fukahaja pajtohen në iman pa «tefsir, teshbih») i referohej:",o:["Tefsirit të Xhehmijve mohues që shpikën interpretimin, kundër asaj që ishin sahabët","Çdo tefsiri të lejuar të teksteve","Tefsirit gjuhësor të fjalëve","Tefsirit që bënte Ibn Abasi"],a:0,e:"Ashtu si te Ahmedi, «tefsiri» i mohuar është interpretimi i Xhehmijve muattile — jo pohimi i kuptimeve të vërteta."},
{t:"Thellim",q:"Ata që pretenduan se «s'ka dallim mes medh'hebit të selefit dhe të interpretuesve (mu'avvile)» bënë:",o:["Lubsu'l-hakk bil-batil (ngatërrim të së vërtetës me të kotën) — gënjeshtër ndaj selefit","Pohuan të vërtetën historike","U pajtuan drejt me selefin","Pohuan cilësitë ashtu siç duhet"],a:0,e:"Kjo është gënjeshtër: asnjë prej selefit s'e mohoi treguesin e teksteve mbi cilësitë; mu'avviletja ishin kundërshtarë të tyre."},
{t:"Thellim",q:"Fakti që interpretuesit (mu'avvile) i akuzonin selefin për teshbih provon se:",o:["Selefi i POHONin cilësitë (përndryshe s'do akuzoheshin për teshbih)","Selefi vërtet bënin teshbih","Selefi heshtnin për cilësitë","S'kishte dallim mes dy palëve"],a:0,e:"Akuza për teshbih do të kishte kuptim vetëm nëse selefi pohonin cilësi; pra ata s'ishin tefuidxhinj të kuptimit, por pohues."},
{t:"Thellim",q:"Dëshmia e fitres për lartësinë e Allahut shfaqet qartë kur njeriu në fatkeqësi:",o:["E ngre zemrën e duart lart drejt Allahut, pa e mësuar nga askush","Shikon drejt tokës","E mohon Zotin nga dëshpërimi","I drejtohet filozofëve për zgjidhje"],a:0,e:"Çdo lutës, arab e joarab, kur i bie fatkeqësia e ngre zemrën lart — dëshmi e fitres së pandryshuar për uluvvin."},
{t:"Thellim",q:"«أَفَمَن يَخْلُقُ كَمَن لَّا يَخْلُقُ» dhe «هَلْ تَعْلَمُ لَهُ سَمِيًّا» përdoren si prova për:",o:["Mohimin e temthilit — Krijuesi s'është si krijesa, s'ka të ngjashëm","Mohimin e vetë cilësive","Pohimin e ngjasimit të kontrolluar","Pohimin e tekjifit të cilësive"],a:0,e:"Të dy ajetet rrëzojnë temthilin: Krijuesi ndryshon rrënjësisht nga krijesa e s'ka «semijj» (të ngjashëm)."},
